<style>
  html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; left: 50%; top: 50%; width: 844px; height: 390px; transform-origin: center center; overflow: hidden; background: #0B0B14; }
  #loading { position: fixed; inset: 0; z-index: 5; background: #0B0B14 url(icons/loading-stadium.jpg) center / cover no-repeat; color: #F4F4FA; font-family: 'Barlow Condensed', system-ui, sans-serif; transition: opacity .4s ease; }
  #loading.out { opacity: 0; pointer-events: none; }
  #loading .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,11,20,.35) 0%, rgba(11,11,20,.05) 35%, rgba(11,11,20,.25) 60%, rgba(11,11,20,.94) 100%); }
  #loading .brand { position: absolute; left: 0; right: 0; top: 12%; display: flex; align-items: center; justify-content: center; gap: 16px; font-weight: 800; font-style: italic; font-size: clamp(36px, 9vh, 72px); letter-spacing: 2px; text-shadow: 0 4px 0 #0B0B14, 0 0 30px rgba(34,211,238,.45); }
  #loading .brand img { width: clamp(56px, 13vh, 96px); height: auto; border-radius: 22%; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  #loading .ld { position: absolute; left: 8%; right: 8%; bottom: 8%; display: flex; flex-direction: column; gap: 8px; }
  #loading .row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: clamp(15px, 3.6vh, 22px); letter-spacing: 1px; text-shadow: 0 2px 0 #0B0B14; }
  #loading .row b { color: #FFC53D; font-size: 1.25em; }
  #loading .bar { height: clamp(10px, 2.6vh, 16px); border-radius: 99px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); overflow: hidden; }
  #loading .fill { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, #22D3EE, #67E8F9 60%, #FFC53D); box-shadow: 0 0 14px rgba(34,211,238,.8); }
  #loading .tip { font-family: system-ui, sans-serif; font-weight: 600; font-size: clamp(11px, 2.6vh, 14px); color: #CACAE0; text-shadow: 0 1px 0 #0B0B14; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0B0B14; color: #F4F4FA; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font: 700 16px system-ui, sans-serif; text-align: center; padding: 24px; }
  body.portrait #rotate { display: flex; }
  #rotate svg { animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
</style>

  <div class="shade"></div>
  <div class="brand"><img src="icons/icon-192.png?v=3" alt="">ARENA MIX</div>
  <div class="ld">
    <div class="row"><span id="ld-msg">Abriendo el estadio…</span><b id="ld-pct">0%</b></div>
    <div class="bar"><div class="fill" id="ld-fill"></div></div>
    <div class="tip" id="ld-tip"></div>
  </div>
</div>
<div id="rotate">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
  Gira el móvil para jugar en horizontal
</div>
