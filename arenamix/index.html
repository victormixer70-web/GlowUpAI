<style>
  /* the game's fonts, bundled so they look the same offline: Luckiest Guy for titles, buttons and numbers, Lilita One for
     everything else. The screens ask for 'Barlow Condensed' (titles) and 'Exo2' (text); both names point at the new
     faces, sized to fit the room the old ones had. */
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 100 900; font-display: swap; size-adjust: 80%; src: url(vendor/fonts/russoone-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Exo2'; font-style: normal; font-weight: 100 900; font-display: swap; size-adjust: 96%; src: url(vendor/fonts/lilitaone-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Titulos'; font-display: swap; size-adjust: 92%; src: url(vendor/fonts/russoone-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Luckiest Guy'; font-display: swap; src: url(vendor/fonts/luckiestguy-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Lilita One'; font-display: swap; src: url(vendor/fonts/lilitaone-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Rajdhani'; font-weight: 500; src: url(vendor/fonts/rajdhani-500.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Rajdhani'; font-weight: 600; src: url(vendor/fonts/rajdhani-600.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Rajdhani'; font-weight: 700; src: url(vendor/fonts/rajdhani-700.woff2) format('woff2'); font-display: swap; }
  /* no slanted (fake italic) lettering anywhere */
  html, body, #stage * { font-synthesis-style: none; }
  /* Luckiest Guy draws lowercase as small capitals: whatever uses the title face is shown in capitals */
  [style*="Barlow Condensed"], [font-family*="Barlow"], .bc-title, .bc-btn, .bc-btn-gold, .hm-pass-lv b, .st-plus1, #am-res .t, #am-res .sc, #am-res .lv, #am-res .lvup, #am-res .go, #am-res .cn b, #am-rw .it b, #am-rw .ok, #am-rw .tap { text-transform: uppercase; }
  html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; left: 50%; top: 50%; width: 844px; height: 390px; transform-origin: center center; overflow: hidden; background: #0B0B14; }
  #loading { position: fixed; inset: 0; z-index: 5; background: #05060a; overflow: hidden; transition: opacity .45s ease; font-family: 'Rajdhani', system-ui, sans-serif; }
  #loading.out { opacity: 0; pointer-events: none; }
  /* the artwork is 1024x576 (16:9); this box covers the screen keeping that ratio, so the live bar lands exactly on the drawn one */
  #loading .art { position: absolute; left: 50%; top: 50%; width: max(100vw, 177.78vh); height: max(56.25vw, 100vh); transform: translate(-50%, calc(-50% + max(0px, (56.25vw - 100vh) * 0.32))); background: url(icons/loading-bg3.jpg?v=4) center / 100% 100% no-repeat; }
  /* the progress bar, dressed like the title: a slanted black plate with an electric rim, an energy fill
     with stripes running along it, and the match ball rolling at its tip */
  #loading .fill { --h: max(1.5vw, 2.9vh); position: absolute; left: 50%; bottom: 12%; width: min(50vw, 96vh); height: var(--h); transform: translateX(-50%) skewX(-16deg); background: repeating-linear-gradient(90deg, rgba(30,139,255,.10) 0 2px, transparent 2px 14px), linear-gradient(180deg, #050A22, #02040C); box-shadow: 0 0 0 3px #02040C, 0 0 0 5px #1E8BFF, 0 0 0 6.5px rgba(191,230,255,.8), 0 0 26px 6px rgba(30,139,255,.55), inset 0 3px 8px rgba(0,0,0,.8); transition: opacity .3s; }
  #loading .fill i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: repeating-linear-gradient(-60deg, rgba(255,255,255,.22) 0 8px, transparent 8px 18px) 0 0 / 40px 100%, linear-gradient(180deg, #BFE6FF 0%, #3DA9FF 38%, #1E6FF0 55%, #0A3DCC 100%); box-shadow: 0 0 16px #3DA9FF, inset 0 -3px 0 rgba(2,4,12,.35); transition: width .12s linear; animation: ldStripes .6s linear infinite; }
  @keyframes ldStripes { to { background-position: 40px 0, 0 0; } }
  /* the white-hot front edge */
  #loading .fill i::after { content: ''; position: absolute; right: 0; top: -2px; bottom: -2px; width: 18px; background: linear-gradient(90deg, transparent, #FFFFFF); filter: blur(2px); }
  /* the ball rolls at the tip (straightened back up from the plate's slant) */
  #loading .fill .ldb { position: absolute; right: 0; top: 50%; width: calc(var(--h) * 2.1); height: calc(var(--h) * 2.1); margin: calc(var(--h) * -1.05) calc(var(--h) * -1.05) 0 0; transform: skewX(16deg); filter: drop-shadow(0 0 8px #7EC8FF) drop-shadow(0 2px 2px #000A); animation: ldRoll .7s linear infinite; z-index: 2; }
  @keyframes ldRoll { to { rotate: 360deg; } }
  #loading .ldk { position: absolute; left: calc(50% - min(25vw, 48vh)); bottom: calc(12% + max(1.5vw, 2.9vh) + 10px); color: #BFE6FF; font-family: 'Titulos', sans-serif; font-size: max(1.15vw, 2.2vh); letter-spacing: .18em; text-shadow: 0 2px 0 #02040C, 0 0 10px #1E8BFF; }
  #loading .ldk::after { content: '...'; display: inline-block; width: 1.4em; text-align: left; animation: ldDots 1.2s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
  @keyframes ldDots { from { width: 0; } to { width: 1.4em; } }
  #loading .pct::before { content: none; }
  @keyframes ldSpin { to { transform: rotate(360deg); } }
  /* tips that change while it loads, over the picture's own line */
  #loading .tip { position: absolute; left: 50%; bottom: 2.5%; translate: -50% 0; display: flex; align-items: center; gap: .6em; padding: .35em 1.1em .35em .8em; border-radius: 99px; background: rgba(4,8,12,.82); box-shadow: 0 0 0 1px rgba(155,239,255,.25), 0 0 18px rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: #DDE8F4; font-family: Exo2, system-ui, sans-serif; font-weight: 600; font-size: max(1vw, 1.8vh); white-space: nowrap; }
  #loading .tip b { color: #FFC53D; font-weight: 800; }
  #loading .tip span { transition: opacity .3s; }
  /* the live percentage in the medallion, over the picture's own number */
  /* the percentage, just above the bar */
  /* the percentage: a little plate of its own at the bar's right end, chrome figures like the title */
  #loading .pct { position: absolute; left: calc(50% + min(25vw, 48vh) + max(1.6vw, 3vh)); bottom: calc(12% - max(.55vw, 1vh)); min-width: 3.4em; padding: .12em .5em; text-align: center; transform: skewX(-16deg); background: linear-gradient(180deg, #0A1A4A, #02040C); box-shadow: 0 0 0 3px #02040C, 0 0 0 5px #1E8BFF, 0 0 18px rgba(30,139,255,.6); color: #F4F7FF; font-family: 'Titulos', sans-serif; font-size: max(1.5vw, 2.8vh); line-height: 1.15; letter-spacing: .03em; text-shadow: 0 2px 0 #02040C, 0 0 10px #3DA9FF; z-index: 1; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0B0B14; color: #F4F4FA; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font: 700 16px Exo2, system-ui, sans-serif; text-align: center; padding: 24px; }
  body.portrait #rotate { display: flex; }
  #rotate svg { animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
