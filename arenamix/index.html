<style>
  /* the game's fonts, bundled so they look the same offline: Luckiest Guy for titles, buttons and numbers, Lilita One for
     everything else. The screens ask for 'Barlow Condensed' (titles) and 'Exo2' (text); both names point at the new
     faces, sized to fit the room the old ones had. */
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 100 900; font-display: swap; size-adjust: 84%; src: url(vendor/fonts/luckiestguy-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Exo2'; font-style: normal; font-weight: 100 900; font-display: swap; size-adjust: 96%; src: url(vendor/fonts/lilitaone-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Luckiest Guy'; font-display: swap; src: url(vendor/fonts/luckiestguy-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Lilita One'; font-display: swap; src: url(vendor/fonts/lilitaone-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Rajdhani'; font-weight: 500; src: url(vendor/fonts/rajdhani-500.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Rajdhani'; font-weight: 600; src: url(vendor/fonts/rajdhani-600.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: 'Rajdhani'; font-weight: 700; src: url(vendor/fonts/rajdhani-700.woff2) format('woff2'); font-display: swap; }
  /* Luckiest Guy draws lowercase as small capitals: whatever uses the title face is shown in capitals */
  [style*="Barlow Condensed"], [font-family*="Barlow"], .bc-title, .bc-btn, .bc-btn-gold, .hm-pass-lv b, .st-plus1, #am-res .t, #am-res .sc, #am-res .lv, #am-res .lvup, #am-res .go, #am-res .cn b, #am-rw .it b, #am-rw .ok, #am-rw .tap { text-transform: uppercase; }
  html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; left: 50%; top: 50%; width: 844px; height: 390px; transform-origin: center center; overflow: hidden; background: #0B0B14; }
  #loading { position: fixed; inset: 0; z-index: 5; background: #05060a; overflow: hidden; transition: opacity .45s ease; font-family: 'Rajdhani', system-ui, sans-serif; }
  #loading.out { opacity: 0; pointer-events: none; }
  /* the artwork is 1024x576 (16:9); this box covers the screen keeping that ratio, so the live bar lands exactly on the drawn one */
  #loading .art { position: absolute; left: 50%; top: 50%; width: max(100vw, 177.78vh); height: max(56.25vw, 100vh); transform: translate(-50%, calc(-50% + max(0px, (56.25vw - 100vh) * 0.32))); background: url(icons/loading-bg2.jpg?v=1) center / 100% 100% no-repeat; }
  /* the row of balls is the progress bar: the ones still to load are dimmed and switch on as it loads */
  /* the progress bar, on the pitch under the logo: a glass track and a rainbow fill with a light running along it */
  #loading .fill { position: absolute; left: 50%; width: min(46vw, 92vh); translate: -50% 0; bottom: 12%; height: max(1.1vw, 2.2vh); border-radius: 99px; background: rgba(6,10,40,.72); box-shadow: 0 0 0 2px rgba(190,240,255,.55), 0 0 22px rgba(34,211,238,.55), inset 0 2px 6px rgba(0,0,0,.6); overflow: hidden; transition: opacity .3s; }
  #loading .fill i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #22D3EE, #3B82F6 35%, #A855F7 65%, #FFC53D); box-shadow: 0 0 14px #7EF0FF; transition: width .12s linear; overflow: hidden; }
  #loading .fill i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent) -100% 0 / 40% 100% no-repeat; animation: ldRun 1.1s linear infinite; }
  @keyframes ldRun { to { background-position: 250% 0; } }
  #loading .pct::before { content: none; }
  @keyframes ldSpin { to { transform: rotate(360deg); } }
  /* tips that change while it loads, over the picture's own line */
  #loading .tip { position: absolute; left: 50%; bottom: 2.5%; translate: -50% 0; display: flex; align-items: center; gap: .6em; padding: .35em 1.1em .35em .8em; border-radius: 99px; background: rgba(4,8,12,.82); box-shadow: 0 0 0 1px rgba(155,239,255,.25), 0 0 18px rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: #DDE8F4; font-family: Exo2, system-ui, sans-serif; font-weight: 600; font-size: max(1vw, 1.8vh); white-space: nowrap; }
  #loading .tip b { color: #FFC53D; font-weight: 800; }
  #loading .tip span { transition: opacity .3s; }
  /* the live percentage in the medallion, over the picture's own number */
  /* the percentage, just above the bar */
  #loading .pct { position: absolute; left: 50%; bottom: calc(12% + max(1.1vw, 2.2vh) + 2px); transform: translate(-50%, 0); color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: max(2vw, 3.6vh); letter-spacing: .04em; text-shadow: 0 0 14px #3B82F6, 0 3px 0 #05060A, 0 0 2px #05060A; z-index: 1; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0B0B14; color: #F4F4FA; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font: 700 16px Exo2, system-ui, sans-serif; text-align: center; padding: 24px; }
  body.portrait #rotate { display: flex; }
  #rotate svg { animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
