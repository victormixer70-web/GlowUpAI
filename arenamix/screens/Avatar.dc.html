<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#FF8A3D"},"secondary":{"editor":"color","default":"#0A0F1C"},"pattern":{"editor":"enum","options":["solid","stripes","pin","hoops","band","sash","halves","centre","diag"],"default":"solid"},"shorts":{"editor":"color","default":"#141B2D"},"socks":{"editor":"color","default":"#F2F5FA"},"shoe":{"editor":"color","default":"#C8F031"},"number":{"editor":"text","default":"10"},"crest":{"editor":"text","default":""},"crestShape":{"editor":"enum","options":["shield","circle","diamond"],"default":"shield"},"crestMark":{"editor":"enum","options":["none","star","bolt","crown","ball","moon"],"default":"none"},"numColor":{"editor":null},"hat":{"editor":"enum","options":["none","band","cap","top","chef","viking","prop","crown","sprout","phones"],"default":"none"},"hatColor":{"editor":"color","default":"#C8F031"},"face":{"editor":"enum","options":["none","sun","round","star","3d","ski","stache"],"default":"none"},"w":{"editor":"int","default":200,"min":40,"max":600},"$preview":{"width":200,"height":354}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.cid = 'jc' + Math.random().toString(36).slice(2, 9);
  }
  lum(hex) {
    const h = String(hex || '#000000').replace('#', '');
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }
  renderVals() {
    const p = this.props;
    const w = Number(p.w ?? 200);
    const primary = p.primary ?? '#FF8A3D';
    const secondary = p.secondary ?? '#0A0F1C';
    const pattern = p.pattern ?? 'solid';
    const hat = p.hat ?? 'none';
    const face = p.face ?? 'none';
    const numColor = p.numColor ?? (this.lum(primary) > 0.6 ? (this.lum(secondary) < 0.6 ? secondary : '#0A0F1C') : '#F2F5FA');
    return {
      wpx: w + 'px',
      hpx: Math.round(w * 354 / 200) + 'px',
      clipId: this.cid,
      primary, secondary,
      shorts: p.shorts ?? '#141B2D',
      socks: p.socks ?? '#F2F5FA',
      shoe: p.shoe ?? '#C8F031',
      number: p.number ?? '10',
      crest: p.crest ?? '',
      hasCrest: !!(p.crest ?? ''),
      crestShield: (p.crestShape ?? 'shield') === 'shield', crestCircle: p.crestShape === 'circle', crestDiamond: p.crestShape === 'diamond',
      markStar: p.crestMark === 'star', markBolt: p.crestMark === 'bolt', markCrown: p.crestMark === 'crown', markBall: p.crestMark === 'ball', markMoon: p.crestMark === 'moon',
      numColor,
      hatColor: p.hatColor ?? '#C8F031',
      patStripes: pattern === 'stripes', patPin: pattern === 'pin', patHoops: pattern === 'hoops', patBand: pattern === 'band',
      patSash: pattern === 'sash', patHalves: pattern === 'halves', patCentre: pattern === 'centre', patDiag: pattern === 'diag',
      hatBand: hat === 'band', hatCap: hat === 'cap', hatTop: hat === 'top', hatChef: hat === 'chef', hatViking: hat === 'viking',
      hatProp: hat === 'prop', hatCrown: hat === 'crown', hatSprout: hat === 'sprout', hatPhones: hat === 'phones',
      faceSun: face === 'sun', faceRound: face === 'round', faceStar: face === 'star', face3d: face === '3d', faceSki: face === 'ski', faceStache: face === 'stache'
    };
  }
}
</script>
