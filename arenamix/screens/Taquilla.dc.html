<!doctype html>
<html lang="es">
<head>

<title>Taquilla</title>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
input::placeholder{color:#8686A6}
@keyframes tqRing{to{rotate:360deg}}
@keyframes tqBeam{0%,100%{rotate:-8deg}50%{rotate:8deg}}
@keyframes tqTag{0%,100%{rotate:-4deg}50%{rotate:3deg}}
@keyframes tqHint{0%,100%{translate:-6px 0}50%{translate:6px 0}}
.tq-ring{position:absolute;left:50%;border-radius:50%;transform:translateX(-50%) perspective(400px) rotateX(72deg);pointer-events:none}
.tq-ring i{position:absolute;inset:0;border-radius:50%;animation:tqRing 6s linear infinite}
.tq-item{transition:translate .2s,box-shadow .2s}
.tq-item:hover{translate:0 -3px}
.tq-3d{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.tq-item:hover .tq-3d,.tq-item:active .tq-3d{transform:scale(1.12) rotate(-5deg)}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; box-sizing: border-box; background: radial-gradient(120% 100% at 60% 0%, #17163A 0%, #0B0B14 65%); isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif; overflow: hidden">

    <span style="margin-bottom: 6px"><svg width="46" height="46" viewBox="0 0 512 512" role="img" aria-label="ARENA MIX" style="display: block; flex: none"><defs><linearGradient id="am-logo-taquilla" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1A44"/><stop offset="1" stop-color="#0B0B14"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#am-logo-taquilla)" stroke="#2E2E52" stroke-width="10"/><path d="M60 400L470 150" stroke="#22D3EE" stroke-opacity=".12" stroke-width="70" stroke-linecap="round"/><text x="256" y="350" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-style="italic" font-size="270" letter-spacing="-6"><tspan fill="#F4F4FA">A</tspan><tspan fill="#22D3EE" dx="90">M</tspan></text><path d="M262 120L222 238h38l-26 104l80-140h-42l30-82z" fill="#FFC53D" stroke="#0B0B14" stroke-width="10" stroke-linejoin="round"/></svg></span>
    <a href="Deportes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #A3A3C2; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4l13 8l-13 8z"/></svg>Jugar</a>
    <a href="Taquilla.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #0B0B14; background: #22D3EE"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3L3 6l2 5l3-1v11h8V10l3 1l2-5l-5-3a4 4 0 0 1-8 0z"/></svg>Taquilla</a>
    <a href="Tienda.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #A3A3C2; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Tienda</a>
    <a href="Estadisticas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #A3A3C2; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</a>

  <!-- the locker room: lockers, spotlight, a turntable and you -->
  <div style="position: absolute; left: 80px; top: 0; bottom: 0; width: 392px; overflow: hidden">
    <div style="position: absolute; inset: 0 0 92px 0; background: repeating-linear-gradient(90deg, #1B2246 0 44px, #10142C 44px 47px); box-shadow: inset 0 -30px 40px #07070F"></div>
    <div style="position: absolute; left: 0; right: 0; top: 18px; height: 2px; background: #2C3566"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: repeating-linear-gradient(90deg, transparent 0 14px, #ffffff0d 14px 30px, transparent 30px 47px); mask-image: linear-gradient(180deg, transparent 20%, #000 30%, #000 40%, transparent 50%); -webkit-mask-image: linear-gradient(180deg, transparent 20%, #000 30%, #000 40%, transparent 50%)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: linear-gradient(180deg, #2A2238, #120E1C); border-top: 2px solid #3A3460"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: repeating-linear-gradient(100deg, #ffffff06 0 2px, transparent 2px 38px)"></div>
    <div style="position: absolute; left: 96px; top: -40px; width: 200px; height: 440px; transform-origin: 50% 0; background: linear-gradient(180deg, #E8F6FF55, #E8F6FF00 85%); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); filter: blur(6px); mix-blend-mode: screen; animation: tqBeam 7s ease-in-out infinite; pointer-events: none"></div>
    <div class="tq-ring" style="bottom: 62px; margin-left: 20px; width: 230px; height: 230px; margin-bottom: -115px"><i style="border: 3px dashed #22D3EE88"></i><i style="inset: 22px; border: 2px solid #7C5CFF77; animation-direction: reverse; animation-duration: 9s"></i><i style="inset: 50px; background: radial-gradient(circle, #22D3EE55, transparent 70%); animation: none"></i></div>
    <sc-if value="{{show3d}}" hint-placeholder-val="{{ false }}">
      <canvas ref="{{canvasRef}}" role="img" aria-label="{{viewerLabel}}" onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pUp}}" style="position: absolute; left: 40px; right: 0; top: 40px; bottom: 6px; width: calc(100% - 40px); height: calc(100% - 46px); display: block; touch-action: none; cursor: grab"></canvas>

  <!-- the rail: categories, leagues, the clothes on hangers, and the action -->
  <div style="position: absolute; left: 462px; top: 0; right: 0; bottom: 0; clip-path: polygon(7% 0, 100% 0, 100% 100%, 0 100%); background: linear-gradient(160deg, #191936F2, #0E0E1EF2)"></div>
  <div style="position: absolute; left: 462px; top: 0; width: 30px; bottom: 0; background: linear-gradient(180deg, #22D3EE, #7C5CFF); clip-path: polygon(88% 0, 100% 0, 12% 100%, 0 100%)"></div>
  <div style="position: absolute; left: 498px; right: 14px; top: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px">

    </div>
    <div role="tablist" aria-label="Categoría" style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 3px; border-radius: 14px; background: #0B0B14AA; border: 1px solid #2E2E58">

      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="{{c.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.icon}}"/></svg>{{c.label}}</button>

        </sc-for>

    </sc-if>
    <div key="{{gridKey}}" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding-top: 2px">

          </sc-if>
          <span style="max-width: 100%; font-size: 10px; font-weight: 700; line-height: 1.15; color: #F4F4FA; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
          <span style="{{it.labelStyle}}">
            <sc-if value="{{it.isCoins}}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC53D"/></svg></sc-if>
            {{it.label}}

        </button>
      </sc-for>
      </div>
    </div>
    <div style="flex: none; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 8px 6px 12px; border-radius: 14px; background: #0B0B14AA; border: 1px solid #2E2E58">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
        <span style="font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{selName}}</span>
        <span style="font-size: 11px; color: #A3A3C2">{{selHint}}</span>
      </div>
      <sc-if value="{{showEquip}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{doEquip}}" class="am-pulse am-shine" style="height: 40px; padding: 0 18px; border: 0; transform: skewX(-12deg); background: linear-gradient(135deg, #7EF0FF, #22D3EE 55%, #0EA5C0); color: #0B0B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 20px; letter-spacing: 1.5px; cursor: pointer">EQUIPAR</button>
      </sc-if>
      <sc-if value="{{showEquipped}}" hint-placeholder-val="{{ false }}">
        <span style="display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px; border-radius: 18px; background: #22D3EE1F; border: 1px solid #22D3EE66; color: #22D3EE; font-weight: 800; font-size: 12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l9-10"/></svg>Puesto</span>
      </sc-if>
      <sc-if value="{{showBuy}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{doBuy}}" style="{{buyStyle}}">COMPRAR · {{selPrice}}</button>
      </sc-if>
      <sc-if value="{{showReward}}" hint-placeholder-val="{{ false }}">
        <a href="{{rewardHref}}" style="display: flex; align-items: center; height: 38px; padding: 0 14px; transform: skewX(-12deg); border: 2px solid #9B6BFF; color: #C4B5FD; text-decoration: none; font-weight: 800; font-size: 12px"><span style="transform: skewX(12deg)">CÓMO CONSEGUIRLO</span></a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sport: 'futbol',
      cat: 'equipos',
      league: { futbol: 0, basket: 0, tenis: 0, voley: 0 },
      preview: null,
      coins: (() => { try { const W = JSON.parse(localStorage.getItem('arenamix.wallet.v1') || 'null'); return W && typeof W.coins === 'number' ? W.coins : 2450; } catch (e) { return 2450; } })(),
      bought: [],
      equip: {
        futbol: { equipos: 'futbol-0-0', cabeza: 'h0', cara: 'f0', calzado: 's1' },
        basket: { equipos: 'basket-0-0', cabeza: 'h9', cara: 'f0', calzado: 's2' },
        tenis: { equipos: 'tenis-0-0', cabeza: 'h0', cara: 'f0', calzado: 's1' },
        voley: { equipos: 'voley-0-0', cabeza: 'h0', cara: 'f0', calzado: 's1' }
      }
    };
    // what you equipped and bought stays saved between visits
    try {
      const k = JSON.parse(localStorage.getItem('arenamix.locker.v1') || 'null');
      if (k && k.equip) {
        Object.keys(this.state.equip).forEach((sp) => { if (k.equip[sp]) this.state.equip[sp] = { ...this.state.equip[sp], ...k.equip[sp] }; });
        if (Array.isArray(k.bought)) this.state.bought = k.bought;
      }
    } catch (e) {}
    this.saveLocker(this.state.equip, this.state.bought);
    this.state.char = window.AMChars ? window.AMChars.pref() : 'clasico';
    this.rotY = 0.35; this.spin = 0; this.drag = null;
    this.canvasRef = (el) => { if (el && el !== this.cv) { this.cv = el; this.init3D(); } else if (!el && this.cv) { this.stop3D(); } };
  }
  componentWillUnmount() { this.stop3D(); }
  /* ---------- 3D locker room: your character in the kit you are looking at, turned with a finger ---------- */
  init3D() {
    const T = window.THREE, A = window.AMChars;
    if (!T || !A || !this.cv) return;
    this.stop3D();
    const R = new T.WebGLRenderer({ canvas: this.cv, antialias: true, alpha: true });
    R.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.15;
    R.setClearColor(0x000000, 0);
    this.R = R;
    const S = new T.Scene();
    S.add(new T.HemisphereLight(0xdfe8ff, 0x2a2440, 0.9));
    const key = new T.DirectionalLight(0xffffff, 1.1); key.position.set(2, 4, 4); S.add(key);
    const rim = new T.DirectionalLight(0x22d3ee, 0.6); rim.position.set(-3, 2.5, -3); S.add(rim);
    this.S = S;
    this.cam = new T.PerspectiveCamera(28, 1, 0.1, 50);
    if (window.AMSky) window.AMSky.env(R).then((e) => { if (e && this.R === R) { S.environment = e; } });
    this.modelKey = ''; this.model = null; this.t0 = performance.now();
    A.load().then(() => { if (this.R === R) this.modelKey = ''; });
    const loop = () => {
      if (this.R !== R) return;
      this.raf = requestAnimationFrame(loop);
      this.frame3D();
    };
    this.raf = requestAnimationFrame(loop);
  }
  stop3D() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    if (this.R) { this.R.dispose(); this.R = null; }
    this.model = null; this.modelKey = '';
  }
  frame3D() {
    const T = window.THREE, A = window.AMChars, R = this.R, cv = this.cv;
    if (!R || !cv || !this.want) return;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    if (this.sz !== w + 'x' + h) { this.sz = w + 'x' + h; R.setSize(w, h, false); this.cam.aspect = w / h; this.cam.updateProjectionMatrix(); }
    // rebuild the character when the character or the outfit being looked at changes
    const key = this.want.char + '|' + JSON.stringify(this.want.kit);
    if (key !== this.modelKey && A.ready()) {
      if (this.model) this.S.remove(this.model);
      this.model = A.make({ char: this.want.char, kit: this.want.kit, noRing: true, gear: true });
      if (this.model) this.S.add(this.model);
      this.modelKey = key;
    }
    const now = performance.now(), dt = Math.min(0.05, (now - (this.tPrev || now)) / 1000);
    this.tPrev = now;
    if (!this.drag) { this.rotY += this.spin * dt; this.spin *= Math.pow(0.04, dt); if (Math.abs(this.spin) < 0.05) this.spin = 0; }
    if (this.model) {
      this.model.rotation.y = this.rotY;
      const an = this.model.userData.anim;
      if (an && A.clip('idle')) an.layers = [{ id: 'idle', t: (now - this.t0) / 1000, w: 1 }];
    }
    // frame the whole body, a little lower than centre so the chips below don't cover the feet
    const fit = Math.max(2.95 / (2 * Math.tan(this.cam.fov * Math.PI / 360)), 1.1 / (2 * Math.tan(this.cam.fov * Math.PI / 360) * this.cam.aspect));
    this.cam.position.set(0, 1.2, fit);
    this.cam.lookAt(0, 0.98, 0);
    R.render(this.S, this.cam);

  /* saves the locker, plus the resolved outfit per sport that the games dress your character in

        const e = equip[sp], [, li, ti] = e.equipos.split('-');

          hat: hat ? hat.kind : 'none', hatColor: hat && hat.color || '', face: face ? face.kind : 'none' };
      });
      localStorage.setItem('arenamix.locker.v1', JSON.stringify({ equip, bought }));

          ['Osaka Ámbar', '#FFB81C', K, 'solid', K, '#FFB81C'], ['Osaka Azul', '#003DA5', W, 'solid', '#003DA5', '#003DA5'],
          ['Nagoya Negro', K, '#E30613', 'solid', K, K], ['Aichi Rojo', '#E30613', W, 'solid', '#E30613', '#E30613'],
          ['Tokio Verde', '#00843D', W, 'solid', '#00843D', '#00843D'], ['Hiroshima Púrpura', '#4B2E83', '#FFD100', 'solid', '#4B2E83', '#4B2E83'],
          ['Shizuoka Azul', '#1E5AA8', W, 'solid', '#1E5AA8', '#1E5AA8'], ['Sakai Naranja', '#F28C00', '#003DA5', 'solid', '#003DA5', '#F28C00'],
          ['Nagano Rojo', '#C8102E', W, 'solid', W, '#C8102E'], ['Hokkaidō Celeste', '#5DADE2', '#002D72', 'solid', '#002D72', '#5DADE2']] }
      ]
    };
  }
  extras() {
    return {
      cabeza: [
        { id: 'h0', name: 'Ninguno', kind: 'none', st: 'owned' },
        { id: 'h9', name: 'Cinta Volt', kind: 'band', color: '#C8F031', st: 'owned' },
        { id: 'h1', name: 'Gorra', kind: 'cap', color: '#2F4BA8', st: 'owned' },
        { id: 'h2', name: 'Sombrero de copa', kind: 'top', st: 'coins', price: 900 },
        { id: 'h3', name: 'Gorro de chef', kind: 'chef', st: 'coins', price: 700 },
        { id: 'h4', name: 'Casco vikingo', kind: 'viking', st: 'reward', req: 'Oro 1', how: 'rank' },
        { id: 'h5', name: 'Gorro hélice', kind: 'prop', st: 'coins', price: 600 },
        { id: 'h6', name: 'Corona', kind: 'crown', st: 'premium' },
        { id: 'h7', name: 'Brote', kind: 'sprout', st: 'reward', req: '10 victorias', how: 'wins' },
        { id: 'h8', name: 'Auriculares', kind: 'phones', st: 'coins', price: 800 }
      ],
      cara: [
        { id: 'f0', name: 'Ninguno', kind: 'none', st: 'owned' },
        { id: 'f1', name: 'Gafas de sol', kind: 'sun', st: 'owned' },
        { id: 'f2', name: 'Gafas redondas', kind: 'round', st: 'coins', price: 500 },
        { id: 'f3', name: 'Gafas estrella', kind: 'star', st: 'coins', price: 650 },
        { id: 'f4', name: 'Gafas 3D', kind: 'd3', st: 'reward', req: 'Plata 1', how: 'rank' },
        { id: 'f5', name: 'Máscara de esquí', kind: 'ski', st: 'coins', price: 750 },
        { id: 'f6', name: 'Bigote', kind: 'stache', st: 'premium' }
      ],
      calzado: [
        { id: 's1', name: 'Volt', color: '#C8F031', st: 'owned' },
        { id: 's2', name: 'Blanco', color: '#F2F5FA', st: 'owned' },
        { id: 's3', name: 'Naranja', color: '#FF8A3D', st: 'coins', price: 900 },
        { id: 's4', name: 'Carmesí', color: '#E5484D', st: 'reward', req: '10 victorias', how: 'wins' },
        { id: 's5', name: 'Celeste', color: '#3EA6FF', st: 'coins', price: 700 },
        { id: 's6', name: 'Oro', color: '#FFC53D', st: 'premium' }
      ]
    };
  }
  initials(n) {
    return n.split(' ').filter((w) => w.length > 2 || /^[A-ZÁÉÍÓÚ]/.test(w)).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  }
  crestVariants(L) {
    if (this._cv) return this._cv;
    const seen = {}, out = {};
    const byName = {};
    Object.keys(L).forEach((sp) => L[sp].forEach((lg, li) => lg.teams.forEach((t, ti) => {
      if (byName[t[0]] === undefined) {
        const ini = this.initials(t[0]);
        const h = ini.split('').reduce((a, ch) => a + ch.charCodeAt(0) * 7, 0);
        const g = seen[ini] = (seen[ini] ?? -1) + 1;
        byName[t[0]] = (h + g) % 18;
      }
      out[sp + '-' + li + '-' + ti] = byName[t[0]];
    })));
    this._cv = out;
    return out;
  }
  teamItem(sport, li, ti, L) {
    const t = L[sport][li].teams[ti];
    const rules = [
      { st: 'owned' }, { st: 'coins', price: 1500 }, { st: 'coins', price: 1500 },
      { st: 'reward', req: 'Plata 1', how: 'rank' }, { st: 'coins', price: 1200 }, { st: 'premium' }
    ];
    const crest = this.initials(t[0]);
    const v = this.crestVariants(L)[sport + '-' + li + '-' + ti];
    const crestShape = ['shield', 'circle', 'diamond'][v % 3];
    const crestMark = ['star', 'bolt', 'crown', 'none', 'ball', 'moon'][Math.floor(v / 3) % 6];
    return { id: sport + '-' + li + '-' + ti, crest, crestShape, crestMark, name: t[0], primary: t[1], secondary: t[2], pattern: t[3], shorts: t[4], socks: t[5], ...rules[ti % rules.length] };
  }
  jerseyBg(p, s, pat) {
    if (pat === 'stripes') return 'repeating-linear-gradient(90deg, ' + p + ' 0 6px, ' + s + ' 6px 12px)';
    if (pat === 'pin') return 'repeating-linear-gradient(90deg, ' + p + ' 0 5px, ' + s + ' 5px 6.5px)';
    if (pat === 'hoops') return 'repeating-linear-gradient(0deg, ' + p + ' 0 6px, ' + s + ' 6px 12px)';
    if (pat === 'band') return 'linear-gradient(0deg, ' + p + ' 50%, ' + s + ' 50% 64%, ' + p + ' 64%)';
    if (pat === 'sash') return 'linear-gradient(135deg, ' + p + ' 38%, ' + s + ' 38% 58%, ' + p + ' 58%)';
    if (pat === 'halves') return 'linear-gradient(90deg, ' + p + ' 50%, ' + s + ' 50%)';
    if (pat === 'centre') return 'linear-gradient(90deg, ' + p + ' 38%, ' + s + ' 38% 62%, ' + p + ' 62%)';
    if (pat === 'diag') return 'linear-gradient(135deg, ' + p + ' 50%, ' + s + ' 50%)';
    return p;
  }
  fmt(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  renderVals() {
    const s = this.state;
    const L = this.leagues();
    const X = this.extras();
    const sport = s.sport;
    const eq = s.equip[sport];

    const findItem = (cat, id) => {
      if (cat === 'equipos') {
        const [sp, li, ti] = id.split('-');
        return this.teamItem(sp, Number(li), Number(ti), L);
      }
      return X[cat].find((i) => i.id === id);
    };
    const owned = (it) => it.st === 'owned' || s.bought.includes(it.id);

    const outfit = { ...eq };
    if (s.preview) outfit[s.preview.cat] = s.preview.id;
    const kitItem = findItem('equipos', outfit.equipos);
    const headItem = findItem('cabeza', outfit.cabeza);
    const faceItem = findItem('cara', outfit.cara);
    const shoeItem = findItem('calzado', outfit.calzado);
    const kindMap = { none: 'none', band: 'band', cap: 'cap', top: 'top', chef: 'chef', viking: 'viking', prop: 'prop', crown: 'crown', sprout: 'sprout', phones: 'phones' };
    const faceMap = { none: 'none', sun: 'sun', round: 'round', star: 'star', d3: '3d', ski: 'ski', stache: 'stache' };

    const SPORTS = [
      { id: 'futbol', label: 'Fútbol', num: '10' }, { id: 'basket', label: 'Basket', num: '23' },
      { id: 'tenis', label: 'Tenis', num: '7' }, { id: 'voley', label: 'Vóley', num: '4' }
    ];
    const CATS = [
      { id: 'equipos', label: 'Equipos' }, { id: 'cabeza', label: 'Cabeza' },
      { id: 'cara', label: 'Cara' }, { id: 'calzado', label: 'Calzado' }
    ];
    const tab = (on) => 'min-height: 40px; padding: 0 4px; border-radius: 12px; font: 800 13px Exo2, sans-serif; cursor: pointer; ' + (on ? 'background: #22D3EE; color: #0B0B14; border: 0; box-shadow: 0 3px 0 #0E8FA3;' : 'background: #17172A; color: #CACAE0; border: 1px solid #2E2E52;');
    const chip = (on) => 'position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 46px; border: 0; border-radius: 11px; background: transparent; font: 800 10px Exo2, sans-serif; letter-spacing: .5px; cursor: pointer; transition: color .3s; color: ' + (on ? '#0B0B14;' : '#A3A3C2;');
    const lchip = (on) => 'flex: none; height: 28px; padding: 0 12px; transform: skewX(-12deg); font: 800 11px Exo2, sans-serif; cursor: pointer; white-space: nowrap; ' + (on ? 'background: #FFC53D; color: #1A1206; border: 0; box-shadow: 0 0 10px #FFC53D66;' : 'background: #17172A; color: #CACAE0; border: 1px solid #2E2E58;');

    // only football for now: the other sports' kits come back with their own game
    const sports = SPORTS.filter((sp) => sp.id === 'futbol').map((sp) => ({ label: sp.label, style: tab(sp.id === sport), pick: () => this.setState({ sport: sp.id, preview: null }) }));
    const ICON = { equipos: 'M8 3L3 6l2 5l3-1v11h8V10l3 1l2-5l-5-3a4 4 0 0 1-8 0z', cabeza: 'M4 16a8 8 0 0 1 16 0zM12 8V6M20 16h3', cara: 'M3 10h7v3a3 3 0 0 1-6 0zM14 10h7v3a3 3 0 0 1-6 0zM10 11h4', calzado: 'M4 8h7l2 4c4 0 8 1 9 5v2H4zM3 19h19' };
    const cats = CATS.map((c) => ({ label: c.label.toUpperCase(), icon: ICON[c.id], sel: c.id === s.cat ? 'true' : 'false', style: chip(c.id === s.cat), pick: () => this.setState({ cat: c.id, preview: null }) }));
    const ci = CATS.findIndex((c) => c.id === s.cat);
    const li = s.league[sport];
    const leagues = L[sport].map((lg, i) => ({ name: lg.name, style: lchip(i === li), pick: () => this.setState({ league: { ...s.league, [sport]: i }, preview: null }) }));

    const list = s.cat === 'equipos'
      ? L[sport][li].teams.map((t, ti) => this.teamItem(sport, li, ti, L))
      : X[s.cat];
    const selId = s.preview && s.preview.cat === s.cat ? s.preview.id : eq[s.cat];
    const items = list.map((it) => {
      const own = owned(it);
      const equipped = eq[s.cat] === it.id;
      const sel = it.id === selId;
      let label = 'En propiedad', color = '#A3A3C2';
      if (equipped) { label = 'Equipado'; color = '#22D3EE'; }
      else if (!own && it.st === 'coins') { label = this.fmt(it.price); color = '#FFC53D'; }
      else if (!own && it.st === 'reward') { label = it.req; color = '#CACAE0'; }
      else if (!own && it.st === 'premium') { label = '[PRECIO]'; color = '#FF8A3D'; }
      const k = {};
      ['none', 'band', 'cap', 'top', 'chef', 'viking', 'prop', 'crown', 'sprout', 'phones', 'sun', 'round', 'star', 'd3', 'ski', 'stache'].forEach((x) => { k[x] = it.kind === x; });
      return {
        name: it.name, label, color: it.color || '#2F4BA8', k,
        isKit: s.cat === 'equipos', is3d: s.cat !== 'equipos',
        thumb: s.cat !== 'equipos' && window.AMGear ? window.AMGear.thumb(s.cat, it) : '',
        crest: it.crest || '',
        crestStyle: s.cat === 'equipos' ? 'position: absolute; left: 24%; top: 28%; width: 13px; height: 13px; ' + ({ shield: 'border-radius: 2px 2px 7px 7px;', circle: 'border-radius: 50%;', diamond: 'clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);' })[it.crestShape] + ' background: ' + it.secondary + '; color: ' + it.primary + '; font: 800 6px Exo2, sans-serif; display: flex; align-items: center; justify-content: center; letter-spacing: -.3px;' : '',
        jerseyStyle: s.cat === 'equipos' ? 'position: relative; display: block; width: 46px; height: 44px; background: ' + this.jerseyBg(it.primary, it.secondary, it.pattern) + '; clip-path: polygon(32% 0, 68% 0, 100% 18%, 88% 42%, 78% 36%, 78% 100%, 22% 100%, 22% 36%, 12% 42%, 0 18%); filter: drop-shadow(0 2px 0 #00000055);' : '',
        isCoins: !own && it.st === 'coins',
        isReward: !own && it.st === 'reward',
        style: (() => { const rc = equipped ? '#22D3EE' : own ? '#8A93C8' : it.st === 'coins' ? '#FFC53D' : it.st === 'reward' ? '#9B6BFF' : '#FF8A3D'; return 'position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 98px; margin-top: 8px; padding: 8px 3px 5px 3px; box-sizing: border-box; border-radius: 12px; font-family: Exo2, sans-serif; cursor: pointer; min-width: 0; background: linear-gradient(180deg, ' + rc + '30, #141428 70%); border: ' + (sel ? '2px solid ' + rc : '1px solid ' + rc + '55') + '; border-top: 3px solid ' + rc + '; box-shadow: ' + (sel ? '0 0 14px ' + rc + '88, 0 6px 12px #0008' : '0 6px 12px #0006') + ';'; })(),
        labelStyle: 'display: flex; align-items: center; gap: 3px; max-width: 100%; white-space: nowrap; overflow: hidden; font-size: 10.5px; font-weight: 800; color: ' + color + ';',
        pick: () => this.setState({ preview: { cat: s.cat, id: it.id } })
      };
    });

    const selItem = findItem(s.cat, selId);
    const selOwned = owned(selItem);
    const selEquipped = eq[s.cat] === selItem.id;
    const canAfford = selItem.st === 'coins' && s.coins >= selItem.price;
    let selHint = 'En tu taquilla';
    if (selEquipped) selHint = 'Lo llevas puesto';
    else if (!selOwned && selItem.st === 'coins') selHint = canAfford ? 'Disponible por carrascos' : 'Te faltan carrascos';
    else if (!selOwned && selItem.st === 'reward') selHint = selItem.how === 'rank' ? 'Recompensa: alcanza ' + selItem.req : 'Recompensa: gana ' + selItem.req;
    else if (!selOwned && selItem.st === 'premium') selHint = 'Objeto premium';

    const equipNow = (extra) => {
      const equip = { ...s.equip, [sport]: { ...s.equip[sport], [s.cat]: selItem.id } };
      this.saveLocker(equip, (extra && extra.bought) || s.bought);
      this.setState({ equip, preview: null, ...(extra || {}) });
    };
    const sportObj = SPORTS.find((x) => x.id === sport);
    const league = L[sport][Number(kitItem.id.split('-')[1])];

    const A = window.AMChars, charId = s.char || 'clasico', show3d = !!(A && window.THREE && charId !== 'clasico');
    this.want = { char: charId, kit: { primary: kitItem.primary, secondary: kitItem.secondary, pattern: kitItem.pattern, shorts: kitItem.shorts, socks: kitItem.socks, shoe: shoeItem.color, hat: headItem.kind, hatColor: headItem.color || '', face: faceItem.kind } };
    const chars = (A ? A.list : []).concat([{ id: 'clasico', name: 'Clásico' }]);
    const charChips = chars.map((c) => {
      const on = c.id === charId;
      return {
        name: c.name, short: c.id === 'granny' ? 'Granny' : c.id === 'vegas' ? 'Vegas' : c.name, on: on ? 'true' : 'false',
        img: c.id === 'clasico' ? '' : 'assets/chars/' + c.id + '.png',
        pick: () => { if (A) A.setPref(c.id); this.setState({ char: c.id }); },
        style: 'flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 20px; cursor: pointer; overflow: hidden; transition: transform .2s; ' + (on ? 'border: 2px solid #22D3EE; background: #0E8FA3; box-shadow: 0 0 12px #22D3EE; transform: scale(1.15);' : 'border: 1px solid #2E2E58; background: #17172ACC;'),
        imgStyle: c.id === 'clasico' ? 'display: none;' : 'flex: none; width: 30px; height: 30px; border-radius: 15px;',
        textStyle: c.id === 'clasico' ? 'font: 800 8px Exo2, sans-serif; color: #F4F4FA;' : 'display: none;'
      };
    });
    return {
      show3d, show2d: !show3d, charChips, canvasRef: this.canvasRef,
      viewerLabel: 'Tu personaje con la equipación ' + kitItem.name + '. Desliza para girarlo.',
      pDown: (e) => { e.preventDefault(); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) {} this.drag = { id: e.pointerId, x: e.clientX, t: performance.now() }; this.spin = 0; },
      pMove: (e) => {
        const d = this.drag;
        if (!d || d.id !== e.pointerId) return;
        const now = performance.now(), dx = e.clientX - d.x;
        this.rotY += dx * 0.013;
        this.spin = dx * 0.013 / Math.max(0.008, (now - d.t) / 1000);
        d.x = e.clientX; d.t = now;
      },
      pUp: (e) => { if (this.drag && this.drag.id === e.pointerId) { if (performance.now() - this.drag.t > 80) this.spin = 0; this.drag = null; } },
      coinsLabel: this.fmt(s.coins),
      sports, cats, leagues, items,
      catThumb: 'position: absolute; top: 3px; bottom: 3px; left: calc(3px + ' + ci + ' * (100% - 6px) / 4); width: calc((100% - 6px) / 4); border-radius: 11px; background: linear-gradient(135deg, #7EF0FF, #22D3EE); box-shadow: 0 0 12px #22D3EE88; transition: left .4s cubic-bezier(.3,1.5,.5,1);',
      gridKey: s.cat + ':' + li,
      kitTeam: kitItem.name, kitLeague: league.name,
      isTeams: s.cat === 'equipos',
      kit: kitItem,
      kitName: kitItem.name + ' · ' + league.name,
      shoe: shoeItem.color,
      number: sportObj.num,
      hat: kindMap[headItem.kind] || 'none',
      hatColor: headItem.color || '#22D3EE',
      face: faceMap[faceItem.kind] || 'none',
      isPreviewing: !!s.preview && s.preview.id !== eq[s.preview.cat],
      selName: selItem.name,
      selHint,
      selPrice: selItem.st === 'coins' ? this.fmt(selItem.price) + ' C' : '',
      showEquipped: selEquipped,
      showEquip: selOwned && !selEquipped,
      showBuy: !selOwned && selItem.st === 'coins',
      showReward: !selOwned && selItem.st === 'reward',
      showPremium: !selOwned && selItem.st === 'premium',
      rewardHref: selItem.how === 'rank' ? 'Rangos.dc.html' : 'Tienda.dc.html',
      buyStyle: 'height: 40px; padding: 0 14px; border: 0; transform: skewX(-12deg); font-family: \'Barlow Condensed\', sans-serif; font-weight: 800; font-style: italic; font-size: 18px; letter-spacing: .5px; cursor: pointer; ' + (canAfford ? 'background: linear-gradient(135deg, #FFE38A, #FFC53D 55%, #D9A520); color: #2A1C02; box-shadow: 0 0 14px #FFC53D66;' : 'background: #26264A; color: #6E6E92; cursor: default;'),
      doEquip: () => equipNow(),
      doBuy: () => {
        if (!canAfford) return;
        try { localStorage.setItem('arenamix.wallet.v1', JSON.stringify({ coins: s.coins - selItem.price })); } catch (e) {}
        equipNow({ coins: s.coins - selItem.price, bought: [...s.bought, selItem.id] });
      }
    };
  }
}
</script>
