a{color:#22D3EE}a:hover{color:#67E8F9}

@keyframes lgHolo{to{background-position:200% 0}}

@keyframes lgTicketIn{from{opacity:0;translate:-60px 0}to{opacity:1;translate:0 0}}
@keyframes lgTitleIn{from{opacity:0;letter-spacing:30px}to{opacity:1;letter-spacing:-2px}}
@keyframes lgHint{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes lgLive{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes lgStubFly{to{translate:90px 140px;rotate:38deg;opacity:0}}
@keyframes lgMainFlash{0%{filter:brightness(1)}40%{filter:brightness(1.8)}100%{filter:brightness(1)}}
.lg-card{position:absolute;left:514px;top:44px;width:304px;height:330px;transform-origin:50% -46px;animation:lgIn .6s cubic-bezier(.2,1.4,.4,1) both,lgSwing 6s 0.6s ease-in-out infinite}
.lg-card:focus-within{animation-play-state:running,paused}
.lg-field{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:9px;border:1px solid #2E2E58;background:#07070FCC;transition:border-color .2s,box-shadow .2s}
.lg-field:focus-within{border-color:#22D3EE;box-shadow:0 0 0 3px #22D3EE33}
.lg-field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#F4F4FA;font:700 13px Exo2,sans-serif}

.lg-ticket .main{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 14px;background:linear-gradient(120deg,#FFE38A,#FFC53D 45%,#F59E0B);border-radius:10px 0 0 10px;color:#1A1206;text-align:left;-webkit-mask:radial-gradient(circle 7px at 100% 50%,#0000 98%,#000);mask:radial-gradient(circle 7px at 100% 50%,#0000 98%,#000);animation:lgPulse 2s 1s ease-in-out infinite}
.lg-ticket .stub{position:relative;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(120deg,#22D3EE,#0EA5C0);border-radius:0 10px 10px 0;color:#0B0B14;border-left:2px dashed #0B0B1466;-webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000);mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000)}
.lg-ticket.torn .stub{animation:lgStubFly .38s cubic-bezier(.5,0,.8,.5) forwards}
.lg-ticket.torn .main{animation:lgMainFlash .3s ease-out}
.lg-ticket:active .main{translate:0 2px}
.lg-social{flex:none;width:40px;height:36px;border-radius:9px;border:1px solid #2E2E58;background:#07070FCC;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>

            <button type="button" class="lg-social" aria-label="Entrar con Apple" onClick="{{soon}}"><svg width="14" height="16" viewBox="0 0 16 18" fill="#F4F4FA"><path d="M13 9.5c0-2 1.6-3 1.7-3c-1-1.4-2.4-1.6-2.9-1.6c-1.2-.1-2.4.7-3 .7s-1.6-.7-2.6-.7C4.8 5 3.4 5.8 2.7 7.1c-1.5 2.6-.4 6.4 1 8.5c.7 1 1.5 2.1 2.6 2.1c1-.1 1.4-.7 2.6-.7s1.6.7 2.6.7c1.1 0 1.8-1 2.5-2c.8-1.1 1.1-2.2 1.1-2.3c0 0-2.1-.8-2.1-3.9zM11 3.3c.6-.7 1-1.6.9-2.6c-.8 0-1.9.6-2.5 1.3c-.6.6-1 1.6-.9 2.5c.9.1 1.9-.5 2.5-1.2z"/></svg></button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { torn: false, toast: '', kicks: 0 };
    this.fans = 47000 + Math.floor(Math.random() * 9000);
    this.serial = String(1000 + Math.floor(Math.random() * 9000));
    this.canvasRef = (el) => { if (el && el !== this.cv) { this.cv = el; this.init3D(); } else if (!el && this.cv) { this.stop3D(); this.cv = null; } };
    this.crowdRef = (el) => { if (el && el !== this.cc) { this.cc = el; this.initCrowd(); } };
  }
  componentWillUnmount() { this.stop3D(); cancelAnimationFrame(this.craf); clearTimeout(this.toastT); clearInterval(this.fanT); }
  componentDidMount() { this.fanT = setInterval(() => { this.fans += Math.floor(Math.random() * 40); this.forceUpdate(); }, 1500); }
  /* ---------- the stands: a bowl of seats, floodlights and camera flashes (2D, cheap) ---------- */
  initCrowd() {
    const cv = this.cc, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = 844 * dpr; cv.height = 390 * dpr;
    const x = cv.getContext('2d');
    // the static part, painted once
    const st = document.createElement('canvas'); st.width = cv.width; st.height = cv.height;
    const s = st.getContext('2d'); s.scale(dpr, dpr);
    for (let k = 0; k < 7; k++) {
      // tiers of the bowl, each a ring of seats lit a little less than the one below
      const y = 150 + k * 16, a = 0.10 + k * 0.035;
      s.fillStyle = 'rgba(' + (20 + k * 4) + ',' + (30 + k * 6) + ',' + (80 + k * 8) + ',' + a + ')';
      s.beginPath(); s.ellipse(422, y + 260, 620 - k * 10, 270, 0, Math.PI, 2 * Math.PI); s.fill();
    }
    // the crowd: thousands of tiny heads in the team colours
    const cols = ['#22D3EE', '#FF8A3D', '#F4F4FA', '#7C5CFF', '#FFC53D'];
    for (let n = 0; n < 2600; n++) {
      const t = Math.random() * Math.PI, rr = 0.55 + Math.random() * 0.45;
      const px = 422 + Math.cos(t) * 640 * rr, py = 420 - Math.sin(t) * 300 * rr;
      if (py > 236 || py < 60) continue;
      s.globalAlpha = 0.15 + Math.random() * 0.35; s.fillStyle = cols[n % 5];
      s.fillRect(px, py, 1.6, 1.6);
    }
    s.globalAlpha = 1;
    // the pitch, seen from the tunnel, fading into the night
    const g = s.createLinearGradient(0, 236, 0, 390);
    g.addColorStop(0, '#0E5A33'); g.addColorStop(1, '#04140C');
    s.fillStyle = g; s.beginPath(); s.moveTo(-40, 390); s.lineTo(160, 236); s.lineTo(684, 236); s.lineTo(884, 390); s.fill();
    s.strokeStyle = '#FFFFFF22'; s.lineWidth = 2;
    s.beginPath(); s.ellipse(250, 330, 150, 34, 0, 0, Math.PI * 2); s.stroke();
    s.beginPath(); s.moveTo(422, 236); s.lineTo(422, 390); s.stroke();
    // floodlight towers
    this.lights = [[318, 40], [452, 26], [596, 14]];
    this.lights.forEach(([lx, ly]) => {
      s.fillStyle = '#0B0B18'; s.fillRect(lx - 1.5, ly, 3, 130);
      s.fillStyle = '#E8F6FF'; for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) s.fillRect(lx - 14 + i * 7, ly - 8 + j * 6, 5, 4);
    });
    this.flashes = Array.from({ length: 36 }, () => ({ x: Math.random() * 844, y: 70 + Math.random() * 160, t: Math.random() * 3 }));
    let last = performance.now();
    const loop = (now) => {
      this.craf = requestAnimationFrame(loop);
      if (now - last < 33) return;
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height); x.drawImage(st, 0, 0);
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      // floodlight glare, breathing a little
      const tt = now / 1000;
      this.lights.forEach(([lx, ly], i) => {
        const r = 70 + 8 * Math.sin(tt * 1.3 + i), gl = x.createRadialGradient(lx, ly, 0, lx, ly, r);
        gl.addColorStop(0, 'rgba(232,246,255,.55)'); gl.addColorStop(0.25, 'rgba(160,210,255,.18)'); gl.addColorStop(1, 'rgba(160,210,255,0)');
        x.fillStyle = gl; x.fillRect(lx - r, ly - r, r * 2, r * 2);
      });
      // camera flashes popping all over the stands
      this.flashes.forEach((f) => {
        f.t -= dt;
        if (f.t < 0) { f.t = 0.6 + Math.random() * 3; f.x = Math.random() * 844; f.y = 70 + Math.random() * 160; }
        if (f.t < 0.12) {
          const k = f.t / 0.12, rr = 6 * k + 1;
          const gf = x.createRadialGradient(f.x, f.y, 0, f.x, f.y, rr * 3);
          gf.addColorStop(0, 'rgba(255,255,255,' + (0.9 * k) + ')'); gf.addColorStop(1, 'rgba(255,255,255,0)');
          x.fillStyle = gf; x.fillRect(f.x - rr * 3, f.y - rr * 3, rr * 6, rr * 6);
        }
      });
    };
    this.craf = requestAnimationFrame(loop);
  }
  /* ---------- your player in 3D, in a pool of light; tap them and they strike the ball ---------- */
  init3D() {
    const T = window.THREE, A = window.AMChars;
    if (!T || !A || !this.cv) return;
    this.stop3D();
    const R = new T.WebGLRenderer({ canvas: this.cv, antialias: true, alpha: true });
    R.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); R.setSize(500, 390, false);
    R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.15; R.setClearColor(0, 0);
    this.R = R;
    const S = new T.Scene();
    S.add(new T.HemisphereLight(0xdfe8ff, 0x1a2040, 0.85));
    const key = new T.DirectionalLight(0xffffff, 1.2); key.position.set(2.5, 5, 4); S.add(key);

  buildModel() {

  }
