<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Penaltis 1vs1</title>
<script src="./support.js"></script>
<script src="/_blob/de0c1b42c380e04fabb186f97a299f57"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: #0B0B14; color: #F4F4FA; font-family: Manrope, sans-serif">
  <sc-if value="{{isIntro}}" hint-placeholder-val="{{ true }}">
    <svg width="844" height="390" viewBox="0 0 844 390" style="position: absolute; left: 0; top: 0">
      <path d="M0 0H470L370 390H0Z" fill="#FF8A3D" opacity=".14"/>
      <path d="M844 0H474L374 390H844Z" fill="{{oppColor}}" opacity=".14"/>
      <path d="M470 0L370 390" stroke="#22D3EE" stroke-width="3"/>
    </svg>
    <a href="Modos.dc.html" aria-label="Volver a modos" style="position: absolute; left: 12px; top: 12px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #17172A; color: #F4F4FA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
    </a>
    <span style="position: absolute; left: 0; right: 0; top: 20px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 30px; letter-spacing: 2px">PENALTIS 1VS1</span>
    <div style="position: absolute; left: 70px; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <dc-import name="Avatar" primary="#FF8A3D" secondary="#0B0B14" pattern="solid" shorts="#17172A" socks="#F4F4FA" shoe="#22D3EE" number="10" hat="band" hat-color="#22D3EE" face="none" w="120" hint-size="120px,212px"></dc-import>
      <span style="font-weight: 800; font-size: 15px">Invitado_4821</span>
    </div>
    <div style="position: absolute; right: 70px; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <dc-import name="Avatar" primary="{{oppColor}}" secondary="#F4F4FA" pattern="halves" shorts="#17172A" socks="{{oppColor}}" shoe="#F4F4FA" number="9" hat="cap" hat-color="{{oppColor}}" face="none" w="120" hint-size="120px,212px"></dc-import>
      <span style="font-weight: 800; font-size: 15px">{{oppName}}</span>
    </div>
    <div style="position: absolute; left: 272px; width: 300px; top: 84px; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 64px; line-height: 1; color: #22D3EE; text-shadow: 0 4px 0 #0B0B14">VS</span>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px">
        <span style="padding: 5px 10px; border-radius: 8px; background: #17172A; font-size: 12px; font-weight: 700">5 tiros cada uno</span>
        <span style="padding: 5px 10px; border-radius: 8px; background: #17172A; font-size: 12px; font-weight: 700">Tiras y paras por turnos</span>
        <span style="padding: 5px 10px; border-radius: 8px; background: #17172A; font-size: 12px; font-weight: 700; color: #FFC53D">Muerte súbita si hay empate</span>
      </div>
      <button type="button" onClick="{{play}}" style="margin-top: 6px; height: 56px; padding: 0 42px; border: 0; border-radius: 16px; background: #22D3EE; color: #0B0B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 26px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 6px 0 #0E8FA3">EMPEZAR</button>
    </div>
  </sc-if>
  <sc-if value="{{isPlay}}" hint-placeholder-val="{{ false }}">
    <dc-import name="Duelo" kind="pen" rival-name="{{oppName}}" hint-size="844px,390px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const names = ['Kai_Striker', 'LunaGol_09', 'ToroVeloz', 'Mika10', 'Zeta_FC', 'Nico_Volea'];
    const colors = ['#A78BFA', '#E5484D', '#2FBF71', '#5B2A86'];
    this.state = { phase: 'intro', oppName: names[Math.floor(Math.random() * names.length)], oppColor: colors[Math.floor(Math.random() * colors.length)] };
  }
  renderVals() {
    const s = this.state;
    return {
      isIntro: s.phase === 'intro', isPlay: s.phase === 'play',
      oppName: s.oppName, oppColor: s.oppColor,
      play: () => this.setState({ phase: 'play' })
    };
  }
}
</script>
</body>
</html>
