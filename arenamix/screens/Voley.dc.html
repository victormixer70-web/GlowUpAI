<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: #0E0E1C; color: #F4F4FA; font-family: Manrope, sans-serif; user-select: none; -webkit-user-select: none">
  <canvas ref="{{canvasRef}}" width="844" height="390" style="position: absolute; left: 0; top: 0; width: 844px; height: 390px; display: block"></canvas>
  <svg width="844" height="390" viewBox="0 0 844 390" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <polyline points="{{swipePts}}" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  </svg>
  <button type="button" aria-label="{{zoneLabel}}" onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pCancel}}" style="position: absolute; inset: 0; width: 844px; height: 390px; padding: 0; border: 0; background: transparent; touch-action: none; cursor: crosshair"></button>
  <sc-if value="{{no3d}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #CACAE0">Tu navegador no permite gráficos 3D (WebGL) en esta vista.</div></sc-if>

  <div style="position: absolute; left: 12px; top: 10px; z-index: 2; display: flex; align-items: center; gap: 8px">
    <a href="Modos.dc.html" aria-label="Volver a modos" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #0B0B14CC; color: #F4F4FA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
    </a>
    <span style="padding: 8px 12px; border-radius: 12px; background: #0B0B14CC; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 20px; letter-spacing: 1px">VÓLEY</span>
    <div style="{{tabsStyle}}">
      <button type="button" onClick="{{setServe}}" style="{{serveTab}}">Saque</button>
      <button type="button" onClick="{{setSpike}}" style="{{spikeTab}}">Remate</button>
    </div>
  </div>
  <div style="position: absolute; right: 12px; top: 10px; display: flex; gap: 6px">
    <span style="display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 4px 10px; border-radius: 12px; background: #0B0B14CC"><span style="font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #A3A3C2">BALÓN</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1">{{ballLabel}}</span></span>
    <span style="display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 4px 10px; border-radius: 12px; background: #0B0B14CC"><span style="font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #A3A3C2">PUNTOS</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; color: #A78BFA">{{ptsLabel}}</span></span>
  </div>
  <sc-if value="{{showJump}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{doJump}}" style="position: absolute; right: 16px; bottom: 22px; width: 96px; height: 96px; border-radius: 48px; border: 0; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 22px; color: #0B0B14; background: #A78BFA; box-shadow: 0 6px 0 #6D28D9">SALTAR</button>
  </sc-if>
  <sc-if value="{{showHint}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; pointer-events: none">
      <span style="padding: 6px 14px; border-radius: 10px; background: #0B0B14CC; font-size: 12px; font-weight: 700; color: #CACAE0">{{hintText}}</span>
    </div>
  </sc-if>
  <sc-if value="{{showResult}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 60px; display: flex; flex-direction: column; align-items: center; pointer-events: none">
      <span style="{{resultStyle}}">{{resultText}}</span>
      <span style="font-size: 13px; font-weight: 800; text-shadow: 0 2px 0 #0B0B14">{{resultSub}}</span>
    </div>
  </sc-if>
  <sc-if value="{{showStart}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: #0B0B14B3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 40px">{{startTitle}}</span>
      <span style="font-size: 13px; color: #CACAE0; text-align: center; max-width: 480px; line-height: 1.5">{{startText}}</span>
      <button type="button" onClick="{{start}}" style="height: 54px; padding: 0 40px; border: 0; border-radius: 14px; background: #A78BFA; color: #0B0B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 26px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 6px 0 #6D28D9">EMPEZAR</button>
    </div>
  </sc-if>
  <sc-if value="{{showDone}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: #0B0B14D9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #A3A3C2">{{startTitle}}</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: #A78BFA">{{ptsLabel}} <span style="font-size: 26px; color: #A3A3C2">puntos</span></span>
      <span style="font-size: 14px; font-weight: 700">{{doneSub}}</span>
      <button type="button" onClick="{{doneAction}}" style="margin-top: 8px; height: 50px; padding: 0 30px; border: 0; border-radius: 14px; background: #A78BFA; color: #0B0B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 5px 0 #6D28D9">{{doneBtn}}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":null},"locked":{"editor":null},"onEnd":{"editor":null},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 0 };
    this.tick = this.tick.bind(this);
    this.canvasRef = (el) => { if (el && el !== this.cv) { this.cv = el; this.init3D(); } };
    this.mode = props.mode === 'spike' ? 'spike' : 'serve';
    this.best = { serve: 0, spike: 0 };
    this.reset();
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    if (this.R) { this.R.dispose(); this.R = null; }
  }
  reset() {
    this.st = this.loadSportStats('voley');
    this.n = 0; this.pts = 0; this.good = 0;
    this.phase = 'start';
    this.newBall();
  }
  newBall() {
    this.result = null; this.swipe = null; this.pt = 0; this.jumpT = -1; this.hitDone = false; this.netTouch = false;
    this.zone = { x: [-3, 0, 3][Math.floor(Math.random() * 3)], z: [-2.5, -6.5][Math.floor(Math.random() * 2)] };
    this.rec = { x: (Math.random() - 0.5) * 4, z: -6.5, vx: 0, vz: 0 };
    this.blk = [{ x: -1.5, j: 0 }, { x: 1.5, j: 0 }];
    if (this.mode === 'serve') {
      this.me = { x: (Math.random() - 0.5) * 3, z: 10.2 };
      this.b = { x: this.me.x + 0.3, y: 1.4, z: 9.9, vx: 0, vy: 0, vz: 0, spin: 0 };
      this.phase = this.phase === 'start' ? 'start' : 'toss';
    } else {
      this.setX = (Math.random() - 0.5) * 4;
      this.me = { x: this.setX - 0.5, z: 3.6 };
      this.b = { x: 2.5, y: 2.3, z: 1.0, vx: 0, vy: 0, vz: 0, spin: 0 };
      this.phase = this.phase === 'start' ? 'start' : 'set';
    }
  }
  loop() {
    if (this.raf) return;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.tick);
  }
  tick(now) {
    const dt = Math.min(0.033, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    for (let i = 0; i < 5; i++) this.step(dt / 5);
    this.draw3D(dt);
    this.forceUpdate();
    this.raf = this.phase !== 'start' && this.phase !== 'done' ? requestAnimationFrame(this.tick) : null;
  }
  fly(b, dt) {
    const sp = Math.hypot(b.vx, b.vy, b.vz);
    b.vy -= 9.81 * dt;
    b.vx -= 0.02 * sp * b.vx * dt; b.vy -= 0.02 * sp * b.vy * dt; b.vz -= 0.02 * sp * b.vz * dt;
    b.vy -= (b.spin || 0) * 0.0025 * sp * sp * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  }
  solve(from, tx, tz, speed, spin) {
    let best = null;
    for (let a = -0.6; a <= 1.0; a += 0.01) {
      const d = Math.hypot(tx - from.x, tz - from.z), ux = (tx - from.x) / d, uz = (tz - from.z) / d;
      const s = { x: from.x, y: from.y, z: from.z, vx: ux * Math.cos(a) * speed, vy: Math.sin(a) * speed, vz: uz * Math.cos(a) * speed, spin };
      let clear = true;
      for (let i = 0; i < 1200 && s.y > 0.105; i++) { const pz = s.z; this.fly(s, 1 / 240); if (pz > 0 && s.z <= 0 && s.y < 2.43 + 0.25) clear = false; }
      const err = Math.hypot(s.x - tx, s.z - tz) + (clear ? 0 : 50);
      if (!best || err < best.err - 0.02) best = { err, a, vx: ux * Math.cos(a) * speed, vy: Math.sin(a) * speed, vz: uz * Math.cos(a) * speed };
    }
    return best;
  }
  launchTo(tx, tz, speed, spin, err) {
    const sol = this.solve(this.b, tx, tz, speed, spin);
    Object.assign(this.b, { vx: sol.vx + (Math.random() * 2 - 1) * err, vy: sol.vy + (Math.random() * 2 - 1) * err * 0.5, vz: sol.vz, spin });
    this.phase = 'flight'; this.pt = 0;
    this.rec.react = 0.35;
  }
  step(dt) {
    this.pt += dt;
    const b = this.b;
    if (this.phase === 'toss') {
      if (this.pt < 0.05) { b.vy = 6.2; b.vx = 0; b.vz = -0.6; }
      this.fly(b, dt);
      if (b.y < 1.2 && b.vy < 0) { this.result = { kind: 'fallo', sub: 'No has golpeado el saque' }; this.finishBall(0); }
      return;
    }
    if (this.phase === 'set') {
      if (this.pt < 0.02) {
        const T = 1.15, tx = this.setX, tz = 0.9, ty = 2.6;
        b.vx = (tx - b.x) / T; b.vz = (tz - b.z) / T; b.vy = (ty - b.y + 0.5 * 9.81 * T * T) / T;
      }
      this.fly(b, dt);
      if (this.jumpT >= 0) this.jumpT += dt;
      this.me.x += (this.setX - 0.2 - this.me.x) * Math.min(1, dt * 3);
      this.me.z += (1.7 - this.me.z) * Math.min(1, dt * (this.jumpT >= 0 ? 6 : 1.2));
      if (b.y < 1.0 && b.vy < 0) { this.result = { kind: 'fallo', sub: 'Llegas tarde al remate' }; this.finishBall(0); }
      return;
    }
    if (this.phase === 'flight' || this.phase === 'result') {
      const pz = b.z, py = b.y;
      this.fly(b, dt);
      if (this.jumpT >= 0) this.jumpT += dt;
      // blockers
      if (this.mode === 'spike') this.blk.forEach((k) => { k.x += Math.max(-4 * dt, Math.min(4 * dt, (b.x + (k === this.blk[0] ? -0.35 : 0.35)) - k.x)); k.j = this.pt < 0.6 ? Math.sin(Math.min(1, this.pt / 0.6) * Math.PI) : 0; });
      // receiver
      const r = this.rec;
      if (this.phase === 'flight') {
        r.react -= dt;
        if (r.react <= 0) {
          const s = { ...b }; for (let i = 0; i < 600 && s.y > 0.9; i++) this.fly(s, 1 / 240);
          const dx = s.x - r.x, dz = s.z - r.z, d = Math.hypot(dx, dz);
          if (d > 0.05) { const v = Math.min(5.5, d * 6); r.x += dx / d * v * dt; r.z += dz / d * v * dt; }
        }
      }
      if (this.phase === 'flight' && pz > 0 && b.z <= 0) {
        const t = pz / ((pz - b.z) || 1e-6), cy = py + (b.y - py) * t, cx = b.x;
        if (Math.abs(cx) > 4.6 || cy < 2.43 + 0.105) {
          if (Math.abs(cx) <= 4.6) { b.z = 0.12; b.vz = Math.abs(b.vz) * 0.25; b.vx *= 0.3; this.result = { kind: 'red', sub: 'El balón no pasa la red' }; this.finishBall(0); return; }
        }
        if (this.mode === 'spike') {
          const top = 2.43 + 0.45 + this.blk[0].j * 0.75;
          const hitB = this.blk.find((k) => Math.abs(cx - k.x) < 0.5);
          if (hitB && cy < top) { b.z = 0.15; b.vz = Math.abs(b.vz) * 0.4; b.vy = -2; b.vx *= 0.4; this.result = { kind: 'bloqueo', sub: 'Te han hecho un bloqueo' }; this.finishBall(0); return; }
        }
      }
      if (this.phase === 'flight' && !r.tried && b.z < 0 && b.y < 1.0 && Math.hypot(b.x - r.x, b.z - r.z) < 0.9 && b.y > 0.3) {
        r.tried = true;
        const sp = Math.hypot(b.vx, b.vy, b.vz);
        const chance = 0.08 + (sp < 14 ? 0.45 : sp < 20 ? 0.22 : 0.06);
        if (Math.random() < chance) { b.vy = 6; b.vz = 2; b.vx = (Math.random() - 0.5) * 2; this.result = { kind: 'recibida', sub: 'El rival la defiende' }; this.finishBall(0); return; }
        r.react = 99;
      }
      if (this.phase === 'flight' && b.y <= 0.105) {
        const inside = Math.abs(b.x) <= 4.5 + 0.1 && b.z <= 0 && b.z >= -9 - 0.1;
        if (!inside) { this.result = { kind: 'fuera', sub: 'Fuera de la pista' }; this.finishBall(0); }
        else {
          const inZone = Math.abs(b.x - this.zone.x) < 1.5 && Math.abs(b.z - this.zone.z) < 2;
          const p = this.mode === 'serve' ? (inZone ? 3 : 1) : (inZone ? 3 : 2);
          this.result = { kind: this.mode === 'serve' ? 'ace' : 'punto', sub: inZone ? '¡En la zona marcada! +' + p : '+' + p };
          this.finishBall(p);
        }
        b.y = 0.105; b.vy = Math.abs(b.vy) * 0.45; b.vx *= 0.6; b.vz *= 0.6;
      }
      if (this.phase === 'result') {
        if (b.y <= 0.105) { b.y = 0.105; b.vy = Math.abs(b.vy) * 0.45; b.vx *= 0.7; b.vz *= 0.7; }
        if (this.pt > 1.8) { this.n++; if (this.n >= 10) { this.phase = 'done'; this.best[this.mode] = Math.max(this.best[this.mode], this.pts); } else { this.newBall(); this.phase = this.mode === 'serve' ? 'toss' : 'set'; } }
      }
    }
  }
  finishBall(p) {
    this.pts += p; if (p > 0) this.good++;
    this.phase = 'result'; this.pt = 0;
  }
  hitFromSwipe() {
    const pts = this.swipe; this.swipe = null;
    if (!pts || pts.length < 2 || !this.cam) return;
    const p0 = pts[0], p1 = pts[pts.length - 1];
    const len = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    if (len < 30) return;
    const dur = Math.max(0.06, (p1.t - p0.t) / 1000);
    const b = this.b;
    if (this.mode === 'serve') {
      if (this.phase !== 'toss' || b.y < 1.9) return;
      const tgt = this.ground(p1.x, p1.y);
      if (!tgt) return;
      const fast = len / dur > 1500;
      const vmax = (50 + 55 * this.tt('saq')) / 3.6;
      const speed = Math.min(vmax, 12 + (len / dur) / 120);
      const err = 0.9 * (1 - this.tt('saq'));
      this.launchTo(tgt.x, tgt.z, speed, fast ? 1 : 0, err);
      this.swingT = 0;
    } else {
      if (this.jumpT < 0) return;
      const hand = this.handPos();
      if (Math.hypot(b.x - hand.x, b.y - hand.y, b.z - hand.z) > 0.75) { this.result = { kind: 'fallo', sub: 'No llegas al balón · salta antes o después' }; this.finishBall(0); return; }
      const tgt = this.ground(p1.x, p1.y);
      if (!tgt) return;
      const speed = Math.min((60 + 55 * this.tt('rem')) / 3.6, 14 + (len / dur) / 90);
      this.launchTo(tgt.x, tgt.z, speed, 1.4, 0.6 * (1 - this.tt('rem')));
      this.swingT = 0;
    }
  }
  reach() {
    return 2.9 + 0.6 * this.tt('sal');
  }
  handPos() {
    const j = this.jumpT >= 0 ? Math.max(0, Math.sin(Math.min(1, this.jumpT / 0.7) * Math.PI)) : 0;
    return { x: this.me.x + 0.25, y: 2.35 + j * (this.reach() - 2.35) + 0.3, z: this.me.z - 0.4 };
  }
  ground(sx, sy) {
    const ndc = new THREE.Vector2(sx / 844 * 2 - 1, -(sy / 390 * 2 - 1));
    const rc = new THREE.Raycaster(); rc.setFromCamera(ndc, this.cam);
    const out = new THREE.Vector3();
    return rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), out) ? out : null;
  }
  mat(color, o) {
    const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.75, metalness: 0.02 }, o || {}));
    m.color = new THREE.Color(color).convertSRGBToLinear();
    if (o && o.emissive != null) m.emissive = new THREE.Color(o.emissive).convertSRGBToLinear();
    return m;
  }
  canvasTex(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  }
  makePlayer(o) {
    const T = THREE, g = new T.Group(), body = new T.Group();
    g.add(body);
    const tones = [0xc68a5e, 0xe0b48f, 0x8d5a3b, 0xf1c9a5, 0x6b4129, 0xb9794f];
    const skinHex = o.skin || tones[Math.floor(Math.random() * tones.length)];
    const skin = this.mat(skinHex, { roughness: 0.62 });
    const skinDark = this.mat(new T.Color(skinHex).multiplyScalar(0.78), { roughness: 0.7 });
    const shirt = this.mat(o.shirt, { roughness: 0.68 }), shorts = this.mat(o.shorts, { roughness: 0.7 });
    const trimCol = new T.Color(o.trimCss || '#0B0B14');
    const trim = this.mat(trimCol, { roughness: 0.6 });
    const sock = this.mat(o.socks, { roughness: 0.8 });
    const boot = this.mat(o.boot || 0x22d3ee, { roughness: 0.35, metalness: 0.1 });
    const sole = this.mat(0x111111, { roughness: 0.6 });
    const hairM = this.mat(o.hair || 0x241811, { roughness: 0.85 });
    const hand = o.gloves ? this.mat(0xf2f5fa, { roughness: 0.5 }) : skin;
    const add = (parent, mesh, x, y, z) => { mesh.position.set(x || 0, y || 0, z || 0); mesh.castShadow = true; parent.add(mesh); return mesh; };
    const lathe = (pts, m, seg) => new T.Mesh(new T.LatheGeometry(pts.map(([r, y]) => new T.Vector2(r, y)), seg || 18), m);
    const sph = (r, m, w, h) => new T.Mesh(new T.SphereGeometry(r, w || 18, h || 14), m);
    const cyl = (rt, rb, h, m, seg) => new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 16), m);
    // legs
    const legs = [];
    [-1, 1].forEach((s) => {
      const hip = new T.Group(); hip.position.set(0.1 * s, 0.94, 0); body.add(hip);
      add(hip, lathe([[0.001, 0], [0.072, 0.02], [0.088, 0.14], [0.098, 0.3], [0.1, 0.44], [0.001, 0.46]], skin), 0, -0.46, 0);
      add(hip, cyl(0.112, 0.118, 0.2, shorts), 0, -0.07, 0);
      add(hip, cyl(0.119, 0.119, 0.025, trim), 0, -0.165, 0);
      const knee = new T.Group(); knee.position.y = -0.45; hip.add(knee);
      add(knee, sph(0.066, skin), 0, 0, 0.005);
      add(knee, lathe([[0.001, -0.43], [0.045, -0.42], [0.05, -0.3], [0.07, -0.16], [0.064, -0.04], [0.06, 0], [0.001, 0.01]], skin), 0, 0, 0);
      add(knee, cyl(0.068, 0.056, 0.32, sock), 0, -0.27, 0);
      add(knee, cyl(0.07, 0.07, 0.03, trim), 0, -0.115, 0);
      const bt = add(knee, new T.Mesh(new T.BoxGeometry(0.105, 0.075, 0.24), boot), 0, -0.44, 0.045);
      add(knee, sph(0.053, boot), 0, -0.445, 0.155).scale.set(1, 0.7, 1);
      add(knee, new T.Mesh(new T.BoxGeometry(0.11, 0.022, 0.31), sole), 0, -0.48, 0.06);
      add(knee, new T.Mesh(new T.BoxGeometry(0.06, 0.01, 0.1), trim), 0, -0.4, 0.06);
      legs.push({ hip, knee });
    });

      startText: serve ? '10 saques. 1 punto si entra, 3 si cae en la zona marcada. El receptor rival intentará defenderlo: los saques fuertes y en salto son más difíciles de recibir.' : '10 remates. Tu colocador te pasa el balón: salta a tiempo y remata por encima del bloqueo rival. 2 puntos por punto, 3 en la zona marcada.',
      doneSub: this.good + ' de 10 con éxito · récord ' + this.best[this.mode],
      start: () => { if (this.phase === 'done') this.reset(); this.newBall(); this.phase = serve ? 'toss' : 'set'; this.pt = 0; this.loop(); this.forceUpdate(); },
      doJump: () => { if (this.jumpT < 0 && this.phase === 'set') this.jumpT = 0; },
      pDown: (e) => {
        if (!(this.phase === 'toss' || (this.phase === 'set' && this.jumpT >= 0))) return;
        e.preventDefault();
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
        this.swipe = [this.local(e)];
      },
      pMove: (e) => {
        if (!this.swipe) return;
        const q = this.local(e), l = this.swipe[this.swipe.length - 1];
        if (Math.hypot(q.x - l.x, q.y - l.y) > 4 && this.swipe.length < 60) this.swipe.push(q);
      },
      pUp: (e) => { if (this.swipe) { this.swipe.push(this.local(e)); this.hitFromSwipe(); this.forceUpdate(); } },
      pCancel: () => { this.swipe = null; }
    };
  }
}
</script>
