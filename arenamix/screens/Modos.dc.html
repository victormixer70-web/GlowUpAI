<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modos de juego</title>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
input::placeholder{color:#8686A6}
.md-card{position:absolute;left:50%;top:10px;width:170px;height:244px;margin-left:-85px;padding:0;border:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.25,1.2,.4,1),opacity .35s,filter .35s;-webkit-tap-highlight-color:transparent}
.md-bg{position:absolute;left:80px;right:0;top:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden;contain:layout paint}
.md-stands{position:absolute;left:-40px;right:-40px;top:58px;height:170px;border-radius:50% 50% 0 0/30% 30% 0 0;background:radial-gradient(circle,color-mix(in srgb,var(--c) 50%,transparent) 1.1px,transparent 1.7px) 4px 3px/13px 11px,radial-gradient(circle,#FFFFFF22 1.1px,transparent 1.7px) 0 0/9px 8px,repeating-linear-gradient(180deg,transparent 0 20px,#00000055 20px 23px),linear-gradient(180deg,#1E1E36,#0E0E1C 75%);-webkit-mask-image:linear-gradient(180deg,#000 45%,transparent);mask-image:linear-gradient(180deg,#000 45%,transparent);opacity:.6}
.md-roof{position:absolute;left:-40px;right:-40px;top:44px;height:30px;border-radius:50% 50% 0 0/100% 100% 0 0;background:#07070F;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 45%,transparent),0 8px 26px color-mix(in srgb,var(--c) 22%,transparent)}
.md-tower{position:absolute;top:58px;width:46px;height:20px;border-radius:3px;background:radial-gradient(circle,#FFFFFF 2px,#FFF6C8aa 3px,transparent 4px) 0 0/11.5px 10px,#1A1A2A;box-shadow:0 0 26px 6px #FFF6C844}
.md-word{position:absolute;left:0;top:118px;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:120px;line-height:1;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--c) 26%,transparent);will-change:transform;animation:mdWord 26s linear infinite}
@keyframes mdWord{to{transform:translateX(-50%)}}
.md-pitchw{position:absolute;left:0;right:0;bottom:0;height:250px;overflow:hidden;-webkit-mask-image:linear-gradient(0deg,#000 15%,transparent 62%);mask-image:linear-gradient(0deg,#000 15%,transparent 62%)}
.md-pitch{position:absolute;left:-60%;right:-60%;bottom:-20px;height:420px;transform:perspective(520px) rotateX(58deg);transform-origin:50% 100%;background:radial-gradient(circle at 50% 38%,transparent 70px,color-mix(in srgb,var(--c) 70%,#fff) 71px 74px,transparent 75px),radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70px),linear-gradient(90deg,transparent calc(50% - 2px),#FFFFFF55 calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px)),repeating-linear-gradient(90deg,#1D5634 0 80px,#174A2C 80px 160px);opacity:.85}
.md-vig{position:absolute;inset:0;background:radial-gradient(100% 90% at 50% 55%,transparent 45%,#000000a8 100%)}
.md-rays{position:absolute;left:50%;top:180px;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(color-mix(in srgb,var(--c) 14%,transparent) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent);will-change:transform;animation:mdSpin 60s linear infinite}
@keyframes mdSpin{to{transform:rotate(360deg)}}
.md-spark i{position:absolute;bottom:40px;width:4px;height:4px;border-radius:50%;background:#FFE08A;box-shadow:0 0 6px #FFC53D;opacity:0;will-change:transform,opacity;animation:mdSpark 4s linear infinite}
@keyframes mdSpark{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-300px);opacity:0}}
.md-neon{position:absolute;left:-200px;width:1200px;height:3px;background:linear-gradient(90deg,transparent,var(--c) 45%,#fff 50%,var(--c) 55%,transparent);opacity:.5;will-change:transform;animation:mdNeon 3.4s linear infinite}
@keyframes mdNeon{from{transform:rotate(-12deg) translateX(-600px)}to{transform:rotate(-12deg) translateX(600px)}}
.md-dots{position:absolute;right:-30px;top:40px;width:300px;height:300px;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent) 2px,transparent 2.6px) 0 0/14px 14px;-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent);opacity:.5}
.md-dots.l{right:auto;left:-60px;top:170px;width:240px;height:240px}
.md-chalk path{stroke-dasharray:6 7;animation:mdChalk 1.4s linear infinite}
@keyframes mdChalk{to{stroke-dashoffset:-26}}
.md-cone{position:absolute;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:16px solid #FF8A3D;filter:drop-shadow(0 3px 2px #000a)}
@keyframes mdGlow{0%,100%{box-shadow:0 0 0 2px var(--mc),0 0 22px var(--mc),0 18px 30px #000c}50%{box-shadow:0 0 0 2px var(--mc),0 0 38px var(--mc),0 18px 30px #000c}}
@keyframes mdFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
</style>
</helmet>
<div class="bc-stage" style="position: relative; width: 844px; height: 390px; box-sizing: border-box; color: #F4F4FA; font-family: Exo2, sans-serif; overflow: hidden">
  <div class="am-bg"></div>
  <div class="bc-beams"></div>
  <div class="md-bg" style="{{bgVars}}">
    <sc-if value="{{bgComp}}" hint-placeholder-val="{{ true }}"><div class="md-rays"></div></sc-if>
    <div class="md-roof"></div><div class="md-stands"></div>
    <div class="md-tower" style="left: 18px"></div><div class="md-tower" style="right: 18px"></div>
    <div class="md-word">{{bgWord}}</div>
    <div class="md-pitchw"><div class="md-pitch"></div></div>
    <sc-if value="{{bgComp}}" hint-placeholder-val="{{ true }}"><div class="md-spark"><sc-for list="{{bgSparks}}" as="k" hint-placeholder-count="0"><i style="{{k}}"></i></sc-for></div></sc-if>
    <sc-if value="{{bgCasual}}" hint-placeholder-val="{{ false }}"><div class="md-dots"></div><div class="md-dots l"></div><div class="md-neon" style="top: 110px"></div><div class="md-neon" style="top: 250px; animation-delay: -1.7s; animation-duration: 4.2s"></div></sc-if>
    <sc-if value="{{bgTrain}}" hint-placeholder-val="{{ false }}">
      <svg class="md-chalk" width="764" height="390" viewBox="0 0 764 390" style="position: absolute; inset: 0" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round">
        <g stroke-dasharray="none"><path d="M40 300l14 14M54 300l-14 14M690 110l14 14M704 110l-14 14M120 120l14 14M134 120l-14 14" style="animation: none; stroke-dasharray: none"/><circle cx="640" cy="290" r="9"/><circle cx="150" cy="210" r="9"/><circle cx="690" cy="200" r="9"/></g>
        <path d="M60 296C110 250 120 190 140 215"/><path d="M640 280C600 220 690 170 690 190"/><path d="M134 128C200 80 260 90 300 110"/>
      </svg>
      <span class="md-cone" style="left: 30px; bottom: 70px"></span><span class="md-cone" style="left: 70px; bottom: 96px"></span><span class="md-cone" style="right: 40px; bottom: 80px"></span><span class="md-cone" style="right: 86px; bottom: 104px"></span>
    </sc-if>
    <div class="md-vig"></div>
  </div>
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 80px; height: 390px; z-index: 3"><dc-import name="Nav" active="jugar" hint-size="80px,390px"></dc-import></div>
  <!-- header: back, title, the three kinds of play -->
  <div style="position: absolute; left: 96px; right: 12px; top: 10px; height: 40px; display: flex; align-items: center; gap: 10px; z-index: 4">
    <a href="Deportes.dc.html" aria-label="Volver" class="bc-para" style="flex: none; width: 44px; height: 36px; display: flex; align-items: center; justify-content: center; background: #17172A; color: #F4F4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
    <h1 class="bc-title" style="font-size: 26px">¿A QUÉ JUGAMOS?</h1>
    <span style="flex: 1"></span>
    <div role="tablist" aria-label="Tipo de partida" style="position: relative; display: flex; gap: 0; padding: 3px; border-radius: 14px; background: #0B0B14CC; border: 1px solid #2E2E58">
      <span aria-hidden="true" style="{{thumbStyle}}"></span>
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"/></svg>{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <!-- the modes as big cards in a carousel: swipe or tap the ones at the sides -->
  <div key="{{listKey}}" onPointerDown="{{swDown}}" onPointerUp="{{swUp}}" onPointerCancel="{{swUp}}" style="position: absolute; left: 80px; right: 0; top: 52px; height: 270px; perspective: 900px; touch-action: pan-y; z-index: 1">
    <span aria-hidden="true" style="{{spot}}"></span>
    <sc-for list="{{cards}}" as="m" hint-placeholder-count="5">
      <button type="button" onClick="{{m.pick}}" aria-label="{{m.aria}}" aria-pressed="{{m.on}}" class="md-card" style="{{m.style}}">
        <span style="{{m.bg}}"></span>
        <img src="{{m.img}}" alt="" draggable="false" style="{{m.imgStyle}}">
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(180deg, transparent, #07070FEE 70%); pointer-events: none"></span>
        <span style="{{m.tagStyle}}">{{m.tag}}</span>
        <span style="position: absolute; left: 12px; right: 10px; bottom: 30px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: {{m.size}}px; line-height: .92; letter-spacing: -.5px; text-align: left; color: #F4F4FA; text-shadow: 0 3px 0 #07070F, 0 0 18px {{m.glow}}">{{m.title}}</span>
        <span style="position: absolute; left: 13px; bottom: 12px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: {{m.sub}}">{{m.kicker}}</span>
      </button>
    </sc-for>
  </div>

  <!-- what you picked, in one line, and the big button -->
  <div style="position: absolute; left: 96px; right: 14px; bottom: 12px; height: 54px; display: flex; align-items: center; gap: 14px; z-index: 4">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; color: #CACAE0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{selDesc}}</span>
      <sc-if value="{{showRank}}" hint-placeholder-val="{{ true }}">
        <a href="Rangos.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #F4F4FA">
          <span style="font-size: 11px; font-weight: 800; color: {{rankColor}}; white-space: nowrap">{{rankLabel}}</span>
          <span class="bc-para" style="flex: 0 1 160px; height: 6px; background: #26264A"><span class="am-bar-shine" style="display: block; {{rankBar}}"></span></span>
          <span style="font-size: 10px; font-weight: 700; color: #A3A3C2; white-space: nowrap">{{mmrLabel}} · {{seasonLabel}}</span>
        </a>
      </sc-if>
    </div>
    <a href="{{playHref}}" onClick="{{saveSel}}" class="bc-btn am-shine" style="flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 30px 0 24px; text-decoration: none; font-size: 26px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0B0B14"><path d="M6 3l15 9l-15 9z"/></svg>{{playLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
const Modos_ICON = {
  team: 'M9 11a4 4 0 1 0 0-8a4 4 0 0 0 0 8M2 21v-1a6 6 0 0 1 12 0v1M17 11a3 3 0 1 0 0-6M18 15a5 5 0 0 1 4 5v1',
  pen: 'M3 20V6h18v14M3 6l3-2h12l3 2M12 17a2 2 0 1 0 0-4a2 2 0 0 0 0 4',
  free: 'M4 21V11a2 2 0 0 1 4 0v10M10 21V9a2 2 0 0 1 4 0v12M16 21V11a2 2 0 0 1 4 0v10',
  private: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  train: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7a5 5 0 1 0 0 10a5 5 0 1 0 0-10M12 11a1 1 0 1 0 0 2a1 1 0 1 0 0-2',
  tut: 'M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM8 7h6M8 11h6',
  ext: 'M12 2l9 5v10l-9 5l-9-5V7zM3 7l9 5l9-5M12 12v10'
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const sel = this.store('arenamix.sel') || {};
    // ARENA MIX is the football game (the other sports are kept for a later game)
    const sport = 'futbol';
    this.state = { sport, cat: sel.sport === sport && sel.cat ? sel.cat : 'comp', id: sel.sport === sport && sel.id ? sel.id : null };
  }
  catalog(sport) {
    const team = (n, soon) => ({ id: 'm' + n, title: n + 'VS' + n, kind: 'team', n, soon, desc: soon ? 'Partido por equipos. Lo estamos preparando.' : n === 1 ? 'Tú contra otro jugador, con porteros.' : n + ' contra ' + n + ', con porteros.' });
    const teams = (soon) => [1, 2, 3, 4].map((n) => team(n, soon));
    const S = {
      futbol: { name: 'FÚTBOL', c1: '#145A33', c2: '#22914F', modes: teams(false).concat([
        { id: 'pens', title: 'PENALTIS', kind: 'duel', duel: 'pen', desc: 'Tanda de 5 tiros y 5 paradas por turnos. Muerte súbita.' },
        { id: 'fk', title: 'TIROS LIBRES', kind: 'duel', duel: 'free', desc: '7 escenarios distintos, con barrera.' }]),
        train: [{ id: 'train', title: 'PENALTIS Y FALTAS', href: 'Entrenamiento.dc.html', desc: 'Práctica libre con dianas y todos los escenarios.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      baloncesto: { name: 'BALONCESTO', c1: '#7A3B12', c2: '#C2652A', modes: teams(true).concat([
        { id: 'three', title: 'CONCURSO DE TRIPLES', kind: 'mg', comp: 'Baloncesto', mode: 'three', unit: 'puntos', rival: [6, 16], desc: '15 balones en 5 posiciones y 60 segundos; el último de cada posición vale doble.' },
        { id: 'ft', title: 'TIROS LIBRES', kind: 'mg', comp: 'Baloncesto', mode: 'free', unit: 'puntos', rival: [4, 9], desc: '10 tiros libres. Gana quien meta más.' }]),
        train: [{ id: 'train', title: 'PISTA LIBRE', href: 'Baloncesto.dc.html', desc: 'Triples y tiros libres sin presión.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      tenis: { name: 'TENIS', c1: '#1E3A8A', c2: '#2563C9', modes: teams(true).slice(0, 2).concat([
        { id: 'serve', title: 'DESAFÍO DE SAQUE', kind: 'mg', comp: 'Tenis', mode: 'serve', unit: 'puntos', rival: [6, 16], desc: '10 saques alternando lados. 1 punto en el cuadro, 3 en la zona marcada.' },
        { id: 'rally', title: 'DESAFÍO DE PELOTEO', kind: 'mg', comp: 'Tenis', mode: 'rally', unit: 'puntos', rival: [6, 16], desc: '10 bolas de la máquina: devuélvelas dentro; 3 puntos en la zona marcada.' }]),
        train: [{ id: 'train', title: 'PISTA DE TENIS', href: 'Tenis.dc.html', desc: 'Saques y peloteo sin presión.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      voley: { name: 'VÓLEY', c1: '#7A6430', c2: '#C9A85C', modes: teams(true).concat([
        { id: 'serve', title: 'DESAFÍO DE SAQUE', kind: 'mg', comp: 'Voley', mode: 'serve', unit: 'puntos', rival: [8, 22], desc: '10 saques. Las zonas marcadas valen 3.' },
        { id: 'spike', title: 'DESAFÍO DE REMATE', kind: 'mg', comp: 'Voley', mode: 'spike', unit: 'puntos', rival: [10, 24], desc: '10 remates contra el bloqueo.' }]),
        train: [{ id: 'train', title: 'PISTA LIBRE', href: 'Voley.dc.html', desc: 'Saques y remates a tu ritmo.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] }
    };
    return S[sport] || S.futbol;
  }
  // the line-up on the little pitch for team modes; a goal and the ball for penalties; a wall for free kicks
  dotsFor(m) {
    if (!m) return [];
    const d = (x, y, c, r) => ({ x: String(x), y: String(y), c, r: String(r || 6) });
    if (m.kind === 'team') {
      const n = m.n, out = [d(12, 56, '#FFC53D'), d(164, 56, '#2FBF71')];
      const ys = (k) => k === 1 ? [56] : k === 2 ? [36, 76] : k === 3 ? [28, 56, 84] : [24, 46, 66, 88];
      const xs = (k) => k <= 2 ? [56] : [44, 70];
      ys(n).forEach((y, i) => { const x = n <= 2 ? 58 : (i % 2 ? 72 : 46); out.push(d(x, y, '#22D3EE')); out.push(d(176 - x, y, '#FF8A3D')); });
      return out;
    }
    if (m.duel === 'pen') return [d(164, 56, '#2FBF71', 7), d(134, 56, '#F4F4FA', 4), d(110, 56, '#22D3EE', 7)];
    if (m.duel === 'free') return [d(164, 56, '#2FBF71', 7), d(130, 44, '#FF8A3D', 5), d(130, 54, '#FF8A3D', 5), d(130, 64, '#FF8A3D', 5), d(96, 70, '#F4F4FA', 4), d(84, 78, '#22D3EE', 7)];
    return [d(88, 56, '#22D3EE', 7), d(110, 56, '#F4F4FA', 4)];
  }
  iconOf(m) { return m.kind === 'team' ? 'team' : m.duel === 'pen' ? 'pen' : m.duel === 'free' ? 'free' : m.kind === 'private' ? 'private' : m.kind === 'ext' ? 'ext' : m.id === 'tut' ? 'tut' : 'train'; }
  tiers() {
    return [
      { name: 'Bronce', c1: '#C07A3E', c2: '#7A4520', text: '#E3A56E', wins: 4, start: 0 },
      { name: 'Plata', c1: '#C9D2DF', c2: '#6D788A', text: '#DCE3EE', wins: 6, start: 300 },
      { name: 'Oro', c1: '#F2C14E', c2: '#A8771A', text: '#F2C14E', wins: 8, start: 750 },
      { name: 'Platino', c1: '#5FD3C6', c2: '#24786F', text: '#7FE3D7', wins: 10, start: 1350 },
      { name: 'Diamante', c1: '#6FB6FF', c2: '#2A5FB0', text: '#8CC5FF', wins: 13, start: 2100 },
      { name: 'Campeón', c1: '#B57BFF', c2: '#5E2FA8', text: '#C79BFF', wins: 16, start: 3075, wings: true },
      { name: 'Super campeón', c1: '#FF5C8A', c2: '#A3204A', text: '#FF86A6', wins: 20, start: 4275, wings: true },
      { name: 'Élite', c1: '#FFE38A', c2: '#2A2410', text: '#FFE38A', wins: 25, start: 5775, wings: true }
    ];
  }
  rankOf(m) {
    const T = this.tiers();
    let i = T.length - 1;
    while (i > 0 && m < T[i].start) i--;
    const t = T[i], step = t.wins * 25;
    const div = Math.min(2, Math.floor((m - t.start) / step));
    const lo = t.start + div * step;
    const hi = div < 2 ? lo + step : (i < T.length - 1 ? T[i + 1].start : lo + step);
    return { ...t, div, label: t.name + ' ' + (div + 1), lo, hi, idx: i * 3 + div };
  }
  store(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
    return null;
  }
  season() {
    // Temporadas de 30 días (la 1 empieza el 1/10/2026). Al cambiar, se reinician los rangos y hay 5 clasificatorias por modo.
    const EPOCH = Date.UTC(2026, 9, 1), LEN = 30 * 864e5, now = Date.now();
    const n = Math.max(0, Math.floor((now - EPOCH) / LEN));
    let S = this.store('arenamix.season.v1');
    if (!S || S.n !== n) {
      const old = this.store('arenamix.mmr.v1') || {};
      S = { n, placed: {}, prev: old, notice: Object.keys(old).length > 0 };
      this.store('arenamix.mmr.v1', {});
      this.store('arenamix.season.v1', S);
    }
    S.num = n + 1;
    S.daysLeft = Math.max(1, Math.ceil((EPOCH + (n + 1) * LEN - now) / 864e5));
    return S;
  }
  placeOf(S, key) { return S.placed[key] || { g: 0, w: 0, d: 0, res: [] }; }
  placementMmr(p, prev) {
    // Rango inicial según las 5 clasificatorias (+ un poco del rango de la temporada anterior). Nunca pasa de Oro 3.
    const pts = p.w + p.d * 0.5;
    const base = [0, 120, 300, 480, 700, 900][Math.min(5, Math.floor(pts))] + Math.round((pts % 1) * 90);
    return Math.min(1150, base + Math.min(200, Math.round((prev || 0) * 0.12)));
  }
  mmrOf(sport, id) {
    const all = this.store('arenamix.mmr.v1') || {};
    return all[sport + ':' + id] || 0;
  }
  posterKey(m) { return m.kind === 'team' ? 'team:' + m.n : m.duel === 'pen' ? 'pen' : m.duel === 'free' ? 'free' : m.kind === 'private' ? 'private' : m.id === 'tut' ? 'tut' : 'train'; }
  renderVals() {
    const s = this.state, C = this.catalog(s.sport);
    let list;
    if (s.cat === 'train') list = C.train;
    else list = C.modes.concat(s.cat === 'casual' ? [{ id: 'private', title: 'PARTIDA PRIVADA', kind: 'private', desc: 'Juega online con tus amigos con un código de sala. Los huecos los rellena la IA.' }] : []);
    list = list.filter((m) => !m.soon);
    let ci = Math.max(0, list.findIndex((m) => m.id === s.id));
    const cur = list[ci];
    const comp = s.cat === 'comp', S = this.season();
    const placingOf = (m) => this.placeOf(S, s.sport + ':' + m.id).g < 5;
    const CAT = { comp: ['#FFC53D', '#3A2A0A'], casual: ['#22D3EE', '#0A2A33'], train: ['#53D88E', '#0A2A1A'] }[s.cat];
    const P = window.AMPosters;
    const cards = list.map((m, i) => {
      const off = i - ci, a = Math.abs(off), on = off === 0;
      const mmr = comp ? this.mmrOf(s.sport, m.id) : 0, R = this.rankOf(mmr);
      const tag = comp ? (placingOf(m) ? 'CLASIF. ' + this.placeOf(S, s.sport + ':' + m.id).g + '/5' : R.label.toUpperCase()) : s.cat === 'casual' ? (m.kind === 'private' ? 'CON AMIGOS' : 'SIN RANGO') : 'LIBRE';
      const img = P ? P.get(this.posterKey(m), () => this.forceUpdate()) : '';
      // the carousel: the chosen card in the middle, the others fanned out and turned away
      const tx = off === 0 ? 0 : Math.sign(off) * (a === 1 ? 182 : a === 2 ? 318 : 420);
      const sc = a === 0 ? 1.06 : a === 1 ? 0.84 : 0.7;
      const kicker = m.kind === 'team' ? 'PARTIDO · ' + m.n + ' CONTRA ' + m.n : m.kind === 'duel' ? 'DUELO · CARA A CARA' : m.kind === 'private' ? 'ONLINE · CÓDIGO DE SALA' : 'PRÁCTICA';
      const title = m.kind === 'team' ? m.n + ' VS ' + m.n : m.title;
      return {
        title, tag, kicker, img, on: on ? 'true' : 'false', aria: title + '. ' + m.desc,
        size: title.length > 12 ? 30 : title.length > 7 ? 36 : 54,
        glow: on ? CAT[0] + '88' : 'transparent', sub: on ? CAT[0] : '#A3A3C2',
        style: 'transform: translateX(' + tx + 'px) translateZ(' + (-a * 60) + 'px) rotateY(' + (-Math.sign(off) * Math.min(2, a) * 16) + 'deg) scale(' + sc + '); z-index: ' + (10 - a) + '; opacity: ' + (a > 2 ? 0 : a === 2 ? 0.55 : 1) + '; pointer-events: ' + (a > 2 ? 'none' : 'auto') + '; filter: ' + (on ? 'none' : 'brightness(.62) saturate(.8)') + ';' + (on ? ' animation: mdFloat 3.2s ease-in-out infinite;' : ''),
        bg: 'position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: radial-gradient(120% 80% at 50% 25%, ' + CAT[1] + ' 0%, #10102A 60%, #07070F 100%); --mc: ' + CAT[0] + '; ' + (on ? 'animation: mdGlow 2.4s ease-in-out infinite;' : 'box-shadow: 0 0 0 1px #2E2E58, 0 14px 24px #000a;'),
        imgStyle: 'position: absolute; left: 0; top: 0; width: 170px; height: 215px; object-fit: cover; border-radius: 18px 18px 0 0; opacity: ' + (img ? 1 : 0) + '; transition: opacity .5s; pointer-events: none;',
        tagStyle: 'position: absolute; left: 10px; top: 10px; padding: 3px 9px; transform: skewX(-10deg); background: ' + (on ? CAT[0] : '#17172ACC') + '; color: ' + (on ? '#0B0B14' : '#CACAE0') + '; font: 800 9.5px Exo2, sans-serif; letter-spacing: 1px; white-space: nowrap;',
        pick: () => { if (on || performance.now() - (this.swiped || 0) < 350) return; this.setState({ id: m.id }); }
      };
    });
    const mmr = cur && comp ? this.mmrOf(s.sport, cur.id) : 0, R = this.rankOf(mmr);
    const curPlacing = cur && comp && placingOf(cur), curPc = cur ? this.placeOf(S, s.sport + ':' + cur.id) : null;
    const ti = ['comp', 'casual', 'train'].indexOf(s.cat);
    const TABS = [
      { id: 'comp', label: 'COMPETITIVO', color: '#FFC53D', icon: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4' },
      { id: 'casual', label: 'INFORMAL', color: '#22D3EE', icon: 'M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18M8 14s1.5 2 4 2s4-2 4-2M9 9h.01M15 9h.01' },
      { id: 'train', label: 'ENTRENAR', color: '#53D88E', icon: 'M12 3l7 18H5zM8 14h8M10 9h4' }
    ];
    const go = (d) => { const j = ci + d; if (j >= 0 && j < list.length) this.setState({ id: list[j].id }); };
    const href = !cur ? '#' : s.cat === 'train' ? cur.href : cur.kind === 'private' ? 'Privada.dc.html' : comp ? 'Competitivo.dc.html' : 'Rapida.dc.html';
    return {
      tabs: TABS.map((t, i) => ({
        label: t.label, icon: t.icon, sel: i === ti ? 'true' : 'false',
        style: 'position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; height: 32px; width: 132px; justify-content: center; border: 0; background: none; font: 800 11.5px Exo2, sans-serif; letter-spacing: .5px; cursor: pointer; transition: color .3s; color: ' + (i === ti ? '#0B0B14' : t.color) + ';',
        pick: () => { if (i !== ti) this.setState({ cat: t.id, id: null }); }
      })),
      thumbStyle: 'position: absolute; top: 3px; left: ' + (3 + ti * 132) + 'px; width: 132px; height: 32px; border-radius: 11px; background: ' + TABS[ti].color + '; box-shadow: 0 0 16px ' + TABS[ti].color + '88; transition: left .45s cubic-bezier(.3,1.4,.45,1), background .3s, box-shadow .3s;',
      spot: 'position: absolute; left: 50%; top: 150px; width: 380px; height: 150px; margin-left: -190px; border-radius: 50%; background: radial-gradient(closest-side, ' + CAT[0] + '33, transparent); pointer-events: none;',
      cards,
      bgVars: '--c: ' + CAT[0] + ';',
      bgComp: comp, bgCasual: s.cat === 'casual', bgTrain: s.cat === 'train',
      bgWord: (() => { const w = { comp: 'COMPETITIVO', casual: 'INFORMAL', train: 'ENTRENAMIENTO' }[s.cat] + ' · '; return w.repeat(4) + w.repeat(4); })(),
      bgSparks: comp ? Array.from({ length: 16 }, (_, k) => { const r = (n) => { const x = Math.sin((k + n) * 91.3) * 43758.5; return x - Math.floor(x); }; return 'left: ' + (40 + r(1) * 680).toFixed(0) + 'px; animation-duration: ' + (3 + r(2) * 3).toFixed(2) + 's; animation-delay: -' + (r(3) * 6).toFixed(2) + 's'; }) : [],
      swDown: (e) => { this.sw = { x: e.clientX, t: performance.now() }; },
      swUp: (e) => {
        const w = this.sw; this.sw = null;
        if (!w) return;
        const dx = e.clientX - w.x;
        if (Math.abs(dx) > 40 && performance.now() - w.t < 700) { this.swiped = performance.now(); go(dx < 0 ? 1 : -1); }
      },
      listKey: s.cat,
      selDesc: cur ? cur.desc : '',
      showRank: comp && !!cur,
      rankLabel: curPlacing ? 'Sin clasificar' : R.label, rankColor: curPlacing ? '#A3A3C2' : R.text,
      mmrLabel: curPlacing ? 'Clasificatorias ' + curPc.g + '/5' : mmr + ' MMR',
      seasonLabel: 'T' + S.num + ' · ' + S.daysLeft + (S.daysLeft === 1 ? ' día' : ' días'),
      rankBar: 'height: 6px; box-shadow: 0 0 8px ' + R.text + '; background: ' + R.text + '; width: ' + (Math.max(0, Math.min(1, (mmr - R.lo) / (R.hi - R.lo))) * 100).toFixed(1) + '%;',
      playHref: href,
      playLabel: s.cat === 'train' ? 'ENTRENAR' : cur && cur.kind === 'private' ? 'CREAR SALA' : comp ? 'BUSCAR PARTIDA' : 'JUGAR',
      saveSel: () => { if (cur) this.store('arenamix.sel', { sport: s.sport, cat: s.cat, id: cur.id }); }
    };
  }
}
</script>
