<div style="position: relative; width: 844px; height: 390px; box-sizing: border-box; background: #0B0B14; color: #F4F4FA; font-family: Manrope, sans-serif; overflow: hidden">

    <a href="Tienda.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #A3A3C2; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Tienda</a>
    <a href="Estadisticas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #A3A3C2; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</a>

  <div style="position: relative; height: 120px; flex: none; border-radius: 16px; overflow: hidden">
    <svg width="100%" height="120" viewBox="0 0 390 132" preserveAspectRatio="xMidYMid slice" style="position: absolute; left: 0; top: 0">
      <defs>
        <linearGradient id="mo-p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#145A33"/><stop offset="1" stop-color="#22914F"/></linearGradient>
        <radialGradient id="mo-l" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
        <linearGradient id="mo-f" x1="0" y1="0" x2="0" y2="1"><stop offset=".4" stop-color="#0B0B14" stop-opacity="0"/><stop offset="1" stop-color="#0B0B14"/></linearGradient>
      </defs>
      <rect width="390" height="132" fill="url(#mo-p)"/>

      <path d="M195 0V132" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="2"/>
      <circle cx="195" cy="132" r="54" fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="2"/>
      <rect x="-2" y="30" width="62" height="104" fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="2"/>

    </svg>
    <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 0 16px">
      <a href="Deportes.dc.html" aria-label="Volver" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #0B0B14CC; color: #F4F4FA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
      </a>
      <span style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 20px; background: #0B0B14CC; font-weight: 800; font-size: 14px">
        <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC53D"/><circle cx="12" cy="12" r="7" fill="none" stroke="#B7791F" stroke-width="1.5"/><text x="12" y="16" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="11" fill="#7A4E0E">C</text></svg>
        2.450
      </span>
    </div>
    <h1 style="position: relative; margin: 0; padding: 8px 20px 0 20px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 48px; line-height: 1; letter-spacing: 1px; text-shadow: 0 3px 0 #0B0B14">FÚTBOL</h1>
  </div>
    <div style="{{compCardStyle}}">
      <button type="button" onClick="{{pickComp}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 0; border: 0; background: transparent; color: #F4F4FA; font-family: Manrope, sans-serif; text-align: left; cursor: pointer">
        <svg width="60" height="64" viewBox="-6 -10 76 80" style="flex: none">
          <path d="M32 2L56 10V30C56 45 45 55 32 60C19 55 8 45 8 30V10Z" fill="#C07A3E"/>
          <path d="M32 8L50 14V30C50 41 42 49 32 53C22 49 14 41 14 30V14Z" fill="#7A4520"/>
          <path d="M32 8L50 14V30C50 41 42 49 32 53Z" fill="#000000" opacity=".18"/>
          <path d="M32 17l4.2 8.6 9.5 1.4-6.9 6.7 1.6 9.4L32 38.6l-8.4 4.5 1.6-9.4-6.9-6.7 9.5-1.4z" fill="#E3A56E"/>
          <rect x="20" y="62" width="7" height="5" rx="1.5" fill="#E3A56E"/><rect x="29" y="62" width="7" height="5" rx="1.5" fill="#E3A56E"/><rect x="38" y="62" width="7" height="5" rx="1.5" fill="#3A2C1E"/>
        </svg>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 24px; letter-spacing: .5px">COMPETITIVO</span>
          </span>
          <span style="font-size: 14px; font-weight: 800; color: #E3A56E">Bronce 2 <span style="color: #A3A3C2; font-weight: 600">· 112 MMR</span></span>
          <span style="font-size: 12px; color: #BABAD6">Gana para subir de fase y de rango.</span>
        </span>
      </button>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700">
          <span style="color: #CACAE0">≈ 4 victorias para Bronce 3</span>
          <span style="color: #A3A3C2">112 / 200</span>
        </div>
        <div style="height: 8px; border-radius: 4px; background: #26264A"><div style="width: 12%; height: 8px; border-radius: 4px; background: #E3A56E"></div></div>
      </div>
      <a href="Rangos.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 12px; border-radius: 10px; background: #0B0B14; text-decoration: none; font-size: 13px; font-weight: 700">
        Ver los 8 rangos y el sistema MMR
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"/></svg>
      </a>
    </div>
  </div>
  <div style="position: absolute; left: 410px; top: 0; right: 0; bottom: 0; padding: 12px 16px 12px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #A3A3C2">OTROS MODOS</h2>
    <div style="flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button type="button" onClick="{{m.pick}}" style="{{m.cardStyle}}">
        <span style="{{m.iconStyle}}">
          <sc-if value="{{m.isQuick}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8l9-12h-7z"/></svg></sc-if>
          <sc-if value="{{m.isTrain}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></sc-if>
          <sc-if value="{{m.isFriends}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 5 5"/></svg></sc-if>
          <sc-if value="{{m.isPens}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20V6h18v14"/><path d="M3 10h18M8 6v14M16 6v14" stroke-width="1" opacity=".6"/><circle cx="12" cy="17" r="2.2" fill="currentColor"/></svg></sc-if>
          <sc-if value="{{m.isFree}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20Q8 4 20 6"/><circle cx="4" cy="20" r="2" fill="currentColor"/><path d="M9 14v6M12 13v7M15 14v6"/></svg></sc-if>
          <sc-if value="{{m.isCoach}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9z"/><circle cx="9" cy="11" r="1.2" fill="currentColor"/><path d="M13 10l3 3M16 10l-3 3M9.5 17l5-3"/></svg></sc-if>
          <sc-if value="{{m.isOnline}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg></sc-if>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left">
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 21px; letter-spacing: .5px; color: #F4F4FA">{{m.title}}</span>
            <span style="{{m.tagStyle}}">{{m.tag}}</span>
          </span>
          <span style="font-size: 12px; line-height: 1.35; color: #BABAD6">{{m.desc}}</span>
        </span>
      </button>
    </sc-for>
    </div>
        <a href="{{playHref}}" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 16px; background: #22D3EE; color: #0B0B14; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 26px; letter-spacing: 2px; box-shadow: 0 6px 0 #0E8FA3">JUGAR · {{selectedTitle}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'comp' };
  }
  renderVals() {
    const list = [
      { id: 'online', title: '2VS2 ONLINE', tag: 'Por equipos', desc: 'Juega con un compañero contra otra pareja.' },
      { id: 'pens', title: 'PENALTIS 1VS1', tag: 'Tanda', desc: 'Tiras y paras por turnos. Muerte súbita.' },
      { id: 'free', title: 'TIROS LIBRES 1VS1', tag: 'Con barrera', desc: 'Duelo de faltas a 22 metros.' },
      { id: 'quick', title: 'PARTIDA RÁPIDA', tag: '3v3', desc: 'Partidos cortos sin afectar a tu MMR.' },
      { id: 'coach', title: 'ENTRENADOR', tag: '3v3', desc: 'Modo entrenador: controla a todo tu equipo.' },
      { id: 'train', title: 'ENTRENAMIENTO', tag: 'Sin rival', desc: 'Penaltis, regates y tiros libres a tu ritmo.' },
      { id: 'friends', title: 'CON AMIGOS', tag: 'Privada', desc: 'Crea una sala e invita con un código.' }
    ];
    const sel = this.state.mode;
    const modes = list.map((m) => {
      const on = m.id === sel;
      return {
        ...m,
        isQuick: m.id === 'quick', isTrain: m.id === 'train', isFriends: m.id === 'friends', isPens: m.id === 'pens', isFree: m.id === 'free', isOnline: m.id === 'online', isCoach: m.id === 'coach',
        cardStyle: 'display: flex; align-items: center; gap: 10px; width: 100%; height: 100%; padding: 10px; box-sizing: border-box; border-radius: 16px; font-family: Manrope, sans-serif; cursor: pointer; ' + (on ? 'background: #1E1A3A; border: 2px solid #22D3EE;' : 'background: #17172A; border: 2px solid #26264A;'),
        iconStyle: 'flex: none; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #22D3EE; color: #0B0B14;' : 'background: #21213A; color: #CACAE0;'),
        tagStyle: 'font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; ' + (on ? 'background: #0E3340; color: #22D3EE;' : 'background: #21213A; color: #A3A3C2;'),
        pick: () => this.setState({ mode: m.id })
      };
    });
    const compOn = sel === 'comp';
    return {
      modes,
      pickComp: () => this.setState({ mode: 'comp' }),
      compCardStyle: 'display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 18px; ' + (compOn ? 'background: #1F1A1A; border: 2px solid #22D3EE;' : 'background: #17172A; border: 2px solid #26264A;'),
      selectedTitle: compOn ? 'COMPETITIVO' : list.find((m) => m.id === sel).title,
      playHref: ({ comp: 'Competitivo.dc.html', quick: 'Rapida.dc.html', coach: 'Entrenador.dc.html', train: 'Entrenamiento.dc.html', friends: 'Online2v2.dc.html', online: 'Online2v2.dc.html', pens: 'Penaltis1v1.dc.html', free: 'TirosLibres1v1.dc.html' })[sel]
    };
  }
}
</script>
</body>
</html>
