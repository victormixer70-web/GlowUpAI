<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modos de juego</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
input::placeholder{color:#8686A6}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; box-sizing: border-box; background: #0B0B14; color: #F4F4FA; font-family: Manrope, sans-serif; overflow: hidden">
  <nav aria-label="Principal" style="position: absolute; left: 0; top: 0; bottom: 0; width: 80px; box-sizing: border-box; padding: 12px 8px; background: #111120; border-right: 1px solid #26264A; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <span style="margin-bottom: 6px"><svg width="46" height="46" viewBox="0 0 512 512" role="img" aria-label="ARENA MIX" style="display: block; flex: none"><defs><linearGradient id="am-logo-modos" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1A44"/><stop offset="1" stop-color="#0B0B14"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#am-logo-modos)" stroke="#2E2E52" stroke-width="10"/><path d="M60 400L470 150" stroke="#22D3EE" stroke-opacity=".12" stroke-width="70" stroke-linecap="round"/><text x="256" y="350" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-style="italic" font-size="270" letter-spacing="-6"><tspan fill="#F4F4FA">A</tspan><tspan fill="#22D3EE" dx="90">M</tspan></text><path d="M262 120L222 238h38l-26 104l80-140h-42l30-82z" fill="#FFC53D" stroke="#0B0B14" stroke-width="10" stroke-linejoin="round"/></svg></span>
    <a href="Deportes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #0B0B14; background: #22D3EE"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4l13 8l-13 8z"/></svg>Jugar</a>
    <a href="Taquilla.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #A3A3C2; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3L3 6l2 5l3-1v11h8V10l3 1l2-5l-5-3a4 4 0 0 1-8 0z"/></svg>Taquilla</a>
    <a href="Tienda.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #A3A3C2; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Tienda</a>
    <a href="Estadisticas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 64px; height: 64px; border-radius: 16px; text-decoration: none; font-size: 10px; font-weight: 800; color: #A3A3C2; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Perfil</a>
  </nav>
  <div style="position: absolute; left: 80px; top: 0; bottom: 0; width: 300px; padding: 12px 10px 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <div style="{{bannerStyle}}">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <a href="Deportes.dc.html" aria-label="Volver a deportes" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 20px; background: #0B0B14CC; color: #F4F4FA">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
        </a>
        <span style="padding: 4px 10px; border-radius: 12px; background: #0B0B14CC; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #CACAE0">MODOS DE JUEGO</span>
      </div>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: {{sportSize}}px; line-height: 1; letter-spacing: 1px; text-shadow: 0 3px 0 #0B0B14">{{sportName}}</span>
    </div>
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; background: #17172A; border: 1px solid #26264A">
      <span style="font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: {{catColor}}">{{catLabel}}</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 26px; line-height: 1">{{selTitle}}</span>
      <span style="font-size: 12px; line-height: 1.4; color: #BABAD6">{{selDesc}}</span>
      <sc-if value="{{showRank}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 2px">
          <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800"><span style="color: {{rankColor}}">{{rankLabel}}</span><span style="color: #A3A3C2">{{mmrLabel}}</span></div>
          <div style="height: 6px; border-radius: 3px; background: #26264A"><div style="{{rankBar}}"></div></div>
          <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700"><span style="color: #FFC53D">{{seasonLabel}}</span><a href="Rangos.dc.html">Ver rangos</a></div>
        </div>
      </sc-if>
    </div>
    <a href="{{playHref}}" onClick="{{saveSel}}" style="{{playStyle}}">{{playLabel}}</a>
  </div>
  <div style="position: absolute; left: 380px; top: 0; right: 0; bottom: 0; padding: 12px 14px 12px 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <div role="tablist" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #17172A; flex: none">
      <button type="button" role="tab" onClick="{{tabComp}}" style="{{compTab}}">COMPETITIVO</button>
      <button type="button" role="tab" onClick="{{tabCasual}}" style="{{casualTab}}">INFORMAL</button>
      <button type="button" role="tab" onClick="{{tabTrain}}" style="{{trainTab}}">ENTRENAMIENTO</button>
    </div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
      <sc-for list="{{cards}}" as="m" hint-placeholder-count="6">
        <button type="button" onClick="{{m.pick}}" style="{{m.style}}">
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 20px; line-height: 1.05; letter-spacing: .5px; text-align: left">{{m.title}}</span>
            <span style="{{m.tagStyle}}">{{m.tag}}</span>
          </span>
          <span style="font-size: 11px; line-height: 1.35; color: #A3A3C2; text-align: left">{{m.desc}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const sel = this.store('arenamix.sel') || {};
    const sport = this.store('arenamix.sport') || sel.sport || 'futbol';
    this.state = { sport, cat: sel.sport === sport && sel.cat ? sel.cat : 'comp', id: sel.sport === sport && sel.id ? sel.id : null };
  }
  catalog(sport) {
    const team = (n, soon) => ({ id: 'm' + n, title: n + 'VS' + n, kind: 'team', n, soon, desc: soon ? 'Partido por equipos. Lo estamos preparando.' : n === 1 ? 'Tú contra otro jugador, con porteros.' : n + ' contra ' + n + ', con porteros.' });
    const teams = (soon) => [1, 2, 3, 4].map((n) => team(n, soon));
    const S = {
      futbol: { name: 'FÚTBOL', c1: '#145A33', c2: '#22914F', modes: teams(false).concat([
        { id: 'pens', title: 'TANDA DE PENALTIS', kind: 'duel', duel: 'pen', desc: '5 tiros y 5 paradas por turnos. Muerte súbita.' },
        { id: 'fk', title: 'TIROS LIBRES', kind: 'duel', duel: 'free', desc: '7 escenarios distintos, con barrera.' }]),
        train: [{ id: 'train', title: 'PENALTIS Y FALTAS', href: 'Entrenamiento.dc.html', desc: 'Práctica libre con dianas y todos los escenarios.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      baloncesto: { name: 'BALONCESTO', c1: '#7A3B12', c2: '#C2652A', modes: teams(true).concat([
        { id: 'three', title: 'CONCURSO DE TRIPLES', kind: 'mg', comp: 'Baloncesto', mode: 'three', unit: 'puntos', rival: [6, 16], desc: '15 balones en 5 posiciones y 60 segundos; el último de cada posición vale doble.' },
        { id: 'ft', title: 'TIROS LIBRES', kind: 'mg', comp: 'Baloncesto', mode: 'free', unit: 'puntos', rival: [4, 9], desc: '10 tiros libres. Gana quien meta más.' }]),
        train: [{ id: 'train', title: 'PISTA LIBRE', href: 'Baloncesto.dc.html', desc: 'Triples y tiros libres sin presión.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      tenis: { name: 'TENIS', c1: '#1E3A8A', c2: '#2563C9', modes: teams(true).slice(0, 2).concat([
        { id: 'serve', title: 'DESAFÍO DE SAQUE', kind: 'mg', comp: 'Tenis', mode: 'serve', unit: 'puntos', rival: [6, 16], desc: '10 saques alternando lados. 1 punto en el cuadro, 3 en la zona marcada.' },
        { id: 'rally', title: 'DESAFÍO DE PELOTEO', kind: 'mg', comp: 'Tenis', mode: 'rally', unit: 'puntos', rival: [6, 16], desc: '10 bolas de la máquina: devuélvelas dentro; 3 puntos en la zona marcada.' }]),
        train: [{ id: 'train', title: 'PISTA DE TENIS', href: 'Tenis.dc.html', desc: 'Saques y peloteo sin presión.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      voley: { name: 'VÓLEY', c1: '#7A6430', c2: '#C9A85C', modes: teams(true).concat([
        { id: 'serve', title: 'DESAFÍO DE SAQUE', kind: 'mg', comp: 'Voley', mode: 'serve', unit: 'puntos', rival: [8, 22], desc: '10 saques. Las zonas marcadas valen 3.' },
        { id: 'spike', title: 'DESAFÍO DE REMATE', kind: 'mg', comp: 'Voley', mode: 'spike', unit: 'puntos', rival: [10, 24], desc: '10 remates contra el bloqueo.' }]),
        train: [{ id: 'train', title: 'PISTA LIBRE', href: 'Voley.dc.html', desc: 'Saques y remates a tu ritmo.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] }
    };
    return S[sport] || S.futbol;
  }
  tiers() {
    return [
      { name: 'Bronce', c1: '#C07A3E', c2: '#7A4520', text: '#E3A56E', wins: 4, start: 0 },
      { name: 'Plata', c1: '#C9D2DF', c2: '#6D788A', text: '#DCE3EE', wins: 6, start: 300 },
      { name: 'Oro', c1: '#F2C14E', c2: '#A8771A', text: '#F2C14E', wins: 8, start: 750 },
      { name: 'Platino', c1: '#5FD3C6', c2: '#24786F', text: '#7FE3D7', wins: 10, start: 1350 },
      { name: 'Diamante', c1: '#6FB6FF', c2: '#2A5FB0', text: '#8CC5FF', wins: 13, start: 2100 },
      { name: 'Campeón', c1: '#B57BFF', c2: '#5E2FA8', text: '#C79BFF', wins: 16, start: 3075, wings: true },
      { name: 'Super campeón', c1: '#FF5C8A', c2: '#A3204A', text: '#FF86A6', wins: 20, start: 4275, wings: true },
      { name: 'Élite', c1: '#FFE38A', c2: '#2A2410', text: '#FFE38A', wins: 25, start: 5775, wings: true }
    ];
  }
  rankOf(m) {
    const T = this.tiers();
    let i = T.length - 1;
    while (i > 0 && m < T[i].start) i--;
    const t = T[i], step = t.wins * 25;
    const div = Math.min(2, Math.floor((m - t.start) / step));
    const lo = t.start + div * step;
    const hi = div < 2 ? lo + step : (i < T.length - 1 ? T[i + 1].start : lo + step);
    return { ...t, div, label: t.name + ' ' + (div + 1), lo, hi, idx: i * 3 + div };
  }
  store(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
    return null;
  }
  season() {
    // Temporadas de 30 días (la 1 empieza el 1/10/2026). Al cambiar, se reinician los rangos y hay 5 clasificatorias por modo.
    const EPOCH = Date.UTC(2026, 9, 1), LEN = 30 * 864e5, now = Date.now();
    const n = Math.max(0, Math.floor((now - EPOCH) / LEN));
    let S = this.store('arenamix.season.v1');
    if (!S || S.n !== n) {
      const old = this.store('arenamix.mmr.v1') || {};
      S = { n, placed: {}, prev: old, notice: Object.keys(old).length > 0 };
      this.store('arenamix.mmr.v1', {});
      this.store('arenamix.season.v1', S);
    }
    S.num = n + 1;
    S.daysLeft = Math.max(1, Math.ceil((EPOCH + (n + 1) * LEN - now) / 864e5));
    return S;
  }
  placeOf(S, key) { return S.placed[key] || { g: 0, w: 0, d: 0, res: [] }; }
  placementMmr(p, prev) {
    // Rango inicial según las 5 clasificatorias (+ un poco del rango de la temporada anterior). Nunca pasa de Oro 3.
    const pts = p.w + p.d * 0.5;
    const base = [0, 120, 300, 480, 700, 900][Math.min(5, Math.floor(pts))] + Math.round((pts % 1) * 90);
    return Math.min(1150, base + Math.min(200, Math.round((prev || 0) * 0.12)));
  }
  mmrOf(sport, id) {
    const all = this.store('arenamix.mmr.v1') || {};
    return all[sport + ':' + id] || 0;
  }
  renderVals() {
    const s = this.state, C = this.catalog(s.sport);
    let list;
    if (s.cat === 'train') list = C.train;
    else list = C.modes.concat(s.cat === 'casual' ? [{ id: 'private', title: 'PARTIDA PRIVADA', kind: 'private', desc: 'Invita a tus amigos con un código. Los huecos los rellena la IA y le puedes dar órdenes.' }] : []);
    // the Unity version, exported from Unity to futbol3d/
    if (s.cat === 'casual' && s.sport === 'futbol') list = list.concat([{ id: 'f3d', title: 'FÚTBOL UNITY', kind: 'ext', href: 'futbol3d/index.html', desc: 'La versión hecha en Unity (prueba).' }]);
    let cur = list.find((m) => m.id === s.id && !m.soon) || list.find((m) => !m.soon);
    const comp = s.cat === 'comp', S = this.season();
    const placingOf = (m) => this.placeOf(S, s.sport + ':' + m.id).g < 5;
    const cards = list.map((m) => {
      const on = m === cur, mmr = comp && !m.soon ? this.mmrOf(s.sport, m.id) : 0, R = this.rankOf(mmr);
      const tag = m.soon ? 'PRÓXIMAMENTE' : comp ? (placingOf(m) ? 'Clasif. ' + this.placeOf(S, s.sport + ':' + m.id).g + '/5' : R.label) : s.cat === 'casual' ? (m.kind === 'private' ? 'Amigos' : 'Sin rango') : 'Libre';
      return {
        title: m.title, desc: m.desc, tag,
        style: 'display: flex; flex-direction: column; gap: 6px; min-height: 84px; padding: 10px; box-sizing: border-box; border-radius: 14px; font-family: Manrope, sans-serif; color: #F4F4FA; cursor: ' + (m.soon ? 'default' : 'pointer') + '; opacity: ' + (m.soon ? 0.45 : 1) + '; ' + (on ? 'background: #10303A; border: 2px solid #22D3EE;' : 'background: #17172A; border: 2px solid #26264A;'),
        tagStyle: 'flex: none; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 6px; white-space: nowrap; ' + (comp && !m.soon ? 'background: #0B0B14; color: ' + (placingOf(m) ? '#A3A3C2' : R.text) + ';' : 'background: #21213A; color: #A3A3C2;'),
        pick: () => { if (!m.soon) this.setState({ id: m.id }); }
      };
    });
    const mmr = cur && comp ? this.mmrOf(s.sport, cur.id) : 0, R = this.rankOf(mmr);
    const curPlacing = cur && comp && placingOf(cur), curPc = cur ? this.placeOf(S, s.sport + ':' + cur.id) : null;
    const tab = (on) => 'flex: 1; height: 36px; border: 0; border-radius: 10px; font: 800 12px Manrope, sans-serif; letter-spacing: .5px; cursor: pointer; ' + (on ? 'background: #22D3EE; color: #0B0B14;' : 'background: transparent; color: #CACAE0;');
    const href = !cur ? '#' : s.cat === 'train' || cur.kind === 'ext' ? cur.href : cur.kind === 'private' ? 'Privada.dc.html' : comp ? 'Competitivo.dc.html' : 'Rapida.dc.html';
    const catName = { comp: 'COMPETITIVO', casual: 'INFORMAL', train: 'ENTRENAMIENTO' }[s.cat];
    return {
      sportName: C.name, sportSize: C.name.length > 7 ? 32 : 40,
      bannerStyle: 'flex: none; height: 104px; padding: 10px 12px; box-sizing: border-box; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, ' + C.c1 + ', ' + C.c2 + ');',
      catLabel: catName + (comp ? ' · CON RANGO' : s.cat === 'casual' ? ' · SIN RANGO' : ''),
      catColor: comp ? '#E3A56E' : s.cat === 'casual' ? '#22D3EE' : '#53D88E',
      selTitle: cur ? cur.title : '', selDesc: cur ? cur.desc : '',
      showRank: comp && !!cur,
      rankLabel: curPlacing ? 'Sin clasificar' : R.label, rankColor: curPlacing ? '#A3A3C2' : R.text,
      mmrLabel: curPlacing ? 'Clasificatorias ' + curPc.g + '/5' : mmr + ' MMR',
      seasonLabel: 'Temporada ' + S.num + ' · termina en ' + S.daysLeft + (S.daysLeft === 1 ? ' día' : ' días'),
      rankBar: 'height: 6px; border-radius: 3px; background: ' + R.text + '; width: ' + (Math.max(0, Math.min(1, (mmr - R.lo) / (R.hi - R.lo))) * 100).toFixed(1) + '%;',
      cards,
      compTab: tab(comp), casualTab: tab(s.cat === 'casual'), trainTab: tab(s.cat === 'train'),
      tabComp: () => this.setState({ cat: 'comp', id: null }),
      tabCasual: () => this.setState({ cat: 'casual', id: null }),
      tabTrain: () => this.setState({ cat: 'train', id: null }),
      playHref: href,
      playLabel: s.cat === 'train' ? 'ENTRENAR' : cur && cur.kind === 'private' ? 'CREAR SALA' : comp ? 'BUSCAR PARTIDA' : 'JUGAR',
      playStyle: 'display: flex; align-items: center; justify-content: center; flex: none; height: 50px; border-radius: 14px; background: #22D3EE; color: #0B0B14; text-decoration: none; font-family: \'Barlow Condensed\', sans-serif; font-weight: 800; font-style: italic; font-size: 24px; letter-spacing: 2px; box-shadow: 0 5px 0 #0E8FA3;',
      saveSel: () => { if (cur) this.store('arenamix.sel', { sport: s.sport, cat: s.cat, id: cur.id }); }
    };
  }
}
</script>
</body>
</html>
