<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rangos competitivos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
@keyframes rgSpin{to{transform:rotate(360deg)}}
@keyframes rgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes rgPop{from{opacity:0;transform:scale(.4) rotate(-10deg)}}
@keyframes rgPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes rgDash{to{stroke-dashoffset:-24}}
@keyframes rgPin{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.rg-node{position:absolute;width:64px;height:82px;margin:-44px 0 0 -32px;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.rg-node:hover{transform:translateY(-4px) scale(1.06)}
.rg-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#0F062A 0%,#1E0D4F 55%,#2D0F60 100%);contain:layout paint}
.rg-stars{position:absolute;inset:0 0 35% 0;background:radial-gradient(circle,#ffffffcc 1px,transparent 1.6px) 0 0/53px 41px,radial-gradient(circle,#ffffff88 .8px,transparent 1.4px) 21px 17px/37px 29px;-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent)}
.rg-stars.b{background:radial-gradient(circle,#ffffff 1.2px,transparent 2px) 11px 7px/89px 67px;animation:rgTw 2.6s ease-in-out infinite}
@keyframes rgTw{0%,100%{opacity:.2}50%{opacity:1}}
.rg-aur{position:absolute;left:-20%;top:-30%;width:140%;height:90%;background:radial-gradient(40% 35% at 30% 50%,color-mix(in srgb,var(--rc) 45%,transparent),transparent 70%),radial-gradient(35% 30% at 70% 40%,color-mix(in srgb,var(--rc) 30%,#22D3EE33),transparent 70%);opacity:.7;will-change:transform;animation:rgAur 14s ease-in-out infinite alternate;transition:background .6s}
@keyframes rgAur{from{transform:translateX(-6%) skewY(-3deg)}to{transform:translateX(6%) skewY(3deg)}}
.rg-mt{position:absolute;left:-10%;width:120%;bottom:0;will-change:transform}
.rg-mt.f{height:62%;animation:rgDrift 40s ease-in-out infinite alternate}
.rg-mt.m{height:46%;animation:rgDrift 28s ease-in-out infinite alternate-reverse}
.rg-mt.n{height:30%;animation:rgDrift 20s ease-in-out infinite alternate}
@keyframes rgDrift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
.rg-cloud{position:absolute;width:220px;height:46px;border-radius:50%;background:radial-gradient(closest-side,#ffffff1c,transparent);will-change:transform;animation:rgCloud 38s linear infinite}
@keyframes rgCloud{from{transform:translateX(-260px)}to{transform:translateX(1100px)}}
.rg-spark i{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc);opacity:0;will-change:transform,opacity;animation:rgUp 6s linear infinite}
@keyframes rgUp{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-330px);opacity:0}}
.rg-shoot{position:absolute;width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#FFFFFF);opacity:0;transform:rotate(-24deg);animation:rgShoot 7s ease-in infinite}
@keyframes rgShoot{0%,82%{opacity:0;translate:0 0}85%{opacity:1}100%{opacity:0;translate:-320px 140px}}
.rg-flag{transform-origin:0 50%;animation:rgWave 1.2s ease-in-out infinite alternate}
@keyframes rgWave{from{transform:skewY(-6deg) scaleX(.94)}to{transform:skewY(5deg) scaleX(1.04)}}
.rg-ped{position:absolute;left:50%;width:150px;height:26px;margin-left:-75px;border-radius:50%;pointer-events:none}
.rg-bar{height:8px;border-radius:4px;background:#150925;box-shadow:inset 0 1px 2px #000a;overflow:hidden}
.rg-bar i{display:block;height:100%;border-radius:4px}
.rg-mt,.rg-cloud,.rg-aur{display:none}
.rg-badge{display:block;filter:drop-shadow(0 6px 8px #000c);transition:filter .3s}
.rg-badge.lk{filter:grayscale(.4) brightness(.72) drop-shadow(0 4px 6px #000c)}
.rg-ped2{position:absolute;left:50%;top:40px;width:62px;height:16px;margin-left:-31px;border-radius:50%;background:radial-gradient(closest-side,var(--nc),transparent);opacity:.75;pointer-events:none}
.rg-hero{position:absolute;left:18px;top:60px;width:282px;bottom:12px;box-sizing:border-box;padding:10px 12px 12px;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:radial-gradient(90% 55% at 50% 22%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 70%),linear-gradient(180deg,#06102EE6,#02040CF2);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 70%,#02040C),inset 0 2px 0 #ffffff22,0 0 24px color-mix(in srgb,var(--rc) 35%,transparent),0 10px 24px #000a}
.rg-name{position:relative;margin-top:-6px;font-family:'Titulos',sans-serif;font-size:30px;line-height:1.05;letter-spacing:1px;background:linear-gradient(180deg,#FFFFFF 0%,color-mix(in srgb,var(--rc) 35%,#fff) 45%,var(--rc) 55%,color-mix(in srgb,var(--rc) 55%,#02040C) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #02040C;filter:drop-shadow(0 3px 0 #02040C) drop-shadow(0 0 12px color-mix(in srgb,var(--rc) 60%,transparent))}
.rg-info{flex:1;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0;border-radius:12px;background:linear-gradient(180deg,#06102EE6,#02040CF2);box-shadow:inset 0 0 0 1.5px var(--ic),inset 0 2px 0 #ffffff14,0 0 12px color-mix(in srgb,var(--ic) 30%,transparent)}
.rg-info b{font-family:'Titulos',sans-serif;font-size:21px;color:var(--ic);text-shadow:0 2px 0 #02040C}
.rg-info span{font-size:10px;line-height:1.2;font-weight:700;color:#DCE6F5}
.rg-step{display:flex;align-items:center;gap:6px;padding:0 8px;min-width:0;border-radius:12px;box-shadow:inset 0 2px 0 #ffffff14,inset 0 -3px 0 #0007}
</style>
</helmet>
<div class="bc-stage" style="position: relative; width: 844px; height: 390px; box-sizing: border-box; isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif; overflow: hidden; {{stageVars}}">
  <!-- night sky over the mountains you climb: aurora in the chosen rank's colour, stars, clouds, sparks -->
  <div class="rg-bg">
    <div class="rg-aur"></div>
    <div class="rg-stars"></div><div class="rg-stars b"></div>
    <div class="rg-cloud" style="top: 40px; animation-delay: -6s"></div><div class="rg-cloud" style="top: 120px; animation-delay: -24s; animation-duration: 52s; width: 300px"></div>
    <svg class="rg-mt f" viewBox="0 0 1000 240" preserveAspectRatio="none"><path d="M0 240L0 150L70 110L120 135L190 60L250 115L320 80L380 120L450 30L520 100L590 70L650 120L720 40L790 95L860 65L930 110L1000 80L1000 240Z" fill="color-mix(in srgb, var(--rc) 22%, #291160)"/><path d="M190 60L205 75L180 82ZM450 30L468 50L440 58ZM720 40L736 58L708 64Z" fill="#ffffff44"/></svg>
    <svg class="rg-mt m" viewBox="0 0 1000 180" preserveAspectRatio="none"><path d="M0 180L0 120L90 70L160 110L250 50L330 100L410 60L500 115L590 55L680 105L760 70L850 120L930 75L1000 100L1000 180Z" fill="#220E48"/></svg>
    <svg class="rg-mt n" viewBox="0 0 1000 120" preserveAspectRatio="none"><path d="M0 120L0 70L120 40L220 75L340 30L460 70L580 35L700 80L820 45L920 75L1000 55L1000 120Z" fill="#160832"/></svg>
    <i class="rg-shoot" style="left: 760px; top: 30px"></i><i class="rg-shoot" style="left: 560px; top: 70px; animation-delay: -3.4s; animation-duration: 9s"></i>
    <div class="rg-spark"><sc-for list="{{sparks}}" as="k" hint-placeholder-count="0"><i style="{{k}}"></i></sc-for></div>
  </div>
  <!-- header -->
  <div style="position: absolute; left: 18px; top: 12px; display: flex; align-items: center; gap: 10px; z-index: 3">
    <a href="Modos.dc.html" aria-label="Volver" class="bc-para" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 38px; background: #251443; color: #F4F4FA"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
    <h1 class="bc-title hd" style="font-size: 28px">RANGOS</h1>
    <span style="font-size: 12px; color: #A3A3C2; font-weight: 700">Fútbol · Competitivo · {{season}}</span>
  </div>

  <!-- the chosen rank, up close -->
  <section class="rg-hero">
    <div style="position: absolute; left: 50%; top: 86px; width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 50%; background: repeating-conic-gradient(color-mix(in srgb, var(--rc) 30%, transparent) 0 8deg, transparent 10deg 22deg); -webkit-mask-image: radial-gradient(closest-side, #000, transparent); mask-image: radial-gradient(closest-side, #000, transparent); pointer-events: none"></div>
    <div key="{{heroKey}}" style="position: relative; display: flex; flex-direction: column; align-items: center; animation: rgPop .45s cubic-bezier(.2,1.6,.4,1) both">
      <span class="rg-ped" style="top: 118px; background: radial-gradient(closest-side, {{heroC}}AA, {{heroC}}22 60%, transparent)"></span>
      <img class="rg-badge" src="{{heroBadge}}" alt="" width="132" height="143" style="animation: rgFloat 3s ease-in-out infinite">
      <span class="rg-name">{{heroName}}</span>
      <span style="margin-top: 2px; font-size: 10.5px; font-weight: 800; letter-spacing: 1.5px; color: #BFD0EA">{{heroSub}}</span>
    </div>
    <!-- where you stand against this rank -->
    <div key="{{heroKey}}p" style="position: relative; width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 14px; background: #02040CB3; box-shadow: inset 0 0 0 1px {{heroC}}66; display: flex; flex-direction: column; gap: 5px; animation: rgPop .4s .1s cubic-bezier(.2,1.6,.4,1) both">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px">
        <span style="font-size: 9.5px; font-weight: 800; letter-spacing: 1.5px; color: {{heroText}}">{{progTitle}}</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; color: {{progColor}}">{{progRight}}</span>
      </div>
      <div class="rg-bar"><i style="{{progBar}}"></i></div>
      <span style="font-size: 10.5px; font-weight: 700; color: #CACAE0">{{progText}}</span>
    </div>
    <!-- its three divisions, as steps -->
    <div style="position: relative; display: flex; align-items: flex-end; gap: 6px; margin-top: 10px; width: 100%">
      <sc-for list="{{divs}}" as="d" hint-placeholder-count="3">
        <div class="rg-step" style="{{d.style}}">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; line-height: 1">{{d.n}}</span>
          <span style="display: flex; flex-direction: column; line-height: 1.1"><b style="font-size: 9px; letter-spacing: 1px; opacity: .8">DIVISIÓN</b><span style="font-size: 9.5px; font-weight: 700; white-space: nowrap">{{d.range}}</span></span>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- the climb: every rank on the way up, the path lit as far as you have got -->
  <div style="position: absolute; left: 312px; right: 14px; top: 56px; height: 268px">
    <svg width="518" height="268" viewBox="0 0 518 268" style="position: absolute; inset: 0; overflow: visible">
      <defs><linearGradient id="rgPath" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#C07A3E"/><stop offset=".3" stop-color="#C9D2DF"/><stop offset=".5" stop-color="#F2C14E"/><stop offset=".7" stop-color="#6FB6FF"/><stop offset="1" stop-color="#FFE38A"/></linearGradient></defs>
      <path d="M0 268 L60 222 L118 236 L182 176 L246 190 L310 128 L372 140 L436 74 L518 40 L518 268Z" fill="#ffffff06"/>
      <path d="{{pathD}}" fill="none" stroke="#02040C" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      <path d="{{pathD}}" fill="none" stroke="#0A1A4A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="{{pathD}}" fill="none" stroke="#ffffff22" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" style="animation: rgDash 1.4s linear infinite"/>
      <path d="{{pathD}}" fill="none" stroke="url(#rgPath)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="{{pathDone}}" style="filter: drop-shadow(0 0 8px #3DA9FF)"/>
    </svg>
    <sc-for list="{{nodes}}" as="r" hint-placeholder-count="8">
      <button type="button" class="rg-node" onClick="{{r.pick}}" aria-label="{{r.name}}" style="{{r.pos}}">
        <sc-if value="{{r.sel}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; top: 26px; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: radial-gradient(closest-side, {{r.c1}}88, transparent); animation: rgPulse 1.6s ease-in-out infinite"></span></sc-if>
        <span class="rg-ped2" style="--nc: {{r.c1}}"></span>
        <img class="{{r.badgeCls}}" src="{{r.badge}}" alt="" style="{{r.svgStyle}}">
        <span style="{{r.labelStyle}}">{{r.short}}</span>
        <sc-if value="{{r.locked}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 6px; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #150925; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="#8686A6"><path d="M7 10V7a5 5 0 0 1 10 0v3h1v11H6V10zm2 0h6V7a3 3 0 0 0-6 0z"/></svg></span></sc-if>
      </button>
    </sc-for>
    <!-- the summit: a flag waving over Élite -->
    <svg width="34" height="44" viewBox="0 0 34 44" style="{{flagStyle}}"><path d="M3 2V44" stroke="#E6E9F0" stroke-width="2.5" stroke-linecap="round"/><g class="rg-flag"><path d="M4 3h26l-6 8l6 8H4z" fill="#FFC53D"/><path d="M12 7l1.3 2.6 2.9.4-2.1 2 .5 2.9L12 13.5l-2.6 1.4.5-2.9-2.1-2 2.9-.4z" fill="#7A4E0E"/></g></svg>
    <!-- you, on the climb -->
    <div style="{{pinStyle}}">
      <span style="display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border-radius: 16px; background: #22D3EE; color: #150925; box-shadow: 0 0 0 2px #0D2C5B, 0 4px 0 #0D2C5B, 0 0 16px #22D3EE88; white-space: nowrap">
        <img src="{{me}}" alt="" style="width: 24px; height: 24px; border-radius: 12px; object-fit: cover; object-position: 50% 0; background: #150925">
        <b style="font: 800 11px Exo2, sans-serif">TÚ · {{myLabel}}</b>
      </span>
      <span style="{{pinArrow}}"></span>
    </div>
  </div>

  <!-- how you climb -->
  <div style="position: absolute; left: 312px; right: 14px; bottom: 12px; display: flex; gap: 8px">
    <div class="rg-info" style="--ic: #34D399"><b>+25</b><span>MMR por victoria<br>(+20 desde Campeón)</span></div>
    <div class="rg-info" style="--ic: #FF6B7A"><b>−25</b><span>MMR por derrota<br>(−12 en Bronce)</span></div>
    <div class="rg-info" style="--ic: #3DA9FF; flex: 1.25"><b>5</b><span>partidas de clasificación<br>al empezar cada temporada</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const R = this.ranks(), me = this.myMmr(), i = this.tierOf(me);
    this.state = { sel: R[i].id };
  }
  ranks() {
    return [
      { id: 'bronce', name: 'Bronce', short: 'Bronce', c1: '#C07A3E', c2: '#7A4520', text: '#E3A56E', wins: 4, start: 0 },
      { id: 'plata', name: 'Plata', short: 'Plata', c1: '#C9D2DF', c2: '#6D788A', text: '#DCE3EE', wins: 6, start: 300 },
      { id: 'oro', name: 'Oro', short: 'Oro', c1: '#F2C14E', c2: '#A8771A', text: '#F2C14E', wins: 8, start: 750 },
      { id: 'platino', name: 'Platino', short: 'Platino', c1: '#5FD3C6', c2: '#24786F', text: '#7FE3D7', wins: 10, start: 1350 },
      { id: 'diamante', name: 'Diamante', short: 'Diamante', c1: '#6FB6FF', c2: '#2A5FB0', text: '#8CC5FF', wins: 13, start: 2100 },
      { id: 'campeon', name: 'Campeón', short: 'Campeón', c1: '#B57BFF', c2: '#5E2FA8', text: '#C79BFF', wins: 16, start: 3075, wings: true },
      { id: 'super', name: 'Super campeón', short: 'Super C.', c1: '#FF5C8A', c2: '#A3204A', text: '#FF86A6', wins: 20, start: 4275, wings: true, crown: true },
      { id: 'elite', name: 'Élite', short: 'Élite', c1: '#FFE38A', c2: '#2A2410', text: '#FFE38A', wins: 25, start: 5775, wings: true, crown: true }
    ];
  }
  // your best football MMR (each mode has its own)
  myMmr() {
    let all = {};
    try { all = JSON.parse(localStorage.getItem('arenamix.mmr.v1') || '{}') || {}; } catch (e) {}
    return Object.keys(all).filter((k) => k.indexOf('futbol:') === 0).reduce((m, k) => Math.max(m, Number(all[k]) || 0), 0);
  }
  // how you stand against the rank on show: climbing it, still to reach it, or already past it
  progress(R, i, mi, mmr, mdiv, mstep) {
    const r = R[i], wins = (n) => Math.max(1, Math.ceil(n / 25));
    if (i === mi) {
      const lo = r.start + mdiv * mstep, hi = mdiv < 2 ? lo + mstep : (i < R.length - 1 ? R[i + 1].start : lo + mstep);
      const f = Math.max(0, Math.min(1, (mmr - lo) / Math.max(1, hi - lo))), left = Math.max(0, hi - mmr);
      const goal = mdiv < 2 ? 'División ' + (mdiv + 2) : i < R.length - 1 ? R[i + 1].name : 'la cima';
      return { progTitle: 'TU PROGRESO · DIVISIÓN ' + (mdiv + 1), progRight: Math.round(f * 100) + '%', progColor: '#22D3EE',
        progBar: 'width: ' + (f * 100).toFixed(1) + '%; background: linear-gradient(90deg, ' + r.c2 + ', ' + r.c1 + ', #FFFFFF); box-shadow: 0 0 8px ' + r.c1,
        progText: 'Te faltan ' + this.fmt(left) + ' MMR para ' + goal + ' (≈ ' + wins(left) + ' victorias)' };
    }
    if (i > mi) {
      const left = r.start - mmr;
      return { progTitle: 'BLOQUEADO', progRight: this.fmt(r.start) + ' MMR', progColor: '#8686A6',
        progBar: 'width: ' + Math.max(3, Math.min(100, mmr / Math.max(1, r.start) * 100)).toFixed(1) + '%; background: #3A3A64',
        progText: 'Te faltan ' + this.fmt(left) + ' MMR (≈ ' + wins(left) + ' victorias)' };
    }
    return { progTitle: 'SUPERADO', progRight: '✓', progColor: '#53D88E', progBar: 'width: 100%; background: linear-gradient(90deg, #2F8A57, #53D88E)', progText: 'Ya has pasado por aquí. ¡Sigue subiendo!' };
  }
  // each rank's badge, drawn as an SVG: a metal shield with the match ball, gaining ornaments as you climb
  badge(r, k) {
    const key = 'b' + k; this._bc = this._bc || {}; if (this._bc[key]) return this._bc[key];
    const lt = (h, t) => { const n = parseInt(h.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v + (255 - v) * t)); return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join(''); };
    const dk = (h, t) => { const n = parseInt(h.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v * (1 - t))); return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join(''); };
    const c1 = r.c1, c2 = r.c2, O = '#02040C';
    let g = '<defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + lt(c1, 0.55) + '"/><stop offset=".45" stop-color="' + c1 + '"/><stop offset=".55" stop-color="' + dk(c1, 0.2) + '"/><stop offset="1" stop-color="' + dk(c1, 0.45) + '"/></linearGradient>' +
      '<radialGradient id="f" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="' + lt(c2, 0.15) + '"/><stop offset="1" stop-color="' + dk(c2, 0.6) + '"/></radialGradient>' +
      '<linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".4" stop-color="' + lt(c1, 0.3) + '"/><stop offset="1" stop-color="' + dk(c1, 0.3) + '"/></linearGradient>' +
      '<radialGradient id="h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="' + c1 + '" stop-opacity=".7"/><stop offset="1" stop-color="' + c1 + '" stop-opacity="0"/></radialGradient></defs>';
    // Élite: a halo of rays behind everything
    if (k >= 7) { g += '<circle cx="60" cy="62" r="60" fill="url(#h)"/>'; for (let a = 0; a < 16; a++) { const t = a / 16 * Math.PI * 2; g += '<path d="M60 62L' + (60 + Math.cos(t - 0.07) * 62).toFixed(1) + ' ' + (62 + Math.sin(t - 0.07) * 62).toFixed(1) + 'L' + (60 + Math.cos(t + 0.07) * 62).toFixed(1) + ' ' + (62 + Math.sin(t + 0.07) * 62).toFixed(1) + 'Z" fill="' + c1 + '" opacity=".28"/>'; } }
    // Diamante: a cut diamond behind the shield
    if (k === 4) g += '<path d="M60 2L112 60L60 126L8 60Z" fill="url(#gm)" stroke="' + O + '" stroke-width="3" stroke-linejoin="round"/><path d="M60 2L60 126M8 60L112 60" stroke="#ffffff55" stroke-width="1.5"/>';
    // wings: Campeón and up (bigger for the top two)
    if (k >= 5) {
      const big = k >= 6 ? 1.25 : 1;
      [-1, 1].forEach((sd) => {
        for (let f = 0; f < 4; f++) {
          const y = 34 + f * 13, L = (40 - f * 6) * big, x0 = 60 + sd * 30;
          g += '<path d="M' + x0 + ' ' + (y + 8) + 'Q' + (x0 + sd * L * 0.6) + ' ' + (y - 10 - f * 2) + ' ' + (x0 + sd * L) + ' ' + (y - 6 + f * 3) + 'Q' + (x0 + sd * L * 0.55) + ' ' + (y + 6) + ' ' + x0 + ' ' + (y + 16) + 'Z" fill="url(#m)" stroke="' + O + '" stroke-width="2.5" stroke-linejoin="round"/>';
        }
      });
    }
    // Oro: laurel branches
    if (k === 2 || k === 3) [-1, 1].forEach((sd) => { for (let f = 0; f < 5; f++) { const y = 34 + f * 15, x = 60 + sd * (40 + Math.sin(f / 4 * Math.PI) * 6); g += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y + '" rx="5" ry="10" transform="rotate(' + (sd * (35 + f * 6)) + ' ' + x.toFixed(1) + ' ' + y + ')" fill="url(#m)" stroke="' + O + '" stroke-width="2"/>'; } });
    // Plata: side spikes
    if (k === 1) [-1, 1].forEach((sd) => { g += '<path d="M' + (60 + sd * 36) + ' 30L' + (60 + sd * 52) + ' 22L' + (60 + sd * 40) + ' 48Z" fill="url(#m)" stroke="' + O + '" stroke-width="2.5" stroke-linejoin="round"/>'; });
    // the shield
    const sh = k >= 3 ? 'M60 6L74 16L98 22V66C98 92 82 108 60 120C38 108 22 92 22 66V22L46 16Z' : 'M60 8L98 22V66C98 92 82 108 60 120C38 108 22 92 22 66V22Z';
    g += '<path d="' + sh + '" fill="url(#m)" stroke="' + O + '" stroke-width="3.5" stroke-linejoin="round"/>';
    g += '<path d="M60 20L88 30V66C88 86 76 99 60 108C44 99 32 86 32 66V30Z" fill="url(#f)" stroke="' + dk(c1, 0.5) + '" stroke-width="2"/>';
    g += '<path d="M60 20L88 30V48C78 42 70 40 60 40C50 40 42 42 32 48V30Z" fill="#ffffff" opacity=".12"/>';
    // the ball in the middle
    g += '<circle cx="60" cy="64" r="17" fill="#F7F8FC" stroke="' + O + '" stroke-width="2.5"/><path d="M60 55L68 61L65 70H55L52 61Z" fill="' + O + '"/>' +
      '<path d="M60 55V48M68 61L75 58M65 70L70 77M55 70L50 77M52 61L45 58" stroke="' + O + '" stroke-width="2"/>';
    // stars under the ball: one more for each rank inside a group of three
    const ns = k < 7 ? (k % 3) + 1 : 3;
    for (let q = 0; q < ns; q++) { const x = 60 + (q - (ns - 1) / 2) * 13, y = 94; g += '<path d="M' + x + ' ' + (y - 6) + 'l1.8 3.8 4.2.6-3 2.9.7 4.1-3.7-2-3.7 2 .7-4.1-3-2.9 4.2-.6z" fill="' + lt(c1, 0.4) + '" stroke="' + O + '" stroke-width="1.2"/>'; }
    // Platino: a gem on top
    if (k === 3) g += '<path d="M60 0L68 9L60 20L52 9Z" fill="url(#gm)" stroke="' + O + '" stroke-width="2.5" stroke-linejoin="round"/>';
    // crowns: Super campeón and Élite
    if (k >= 6) g += '<path d="M40 14L42 -6L51 4L60 -10L69 4L78 -6L80 14Z" fill="#FFC53D" stroke="' + O + '" stroke-width="3" stroke-linejoin="round"/><circle cx="60" cy="4" r="3" fill="#FF3D7F" stroke="' + O + '" stroke-width="1.5"/><path d="M42 10H78" stroke="#FFF2B8" stroke-width="2" opacity=".7"/>';
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -14 132 144" width="132" height="144">' + g + '</svg>';
    return (this._bc[key] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
  }
  tierOf(m) { const R = this.ranks(); let i = R.length - 1; while (i > 0 && m < R[i].start) i--; return i; }
  fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  renderVals() {
    const R = this.ranks(), sel = this.state.sel, i = R.findIndex((r) => r.id === sel), r = R[i];
    const mmr = this.myMmr(), mi = this.tierOf(mmr), mt = R[mi], mstep = mt.wins * 25, mdiv = Math.min(2, Math.floor((mmr - mt.start) / mstep));
    // nodes climb from bottom left to top right
    const P = R.map((x, k) => [30 + k * 65, 236 - k * 27 - (k % 2) * 8]);
    const pathD = 'M' + P.map((q) => q[0] + ' ' + (q[1] + 6)).join(' L');
    // how far along the climb you are (between your rank's node and the next)
    const nextStart = mi < R.length - 1 ? R[mi + 1].start : mt.start + mstep * 3;
    const frac = Math.min(1, (mmr - mt.start) / Math.max(1, nextStart - mt.start));
    const along = (mi + (mi < R.length - 1 ? frac : 0)) / (R.length - 1) * 100;
    const [px, py] = mi < R.length - 1 ? [P[mi][0] + (P[mi + 1][0] - P[mi][0]) * frac, P[mi][1] + (P[mi + 1][1] - P[mi][1]) * frac] : P[mi];
    const PO = window.AMPosters, me = PO && PO.cardKey ? PO.get(PO.cardKey(), () => this.forceUpdate()) : '';
    const step = r.wins * 25;
    const divs = [0, 1, 2].map((k) => {
      const lo = r.start + k * step, hi = k < 2 ? lo + step - 1 : (i < R.length - 1 ? R[i + 1].start - 1 : null);
      const yours = i === mi && k === mdiv;
      return {
        n: String(k + 1),
        range: hi === null ? this.fmt(lo) + '+' : this.fmt(lo) + '–' + this.fmt(hi),
        style: 'flex: 1; height: ' + (34 + k * 9) + 'px; color: ' + (yours ? '#150925' : r.text) + '; background: ' + (yours ? r.c1 : 'linear-gradient(180deg, ' + r.c2 + 'aa, #02040C)') + '; box-shadow: inset 0 0 0 1.5px ' + r.c1 + '66;' + (yours ? ' box-shadow: inset 0 2px 0 #ffffff66, inset 0 -3px 0 #0005, 0 0 14px ' + r.c1 + '88;' : '')
      };
    });
    const rnd = (k) => { const x = Math.sin(k * 77.3) * 43758.5; return x - Math.floor(x); };
    return {
      stageVars: '--rc: ' + r.c1 + ';',
      sparks: Array.from({ length: 16 }, (_, k) => 'left: ' + (rnd(k + 1) * 844).toFixed(0) + 'px; animation-duration: ' + (4.5 + rnd(k + 30) * 4).toFixed(2) + 's; animation-delay: -' + (rnd(k + 60) * 8).toFixed(2) + 's'),
      season: 'Temporada 1',
      heroStyle: 'position: absolute; left: 18px; top: 60px; width: 282px; bottom: 12px; box-sizing: border-box; padding: 14px 12px 12px; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: radial-gradient(90% 60% at 50% 25%, ' + r.c2 + '88, #1D0E43 70%); box-shadow: inset 0 2px 0 #ffffff18, inset 0 -4px 0 #0008, inset 0 0 0 2px ' + r.c1 + '55, 0 10px 24px #0008;',
      heroKey: 'h' + sel, heroC: r.c1, heroC2: r.c2, heroText: r.text, heroName: r.name.toUpperCase(),
      heroWings: !!r.wings, heroCrown: !!r.crown, heroBadge: this.badge(r, i),
      heroSub: '3 DIVISIONES · ≈ ' + r.wins + ' VICTORIAS CADA UNA',
      divs,
      pathD, pathDone: along.toFixed(1) + ' 100',
      nodes: R.map((x, k) => ({
        name: x.name, short: x.short, c1: x.c1, c2: x.c2, wings: !!x.wings, crown: !!x.crown,
        sel: x.id === sel, locked: k > mi,
        pos: 'left: ' + P[k][0] + 'px; top: ' + P[k][1] + 'px;',
        badge: this.badge(x, k), badgeCls: 'rg-badge' + (k > mi ? ' lk' : ''),
        svgStyle: 'position: relative; width: ' + (x.id === sel ? 62 : 52) + 'px; height: ' + (x.id === sel ? 68 : 57) + 'px;',
        labelStyle: 'position: relative; margin-top: -2px; padding: 1px 7px; border-radius: 8px; background: #02040CE0; box-shadow: inset 0 0 0 1px ' + (x.id === sel ? x.c1 : '#1E8BFF44') + '; font: 800 10px Exo2, sans-serif; white-space: nowrap; color: ' + (x.id === sel ? x.text : k > mi ? '#6A7A9A' : '#DCE6F5') + ';',
        pick: () => this.setState({ sel: x.id })
      })),
      pinArrow: py > 90 ? 'width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #22D3EE' : 'order: -1; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid #22D3EE',
      flagStyle: 'position: absolute; left: ' + (P[R.length - 1][0] + 14) + 'px; top: ' + (P[R.length - 1][1] - 70) + 'px; pointer-events: none; filter: drop-shadow(0 0 8px #FFC53D88)',
      ...this.progress(R, i, mi, mmr, mdiv, mstep),
      pinStyle: 'position: absolute; left: ' + px.toFixed(0) + 'px; top: ' + (py > 90 ? py - 92 : py + 34).toFixed(0) + 'px; translate: -50% 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 2; animation: rgPin 1.8s ease-in-out infinite;',
      me, myLabel: this.fmt(mmr) + ' MMR'
    };
  }
}
