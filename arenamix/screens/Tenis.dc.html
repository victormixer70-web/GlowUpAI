<!doctype html>
<html lang="es">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: #0E0E1C; color: #F4F4FA; font-family: Manrope, sans-serif; user-select: none; -webkit-user-select: none">
  <canvas ref="{{canvasRef}}" width="844" height="390" style="position: absolute; left: 0; top: 0; width: 844px; height: 390px; display: block"></canvas>
  <svg width="844" height="390" viewBox="0 0 844 390" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <polyline points="{{swipePts}}" fill="none" stroke="#C8F031" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  </svg>
  <button type="button" aria-label="{{zoneLabel}}" onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pCancel}}" style="position: absolute; inset: 0; width: 844px; height: 390px; padding: 0; border: 0; background: transparent; touch-action: none; cursor: crosshair"></button>
  <sc-if value="{{no3d}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #CACAE0">Tu navegador no permite gráficos 3D (WebGL) en esta vista.</div></sc-if>

  <div style="position: absolute; left: 12px; top: 10px; z-index: 2; display: flex; align-items: center; gap: 8px">
    <a href="Modos.dc.html" aria-label="Volver a modos" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #0B0B14CC; color: #F4F4FA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
    </a>
    <span style="padding: 8px 12px; border-radius: 12px; background: #0B0B14CC; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 20px; letter-spacing: 1px">TENIS</span>
    <div style="{{tabsStyle}}">
      <button type="button" onClick="{{setServe}}" style="{{serveTab}}">Saque</button>
      <button type="button" onClick="{{setRally}}" style="{{rallyTab}}">Peloteo</button>
    </div>
  </div>
  <div style="position: absolute; right: 12px; top: 10px; display: flex; gap: 6px">
    <span style="display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 4px 10px; border-radius: 12px; background: #0B0B14CC"><span style="font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #A3A3C2">BOLA</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1">{{ballLabel}}</span></span>
    <span style="display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 4px 10px; border-radius: 12px; background: #0B0B14CC"><span style="font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #A3A3C2">PUNTOS</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; color: #C8F031">{{ptsLabel}}</span></span>
  </div>

    </div>

    </div>

  <sc-if value="{{showStart}}" hint-placeholder-val="{{ true }}">

      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 40px">{{startTitle}}</span>
      <span style="font-size: 13px; color: #CACAE0; text-align: center; max-width: 480px; line-height: 1.5">{{startText}}</span>
      <button type="button" onClick="{{start}}" style="height: 54px; padding: 0 40px; border: 0; border-radius: 14px; background: #C8F031; color: #0B0B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 26px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 6px 0 #7FA012">EMPEZAR</button>
    </div>
  </sc-if>

    <div style="position: absolute; inset: 0; background: #0B0B14D9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #A3A3C2">{{startTitle}}</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: #C8F031">{{ptsLabel}} <span style="font-size: 26px; color: #A3A3C2">puntos</span></span>
      <span style="font-size: 14px; font-weight: 700">{{doneSub}}</span>
      <button type="button" onClick="{{doneAction}}" style="margin-top: 8px; height: 50px; padding: 0 30px; border: 0; border-radius: 14px; background: #C8F031; color: #0B0B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 5px 0 #7FA012">{{doneBtn}}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":null},"locked":{"editor":null},"onEnd":{"editor":null},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 0 };
    this.tick = this.tick.bind(this);
    this.canvasRef = (el) => { if (el && el !== this.cv) { this.cv = el; this.init3D(); } };
    this.mode = props.mode === 'rally' ? 'rally' : 'serve';
    this.best = { serve: 0, rally: 0 };
    this.reset();
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    if (this.R) { this.R.dispose(); this.R = null; }
  }
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  // court: singles 8.23 x 23.77 m, net at z = 0 (0.914 m in the middle), my half is z > 0
  reset() {
    this.st = this.loadSportStats('tenis');
    this.n = 0; this.pts = 0; this.good = 0;
    this.phase = 'start';
    this.newBall();
  }
  newBall() {
    this.result = null; this.swipe = null; this.pt = 0; this.swingT = null; this.bounces = 0; this.hit = false;
    const side = this.n % 2 === 0 ? 1 : -1;
    this.side = side;
    this.rec = { x: -side * 2.4, z: -12.4, react: 99, tried: false };
    if (this.mode === 'serve') {
      // the target box is crosscourt; the marked zone is the T or the wide corner of that box
      this.box = { x0: side > 0 ? -4.115 : 0, x1: side > 0 ? 0 : 4.115, z0: -6.4, z1: 0 };
      const wide = Math.random() < 0.5;
      this.zone = { x: side > 0 ? (wide ? -3.3 : -0.8) : (wide ? 3.3 : 0.8), z: -5.2, w: 1.6, d: 2.4 };
      this.me = { x: side * 0.9, z: 12.2 };
      this.b = { x: this.me.x + 0.35, y: 1.3, z: 12.0, vx: 0, vy: 0, vz: 0, spin: 0 };
      this.phase = this.phase === 'start' ? 'start' : 'toss';
    } else {
      this.box = { x0: -4.115, x1: 4.115, z0: -11.885, z1: 0 };
      this.zone = { x: [-2.8, 0, 2.8][Math.floor(Math.random() * 3)], z: -9.4, w: 2.4, d: 3.4 };
      this.me = { x: 0, z: 12.6 };
      this.rec = { x: 0, z: -12.6, react: 99, tried: false };
      this.feed = { x: (Math.random() - 0.5) * 3, z: -12.2 };
      this.b = { x: this.feed.x, y: 1.0, z: this.feed.z, vx: 0, vy: 0, vz: 0, spin: 0 };
      this.phase = this.phase === 'start' ? 'start' : 'feed';
    }
  }
  loop() {
    if (this.raf) return;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.tick);
  }
  tick(now) {
    const dt = Math.min(0.033, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    for (let i = 0; i < 5; i++) this.step(dt / 5);
    this.draw3D(dt);
    this.forceUpdate();
    this.raf = this.phase !== 'start' && this.phase !== 'done' ? requestAnimationFrame(this.tick) : null;
  }
  fly(b, dt) {
    const sp = Math.hypot(b.vx, b.vy, b.vz);
    b.vy -= 9.81 * dt;
    b.vx -= 0.012 * sp * b.vx * dt; b.vy -= 0.012 * sp * b.vy * dt; b.vz -= 0.012 * sp * b.vz * dt;
    b.vy -= (b.spin || 0) * 0.0018 * sp * sp * dt; // topspin dips the ball
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  }
  bounce(b) {
    b.y = 0.035; b.vy = Math.abs(b.vy) * 0.72; b.vx *= 0.82; b.vz *= 0.82;
    if (b.spin > 0) { b.vz *= 1.06; b.vy *= 0.9; }
  }
  solve(from, tx, tz, speed, spin) {
    // find the launch angle that lands on (tx, tz) and clears the net
    let best = null;
    for (let a = -0.25; a <= 0.6; a += 0.004) {
      const d = Math.hypot(tx - from.x, tz - from.z), ux = (tx - from.x) / d, uz = (tz - from.z) / d;
      const s = { x: from.x, y: from.y, z: from.z, vx: ux * Math.cos(a) * speed, vy: Math.sin(a) * speed, vz: uz * Math.cos(a) * speed, spin };
      let clear = true;
      for (let i = 0; i < 1500 && s.y > 0.035; i++) { const pz = s.z; this.fly(s, 1 / 240); if ((pz > 0) !== (s.z > 0) && s.y < 0.914 + 0.06 + Math.abs(s.x) * 0.02) clear = false; }
      const err = Math.hypot(s.x - tx, s.z - tz) + (clear ? 0 : 50);
      if (!best || err < best.err - 0.01) best = { err, vx: ux * Math.cos(a) * speed, vy: Math.sin(a) * speed, vz: uz * Math.cos(a) * speed };
    }
    return best;
  }
  launchTo(tx, tz, speed, spin, err) {
    const sol = this.solve(this.b, tx, tz, speed, spin);
    Object.assign(this.b, { vx: sol.vx + (Math.random() * 2 - 1) * err, vy: sol.vy + (Math.random() * 2 - 1) * err * 0.35, vz: sol.vz, spin });
    this.phase = 'flight'; this.pt = 0; this.bounces = 0; this.hit = true;
    this.rec.react = 0.3; this.rec.tried = false;
  }
  racket() {
    // the hitting point to the right of my player
    return { x: this.me.x + 0.75, y: 1.0, z: this.me.z - 0.2 };
  }
  step(dt) {
    this.pt += dt;
    const b = this.b;
    if (this.phase === 'toss') {
      if (this.pt < 0.05) { b.vy = 6.6; b.vx = 0; b.vz = -0.3; }
      this.fly(b, dt);
      if (b.y < 1.3 && b.vy < 0) { this.result = { kind: 'fallo', sub: 'No has golpeado el saque' }; this.finishBall(0); }
      return;
    }
    if (this.phase === 'feed') {
      // the ball machine sends a ball to my half; my player runs to meet it after the bounce
      if (this.pt < 0.02) {
        const tx = (Math.random() - 0.5) * 6, tz = 6 + Math.random() * 4;
        const sol = this.solve(b, tx, tz, 17 + Math.random() * 6, 0.6);
        Object.assign(b, { vx: sol.vx, vy: sol.vy, vz: sol.vz, spin: 0.6 });
        // predict where the ball will be at a comfortable height after the bounce
        const s = { ...b }; let bn = 0, aim = null;
        for (let i = 0; i < 2400; i++) { this.fly(s, 1 / 240); if (s.y <= 0.035) { this.bounce(s); bn++; } if (bn === 1 && s.vy < 0 && s.y < 1.05) { aim = { x: s.x, z: s.z }; break; } }
        this.aim = aim || { x: tx, z: tz + 3 };
      }
      this.fly(b, dt);
      if (b.y <= 0.035) { this.bounce(b); this.bounces++; }
      const v = 6.2 + 1.8 * this.tt('vel');
      const tx = this.aim.x - 0.75, tz = this.aim.z + 0.2, dx = tx - this.me.x, dz = tz - this.me.z, d = Math.hypot(dx, dz);
      if (d > 0.02) { const m = Math.min(d, v * dt); this.me.x += dx / d * m; this.me.z += dz / d * m; this.me.run = (this.me.run || 0) + m * 2.2; }
      if (this.bounces >= 2 || b.z > this.me.z + 1.4) { this.result = { kind: 'fallo', sub: this.swingT != null ? 'Golpe a destiempo' : 'No has devuelto la bola' }; this.finishBall(0); }
      return;
    }
    if (this.phase === 'flight' || this.phase === 'result') {
      const pz = b.z, py = b.y;
      this.fly(b, dt);
      // rival tries to get to the ball
      const r = this.rec;
      if (this.phase === 'flight') {
        r.react -= dt;
        if (r.react <= 0) {
          const s = { ...b }; let bn = 0;
          for (let i = 0; i < 900; i++) { this.fly(s, 1 / 240); if (s.y <= 0.035) { this.bounce(s); bn++; } if (bn === 1 && s.y < 1.0 && s.vy < 0) break; }
          const dx = s.x - r.x, dz = Math.max(-14, s.z) - r.z, d = Math.hypot(dx, dz);
          if (d > 0.05) { const v = Math.min(7, d * 6); r.x += dx / d * v * dt; r.z += dz / d * v * dt; }
        }
      }
      if (this.phase === 'flight' && pz > 0 && b.z <= 0) {
        const t = pz / ((pz - b.z) || 1e-6), cy = py + (b.y - py) * t;
        if (cy < 0.914 + 0.035 + Math.abs(b.x) * 0.02 && Math.abs(b.x) < 5.5) { b.z = 0.08; b.vz = Math.abs(b.vz) * 0.2; b.vx *= 0.3; this.result = { kind: 'red', sub: 'La bola se queda en la red' }; this.finishBall(0); return; }
      }
      if (this.phase === 'flight' && b.y <= 0.035) {
        if (this.bounces === 0) {
          const inBox = b.x >= this.box.x0 - 0.05 && b.x <= this.box.x1 + 0.05 && b.z >= this.box.z0 - 0.05 && b.z <= this.box.z1;
          if (!inBox) { this.result = { kind: 'fuera', sub: this.mode === 'serve' ? 'Falta: fuera del cuadro de saque' : 'Fuera de la pista' }; this.finishBall(0); this.bounce(b); return; }
          this.inZone = Math.abs(b.x - this.zone.x) < this.zone.w / 2 && Math.abs(b.z - this.zone.z) < this.zone.d / 2;
        }
        this.bounce(b); this.bounces++;
      }
      if (this.phase === 'flight' && this.bounces >= 1) {
        // the rival tries to return it when it reaches them; fast balls are harder
        if (!r.tried && Math.hypot(b.x - r.x, b.z - r.z) < 1.3 && b.y < 1.9) {
          r.tried = true;
          const sp = Math.hypot(b.vx, b.vy, b.vz), chance = (sp < 16 ? 0.65 : sp < 22 ? 0.42 : sp < 28 ? 0.24 : 0.1) * (this.inZone ? 0.6 : 1);
          if (Math.random() < chance) { b.vz = 10; b.vy = 4; b.vx = (Math.random() - 0.5) * 3; this.result = { kind: 'devuelta', sub: this.mode === 'serve' ? 'El rival resta tu saque' : 'El rival la devuelve · +1' }; this.finishBall(this.mode === 'rally' ? 1 : 0); return; }
        }
        if (this.bounces >= 2 || b.z < r.z - 1.2 || this.pt > 3) {
          const p = this.inZone ? 3 : 1;
          this.result = { kind: this.mode === 'serve' ? 'ace' : 'winner', sub: this.inZone ? '¡En la zona marcada! +' + p : '+' + p };
          this.finishBall(p);
        }
      }
      if (this.phase === 'result') {
        if (b.y <= 0.035) this.bounce(b);
        if (this.pt > 1.8) { this.n++; if (this.n >= 10) { this.phase = 'done'; this.best[this.mode] = Math.max(this.best[this.mode], this.pts); } else { this.newBall(); this.phase = this.mode === 'serve' ? 'toss' : 'feed'; } }
      }
      return;
    }
    if (this.phase === 'result') {
      this.fly(b, dt); if (b.y <= 0.035) this.bounce(b);
      if (this.pt > 1.8) { this.n++; if (this.n >= 10) { this.phase = 'done'; this.best[this.mode] = Math.max(this.best[this.mode], this.pts); } else { this.newBall(); this.phase = this.mode === 'serve' ? 'toss' : 'feed'; } }
    }
  }
  finishBall(p) {
    this.pts += p; if (p > 0) this.good++;
    this.phase = 'result'; this.pt = 0;
  }
  hitFromSwipe() {
    const pts = this.swipe; this.swipe = null;
    if (!pts || pts.length < 2 || !this.cam) return;
    const p0 = pts[0], p1 = pts[pts.length - 1];
    const len = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    if (len < 30 || p1.y > p0.y - 10) return;
    const dur = Math.max(0.06, (p1.t - p0.t) / 1000);
    const b = this.b, tgt = this.ground(p1.x, p1.y);
    if (!tgt) return;
    const flick = len / dur;
    if (this.mode === 'serve') {
      if (this.phase !== 'toss' || b.y < 2.2) return;
      const vmax = (150 + 70 * this.tt('saq')) / 3.6;
      const speed = Math.min(vmax, 22 + flick / 70);
      this.launchTo(tgt.x, Math.min(-0.5, tgt.z), speed, flick > 1500 ? 1 : 0.4, 0.5 * (1 - this.tt('pre')));
      this.swingT = 0;
    } else {
      if (this.phase !== 'feed' || this.bounces < 1) return;
      const rk = this.racket();
      const reach = 0.85 + 0.35 * this.tt('ref');
      this.swingT = 0;
      if (Math.hypot(b.x - rk.x, b.z - rk.z) > reach || b.y > 1.9 || b.y < 0.15) return;
      const speed = Math.min((100 + 60 * this.tt('gol')) / 3.6, 16 + flick / 90);
      this.launchTo(tgt.x, Math.min(-1, tgt.z), speed, 1.2, 0.6 * (1 - this.tt('pre')));
    }
  }
  ground(sx, sy) {
    const ndc = new THREE.Vector2(sx / 844 * 2 - 1, -(sy / 390 * 2 - 1));
    const rc = new THREE.Raycaster(); rc.setFromCamera(ndc, this.cam);
    const out = new THREE.Vector3();
    return rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), out) ? out : null;
  }

  mat(color, o) {
    const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.75, metalness: 0.02 }, o || {}));
    m.color = new THREE.Color(color).convertSRGBToLinear();
    if (o && o.emissive != null) m.emissive = new THREE.Color(o.emissive).convertSRGBToLinear();
    return m;
  }
  canvasTex(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  }
  pose(p, o) {
    const u = p.userData, run = o.run || 0, amp = o.amp || 0;
    u.legs[0].hip.rotation.x = Math.sin(run) * 0.7 * amp;
    u.legs[1].hip.rotation.x = -Math.sin(run) * 0.7 * amp;
    u.legs[0].knee.rotation.x = Math.max(0, -Math.sin(run)) * 0.9 * amp;
    u.legs[1].knee.rotation.x = Math.max(0, Math.sin(run)) * 0.9 * amp;
    u.arms[0].sho.rotation.x = -Math.sin(run) * 0.6 * amp;
    u.arms[1].sho.rotation.x = Math.sin(run) * 0.6 * amp;
    if (o.kick != null) {
      const k = o.kick;
      u.legs[1].hip.rotation.x = k < 0.6 ? 0.9 * (k / 0.6) : 0.9 - 2.2 * Math.min(1, (k - 0.6) / 0.25);
      u.legs[1].knee.rotation.x = k < 0.6 ? 1.3 * (k / 0.6) : 1.3 * (1 - Math.min(1, (k - 0.6) / 0.2));
      u.arms[0].sho.rotation.z = -0.9; u.arms[1].sho.rotation.z = 0.5;
    }
    if (o.armsUp != null) {
      const a = o.armsUp;
      u.arms[0].sho.rotation.z = -0.25 - 2.5 * a; u.arms[1].sho.rotation.z = 0.25 + 2.5 * a;
      u.arms[0].elb.rotation.z = 0; u.arms[1].elb.rotation.z = 0;
    }
    if (o.ready) {
      u.arms[0].sho.rotation.z = -0.75; u.arms[1].sho.rotation.z = 0.75;
      u.arms[0].sho.rotation.x = -0.3; u.arms[1].sho.rotation.x = -0.3;
      u.legs[0].hip.rotation.z = -0.15; u.legs[1].hip.rotation.z = 0.15;
      u.legs[0].knee.rotation.x = 0.35; u.legs[1].knee.rotation.x = 0.35;
      u.legs[0].hip.rotation.x = -0.25; u.legs[1].hip.rotation.x = -0.25;
    }
    if (o.hold) {
      u.arms[0].sho.rotation.x = -1.25; u.arms[1].sho.rotation.x = -1.25;
      u.arms[0].sho.rotation.z = 0.35; u.arms[1].sho.rotation.z = -0.35;

    for (let y = 0.1; y <= 1.0; y += 0.08) for (let x = -6.4; x < 6.4; x += 0.4) { const x2 = x + 0.4; if (y < hAt(x) && y < hAt(x2)) pts.push(x, y, 0, x2, y, 0); }
    const ng = new T.BufferGeometry(); ng.setAttribute('position', new T.Float32BufferAttribute(pts, 3));
    S.add(new T.LineSegments(ng, new T.LineBasicMaterial({ color: 0x0a0f1c, transparent: true, opacity: 0.8 })));
    const tape = []; for (let x = -6.4; x <= 6.401; x += 0.2) tape.push(new T.Vector3(x, hAt(x), 0));
    S.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(tape), 64, 0.03, 6), this.mat(0xf4f4f6)));
    [-6.4, 6.4].forEach((x) => { const p = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 1.1, 12), this.mat(0x1f2937, { metalness: 0.4, roughness: 0.4 })); p.position.set(x, 0.55, 0); p.castShadow = true; S.add(p); });
    const colors = [0xf2f5fa, 0xf2f5fa, 0xc8f031, 0x3ea6ff, 0xe5484d, 0x27335e, 0x1c2540];
    this.fans = [this.addCrowd(S, -10, 0, 40, 10, -Math.PI / 2, colors), this.addCrowd(S, 10, 0, 40, 10, Math.PI / 2, colors), this.addCrowd(S, 0, -20, 22, 10, Math.PI, colors)];
    const jt = this.canvasTex(512, 128, (c, w, h) => { c.fillStyle = '#0B0B14'; c.fillRect(0, 0, w, h); c.fillStyle = '#C8F031'; c.font = 'italic 800 80px Barlow Condensed, Arial'; c.textAlign = 'center'; c.fillText('ARENA MIX', w / 2, 95); });
    const ad = new T.Mesh(new T.BoxGeometry(16, 0.9, 0.12), new T.MeshStandardMaterial({ map: jt, emissive: 0xffffff, emissiveMap: jt, emissiveIntensity: 0.8 })); ad.position.set(0, 0.45, -16.5); S.add(ad);
    // target zone and service box highlight
    this.boxMesh = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, depthWrite: false }));
    this.boxMesh.rotation.x = -Math.PI / 2; S.add(this.boxMesh);
    this.zoneMesh = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshBasicMaterial({ color: 0xc8f031, transparent: true, opacity: 0.55, depthWrite: false }));
    this.zoneMesh.rotation.x = -Math.PI / 2; S.add(this.zoneMesh);
    // felt tennis ball with its white seam
    const bt = this.canvasTex(256, 128, (c, w, h) => {
      c.fillStyle = '#D4F33A'; c.fillRect(0, 0, w, h);
      for (let i = 0; i < 1600; i++) { c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(90,110,0,0.12)'; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
      c.strokeStyle = '#F4F4EE'; c.lineWidth = 5; c.beginPath();
      for (let x = 0; x <= w; x += 2) { const y = h / 2 + Math.sin(x / w * Math.PI * 4) * h * 0.28; x ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
    });
    this.ball = new T.Mesh(new T.SphereGeometry(0.06, 20, 14), new T.MeshStandardMaterial({ map: bt, roughness: 0.85 }));
    this.ball.castShadow = true; S.add(this.ball);
    // players with rackets
    const kit = (shirt, shorts, hair, you) => this.makePlayer({ you, sport: 'tenis', shirt, shorts, socks: 0xf2f5fa, trimCss: '#0B0B14', boot: 0xf2f5fa, hair });
    this.player = kit(0xf4f4f6, 0x1e3a8a, undefined, true); S.add(this.player);
    this.rival = kit(0xe5484d, 0xf4f4f6, 0x141b2d); S.add(this.rival);
    [this.player, this.rival].forEach((p) => p.userData.arms[1].elb.add(this.makeRacket()));
    this.machine = new T.Group();
    const mb = new T.Mesh(new T.BoxGeometry(0.7, 0.8, 0.7), this.mat(0x334155, { roughness: 0.5 })); mb.position.y = 0.4; this.machine.add(mb);
    const mt = new T.Mesh(new T.CylinderGeometry(0.1, 0.12, 0.5, 12), this.mat(0x111827)); mt.rotation.x = Math.PI / 2; mt.position.set(0, 0.9, 0.3); this.machine.add(mt);
    S.add(this.machine);
  }
  makeRacket() {
    const T = THREE, g = new T.Group();
    const frame = this.mat(0x111827, { roughness: 0.35, metalness: 0.2 }), grip = this.mat(0xf4f4f6, { roughness: 0.8 });
    const handle = new T.Mesh(new T.CylinderGeometry(0.016, 0.018, 0.22, 10), grip); handle.position.y = -0.1; g.add(handle);
    const throat = new T.Mesh(new T.CylinderGeometry(0.012, 0.012, 0.16, 8), frame); throat.position.y = -0.27; g.add(throat);
    const head = new T.Mesh(new T.TorusGeometry(0.13, 0.011, 8, 32), frame); head.scale.set(0.8, 1.1, 1); head.position.y = -0.48; g.add(head);
    const strings = new T.Mesh(new T.CircleGeometry(0.128, 24), new T.MeshBasicMaterial({ color: 0xd9d9d9, transparent: true, opacity: 0.35, side: T.DoubleSide })); strings.scale.set(0.8, 1.1, 1); strings.position.y = -0.48; g.add(strings);
    g.position.set(0, -0.27, 0.02); g.rotation.x = -0.4;
    return g;
  }
  draw3D(dt) {
    if (!this.R || !this.S) return;
    const T = THREE, b = this.b, me = this.me;
    this.ball.position.set(b.x, Math.max(0.06, b.y), b.z);
    this.ball.rotation.x -= (b.spin || 0.3) * 20 * (dt || 0);
    const bx = this.box, z = this.zone;
    this.boxMesh.position.set((bx.x0 + bx.x1) / 2, 0.012, (bx.z0 + bx.z1) / 2); this.boxMesh.scale.set(bx.x1 - bx.x0, bx.z1 - bx.z0, 1);
    this.zoneMesh.position.set(z.x, 0.014, z.z); this.zoneMesh.scale.set(z.w, z.d, 1);
    // me
    this.player.position.set(me.x, 0, me.z);
    this.player.rotation.y = Math.PI;
    if (this.swingT != null) this.swingT += dt || 0;
    const swinging = this.swingT != null && this.swingT < 0.3;
    const running = this.mode === 'rally' && this.phase === 'feed';
    this.pose(this.player, this.mode === 'serve' ? (this.phase === 'toss' || swinging ? { armsUp: 1 } : { ready: true }) : running ? { run: me.run || 0, amp: 1 } : { ready: true });
    const arm = this.player.userData.arms[1];
    if (this.mode === 'serve' && swinging) arm.sho.rotation.x = -2.8 + this.swingT * 11;
    else if (this.mode === 'rally') { const k = swinging ? Math.min(1, this.swingT / 0.25) : 0; arm.sho.rotation.set(-0.5, 0, 1.1 - 2.0 * k); this.player.userData.body.rotation.y = (swinging ? -0.9 + 1.8 * k : 0.6); }
    // rival
    const r = this.rec;
    this.rival.position.set(r.x, 0, r.z); this.rival.rotation.y = 0; this.pose(this.rival, { ready: true });
    this.rival.visible = this.mode === 'serve' || this.phase === 'flight' || this.phase === 'result';
    this.machine.visible = this.mode === 'rally';
    if (this.feed) this.machine.position.set(this.feed.x, 0, this.feed.z - 0.6);
    // camera behind my baseline
    const want = new T.Vector3(me.x * 0.5, 4.2, me.z + 7);
    const look = new T.Vector3(me.x * 0.3, 0.8, -6);
    if (this.phase === 'flight' || this.phase === 'result') look.lerp(new T.Vector3(b.x, 0.5, Math.min(0, b.z)), 0.3);
    const f = 1 - Math.exp(-4 * (dt || 1));
    this.camPos.lerp(want, f); this.camLook.lerp(look, f);
    this.cam.position.copy(this.camPos); this.cam.lookAt(this.camLook);
    if (this.fans) this.fans.forEach((fn) => { fn.position.y = this.result && ['ace', 'winner'].includes(this.result.kind) ? Math.abs(Math.sin(this.pt * 12)) * 0.2 : 0; });
    this.R.render(this.S, this.cam);
  }
  renderVals() {
    const R = this.result;
    const map = { ace: ['¡ACE!', '#C8F031'], winner: ['¡GANADOR!', '#C8F031'], fuera: ['FUERA', '#FF8A8E'], red: ['RED', '#FF8A8E'], devuelta: ['DEVUELTA', '#FFC53D'], fallo: ['FALLO', '#FF8A8E'] };
    const rm = R ? map[R.kind] : ['', '#fff'];
    const rs = Math.min(1, this.pt / 0.25);
    const tab = (on) => 'height: 36px; padding: 0 14px; border: 0; border-radius: 10px; font: 800 13px Manrope, sans-serif; cursor: pointer; ' + (on ? 'background: #C8F031; color: #0B0B14;' : 'background: transparent; color: #CACAE0;');
    const setMode = (m) => { this.mode = m; this.reset(); this.forceUpdate(); if (this.R) this.draw3D(0); };
    const serve = this.mode === 'serve';
    return {
      canvasRef: this.canvasRef, no3d: !!this.no3d,
      swipePts: this.swipe ? this.swipe.map((q) => q.x.toFixed(1) + ',' + q.y.toFixed(1)).join(' ') : '',
      serveTab: tab(serve), rallyTab: tab(!serve),
      setServe: () => setMode('serve'), setRally: () => setMode('rally'),
      ballLabel: Math.min(this.n + 1, 10) + '/10', ptsLabel: String(this.pts),
      zoneLabel: serve ? 'Saque: cuando la bola esté arriba, desliza hacia el cuadro de saque' : 'Peloteo: cuando la bola llegue a tu raqueta, desliza hacia la pista rival',
      showHint: this.phase === 'toss' || this.phase === 'feed',
      hintText: serve ? 'Cuando la bola esté arriba, desliza hacia el cuadro iluminado · más rápido = saque más fuerte' : 'Tu jugador corre solo: cuando la bola bote y llegue a tu raqueta, desliza hacia la pista rival',
      showResult: this.phase === 'result' && !!R,
      resultText: rm[0], resultSub: R ? R.sub : '',
      resultStyle: 'font-family: \'Barlow Condensed\', sans-serif; font-weight: 800; font-style: italic; font-size: 68px; line-height: 1; letter-spacing: 2px; color: ' + rm[1] + '; text-shadow: 0 5px 0 #0B0B14; transform: scale(' + (0.4 + rs * 0.6).toFixed(2) + ');',
      showStart: this.phase === 'start', showDone: this.phase === 'done',
      tabsStyle: this.props.locked ? 'display: none;' : 'display: flex; padding: 4px; gap: 4px; border-radius: 14px; background: #0B0B14CC',
      doneBtn: this.props.onEnd ? 'CONTINUAR' : 'OTRA RONDA',
      doneAction: () => { if (this.props.onEnd) { this.props.onEnd(this.pts); return; } this.reset(); this.newBall(); this.phase = serve ? 'toss' : 'feed'; this.pt = 0; this.loop(); this.forceUpdate(); },
      startTitle: serve ? 'DESAFÍO DE SAQUE' : 'DESAFÍO DE PELOTEO',
      startText: serve ? '10 saques, alternando lados. 1 punto si entra en el cuadro de saque, 3 si cae en la zona marcada. El rival intentará restar: los saques rápidos son más difíciles de devolver.' : '10 bolas de la máquina. Tu jugador corre solo hacia la bola: cuando bote y llegue a tu raqueta, desliza hacia la pista rival. 1 punto si entra, 3 en la zona marcada.',
      doneSub: this.good + ' de 10 con éxito · récord ' + this.best[this.mode],
      start: () => { if (this.phase === 'done') this.reset(); this.newBall(); this.phase = serve ? 'toss' : 'feed'; this.pt = 0; this.loop(); this.forceUpdate(); },
      pDown: (e) => {
        if (!(this.phase === 'toss' || this.phase === 'feed')) return;
        e.preventDefault();
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
        this.swipe = [this.local(e)];
      },
      pMove: (e) => {
        if (!this.swipe) return;
        const q = this.local(e), l = this.swipe[this.swipe.length - 1];
        if (Math.hypot(q.x - l.x, q.y - l.y) > 4 && this.swipe.length < 60) this.swipe.push(q);
      },
      pUp: (e) => { if (this.swipe) { this.swipe.push(this.local(e)); this.hitFromSwipe(); this.forceUpdate(); } },
      pCancel: () => { this.swipe = null; }
    };
  }
}
</script>
