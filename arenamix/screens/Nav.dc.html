<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes nvEdge{to{background-position:0 200%}}
@keyframes nvGlow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes nvSpin{to{rotate:360deg}}
.nv-item{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:64px;height:56px;border-radius:16px;text-decoration:none;font:800 10px Exo2,sans-serif;letter-spacing:.3px;transition:color .3s,translate .25s}
.nv-dot{position:absolute;right:6px;top:3px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:#FF3B5C;color:#FFFFFF;font:800 10.5px Exo2,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #0B0B14,0 0 10px #FF3B5C;animation:nvDot 1.6s ease-in-out infinite;z-index:2}
@keyframes nvDot{0%,100%{scale:1}50%{scale:1.18}}
.nv-item .ic{display:flex;transition:scale .35s cubic-bezier(.3,1.8,.5,1),filter .3s}
.nv-item[aria-current="page"] .ic{scale:1.14;filter:drop-shadow(0 2px 0 #0006)}
.nv-item:not([aria-current="page"]):hover{background:#ffffff0a}
.nv-item:not([aria-current="page"]):active{translate:0 2px}
</style>
</helmet>
<nav aria-label="Principal" style="position: relative; width: 80px; height: 390px; box-sizing: border-box; padding: 10px 8px; overflow: hidden; background: linear-gradient(180deg, #17173A 0%, #0E0E22 55%, #09090F 100%); display: flex; flex-direction: column; align-items: center">
  <span aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(135deg, #ffffff06 0 2px, transparent 2px 12px); pointer-events: none"></span>
  <span aria-hidden="true" style="position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, #22D3EE, #7C5CFF, #FFC53D, #22D3EE) 0 0 / 100% 200%; animation: nvEdge 6s linear infinite; pointer-events: none"></span>
  <a href="Deportes.dc.html" aria-label="ARENA MIX, inicio" style="position: relative; z-index: 1; display: block; width: 44px; height: 44px; margin-bottom: 8px">
    <span aria-hidden="true" style="position: absolute; inset: -4px; border-radius: 18px; background: conic-gradient(from 0deg, #22D3EE, #7C5CFF, #FFC53D, #22D3EE); animation: nvSpin 5s linear infinite; filter: blur(5px); opacity: .55"></span>
    <svg width="44" height="44" viewBox="0 0 512 512" style="position: relative; display: block"><rect width="512" height="512" rx="112" fill="#0B0B14" stroke="#2E2E58" stroke-width="10"/><text x="256" y="350" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-style="italic" font-size="270" letter-spacing="-6"><tspan fill="#F4F4FA">A</tspan><tspan fill="#22D3EE" dx="90">M</tspan></text><path d="M262 120L222 238h38l-26 104l80-140h-42l30-82z" fill="#FFC53D" stroke="#0B0B14" stroke-width="10" stroke-linejoin="round"/></svg>
  </a>
  <!-- the active tab's tile glides from the tab you came from -->
  <span aria-hidden="true" style="{{pillStyle}}"><span style="{{barStyle}}"></span></span>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <a href="Deportes.dc.html" class="nv-item" aria-current="{{cur0}}" style="{{s0}}">
      <span class="ic"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="{{c0}}"/><circle cx="14" cy="14" r="12" fill="url(#nvShine)" opacity=".45"/><path d="M11 8.5l9 5.5l-9 5.5z" fill="#0B0B14"/><defs><radialGradient id="nvShine" cx=".3" cy=".25" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs></svg></span>Jugar
    <sc-if value="{{b0on}}" hint-placeholder-val="{{ false }}"><span class="nv-dot">{{b0}}</span></sc-if></a>
    <a href="Taquilla.dc.html" class="nv-item" aria-current="{{cur1}}" style="{{s1}}">
      <span class="ic"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M9 3L3 6.5l2.4 5.6l3.2-1.2V25h10.8V10.9l3.2 1.2L25 6.5L19 3a5 5 0 0 1-10 0z" fill="{{c1}}" stroke="#0B0B14" stroke-opacity=".35" stroke-width="1"/><path d="M9 3a5 5 0 0 0 10 0" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/><text x="14" y="21" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="9.5" fill="#0B0B14">10</text></svg></span>Taquilla
    <sc-if value="{{b1on}}" hint-placeholder-val="{{ false }}"><span class="nv-dot">{{b1}}</span></sc-if></a>
    <a href="Tienda.dc.html" class="nv-item" aria-current="{{cur2}}" style="{{s2}}">
      <span class="ic"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M5 9h18l-1.4 16H6.4z" fill="{{c2}}" stroke="#0B0B14" stroke-opacity=".35" stroke-width="1"/><path d="M9.5 9a4.5 4.5 0 0 1 9 0" fill="none" stroke="{{c2}}" stroke-width="2.4"/><circle cx="14" cy="17" r="4" fill="#0B0B14" fill-opacity=".25"/><circle cx="14" cy="16.4" r="3.6" fill="#FFF3C4"/><path d="M14 14.3v4.2" stroke="#B7791F" stroke-width="1.4"/></svg></span>Tienda
    <sc-if value="{{b2on}}" hint-placeholder-val="{{ false }}"><span class="nv-dot">{{b2}}</span></sc-if></a>
    <a href="Estadisticas.dc.html" class="nv-item" aria-current="{{cur3}}" style="{{s3}}">
      <span class="ic"><span style="{{faceRing}}"><img src="{{face}}" alt="" style="{{faceImg}}"><svg width="18" height="18" viewBox="0 0 24 24" style="{{faceFallback}}"><circle cx="12" cy="8" r="4.5" fill="#0B0B14"/><path d="M3.5 22a8.5 8.5 0 0 1 17 0z" fill="#0B0B14"/></svg></span></span>Perfil
    <sc-if value="{{b3on}}" hint-placeholder-val="{{ false }}"><span class="nv-dot">{{b3}}</span></sc-if></a>
  </div>
  <a href="Tienda.dc.html" aria-label="{{coinsAria}}" style="position: relative; z-index: 1; margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 4px; width: 64px; height: 30px; box-sizing: border-box; border-radius: 12px; background: #FFC53D14; border: 1px solid #FFC53D55; color: #FFE38A; text-decoration: none; font: 800 11px Exo2, sans-serif">
    <svg class="am-coin" width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC53D"/><circle cx="12" cy="12" r="7" fill="none" stroke="#B7791F" stroke-width="1.5"/><path d="M12 8v8" stroke="#B7791F" stroke-width="1.8"/></svg>{{coins}}
  </a>
  <a href="Ajustes.dc.html" aria-label="Ajustes" style="position: relative; z-index: 1; margin-top: 6px; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 16px; background: #ffffff0a; border: 1px solid #2E2E58; color: #A3A3C2">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3a1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8a1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["jugar","taquilla","tienda","perfil"],"default":"jugar"},"$preview":{"width":80,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const cur = this.idx();
    // start on the tab you came from, then glide to this one
    const last = window.__amNavLast;
    this.state = { pos: last == null ? cur : last };
    window.__amNavLast = cur;
  }
  idx() { return Math.max(0, ['jugar', 'taquilla', 'tienda', 'perfil'].indexOf(this.props.active || 'jugar')); }
  componentDidMount() {
    if (this.state.pos !== this.idx()) this.t = setTimeout(() => this.setState({ pos: this.idx() }), 40);
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const cur = this.idx(), pos = this.state.pos;
    const COL = ['#22D3EE', '#FF8A3D', '#FFC53D', '#A78BFA'], DEEP = ['#0E8FA3', '#C2410C', '#B7791F', '#6D28D9'];
    let coins = 2450;
    try { const w = JSON.parse(localStorage.getItem('arenamix.wallet.v1') || 'null'); if (w && w.coins != null) coins = w.coins; } catch (e) {}
    const A = window.AMChars, pref = A ? A.pref() : 'clasico', face = pref !== 'clasico' ? 'assets/chars/' + pref + '.png' : '';
    const item = (i) => 'color: ' + (i === cur ? '#0B0B14' : '#B4B4D0') + ';';
    const v = {
      pillStyle: 'position: absolute; z-index: 0; left: 8px; top: ' + (62 + pos * 62) + 'px; width: 64px; height: 56px; border-radius: 16px; background: linear-gradient(160deg, ' + COL[pos] + 'EE, ' + COL[pos] + ' 55%, ' + DEEP[pos] + '); box-shadow: 0 0 18px ' + COL[pos] + '88, inset 0 1px 0 #ffffffaa, 0 4px 0 ' + DEEP[pos] + '; transition: top .5s cubic-bezier(.3,1.35,.45,1), background .4s, box-shadow .4s;',
      barStyle: 'position: absolute; left: -8px; top: 12px; width: 4px; height: 32px; border-radius: 0 3px 3px 0; background: ' + COL[pos] + '; box-shadow: 0 0 10px ' + COL[pos] + '; animation: nvGlow 1.6s ease-in-out infinite;',
      coins: coins >= 100000 ? Math.round(coins / 1000) + 'k' : String(coins).replace(/\B(?=(\d{3})+(?!\d))/g, '.'),
      coinsAria: coins.toLocaleString('es-ES') + ' VCD. Ir a la tienda',
      face, faceImg: face ? 'width: 100%; height: 100%; object-fit: cover; display: block;' : 'display: none;',
      faceFallback: face ? 'display: none;' : 'display: block; margin: 4px;',
      faceRing: 'display: block; width: 26px; height: 26px; border-radius: 13px; overflow: hidden; background: ' + COL[3] + '; box-shadow: 0 0 0 2px ' + (cur === 3 ? '#0B0B14' : COL[3]) + ';'
    };
    for (let i = 0; i < 4; i++) {
      v['cur' + i] = i === cur ? 'page' : 'false';
      v['s' + i] = item(i);
      v['c' + i] = i === cur ? '#0B0B14' : COL[i];
    }
    // red badges: something waiting to be collected in that section
    const PR = window.AMProgress, pend = PR && PR.pending ? PR.pending() : { week: 0, pass: 0, missions: 0 };
    let ach = 0, pm = 0;
    try {
      const R = JSON.parse(localStorage.getItem('arenamix.record.v1') || '{}') || {}, all = R.all || {}, cl = JSON.parse(localStorage.getItem('arenamix.ach.v1') || '{}') || {};
      ach = [['p1', 'played', 1], ['p10', 'played', 10], ['p50', 'played', 50], ['w1', 'won', 1], ['w10', 'won', 10], ['g10', 'gf', 10], ['g50', 'gf', 50], ['s3', 'best', 3], ['s5', 'best', 5], ['c5', 'clean', 5]].filter(([id, k, n]) => (all[k] || 0) >= n && !cl[id]).length;
      const st = JSON.parse(localStorage.getItem('arenamix.stats.v2') || 'null');
      pm = st && st.futbol ? st.futbol.pm || 0 : 36;
    } catch (e) {}
    const badge = [pend.missions + ach, 0, pend.week + pend.pass, pm > 0 ? '!' : 0];
    badge.forEach((n, i) => { v['b' + i + 'on'] = !!n; v['b' + i] = String(n); });
    // the active icon turns dark on its coloured tile; the others keep their colour
    v.c0 = cur === 0 ? '#F4F4FA' : COL[0]; v.c1 = cur === 1 ? '#F4F4FA' : COL[1]; v.c2 = cur === 2 ? '#FFF3C4' : COL[2];
    return v;
  }
}
</script>
</body>
</html>
