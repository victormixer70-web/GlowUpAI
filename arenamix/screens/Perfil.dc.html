<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perfil</title>
<script src="./support.js"></script>
<script src="/_blob/de0c1b42c380e04fabb186f97a299f57"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
.pf-av{position:relative;flex:none;width:84px;height:84px;padding:0;border-radius:50%;overflow:hidden;border:3px solid #FFFFFF;background:#331C58;box-shadow:0 0 0 3px #22D3EE,0 0 20px #22D3EE;cursor:pointer}
.pf-edit{position:absolute;right:8px;bottom:8px;width:22px;height:22px;border-radius:11px;background:#22D3EE;color:#150925;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.pf-title{display:flex;align-items:center;gap:4px;height:20px;padding:0 9px;border:0;border-radius:10px;background:linear-gradient(90deg,#FDE68A,#F59E0B);color:#2A1400;font:800 10px Exo2,sans-serif;letter-spacing:.8px;cursor:pointer;box-shadow:0 0 10px #F59E0B88}
.pf-tro{display:flex;gap:6px}
.pf-tro span{display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:9px;background:#1A0B3ACC;font:800 11px Exo2,sans-serif;color:#fff}
.pf-tro span.off{opacity:.4;filter:grayscale(1)}

</style>
</helmet>
<div class="bc-stage" style="position: relative; width: 844px; height: 390px; overflow: hidden;  isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif; display: flex; gap: 14px; padding: 12px 14px; box-sizing: border-box">
  <div class="am-bg under"></div>
  <div class="bc-beams" style="z-index: -1"></div>
  <div style="flex: none; width: 250px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Deportes.dc.html" aria-label="Volver" class="bc-para" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 38px; background: #251443; color: #F4F4FA"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
      <span class="bc-title hd" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 28px; letter-spacing: 2px">PERFIL</span>
    </div>
    <div style="flex: 1; min-height: 0; border-radius: 18px; background: radial-gradient(60% 45% at 50% 28%, #1E8BFF66, transparent 70%), linear-gradient(180deg, #06102E99 0%, #02040CF0 75%), url(assets/bg_tribuna.jpg) center 30%/cover; box-shadow: inset 0 0 0 1.5px #3DA9FF88, inset 0 1px 0 #ffffff33, 0 10px 24px #0008, 0 0 22px #0A6CFF44; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px">
      <button type="button" onClick="{{nextPic}}" aria-label="Cambiar foto de perfil" class="pf-av"><img src="{{pic}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"><span class="pf-edit"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg></span></button>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1" translate="no">{{myName}}</span>
      <button type="button" onClick="{{nextTitle}}" class="pf-title" aria-label="Cambiar título: {{title}}">{{title}}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 10l5 5l5-5"/></svg></button>
      <span style="font-size: 12px; font-weight: 700; color: #E0E7FF">Nv. {{myLv}} · {{bestRank}}</span>
      <div class="pf-tro" aria-label="Vitrina de trofeos"><sc-for list="{{trophies}}" as="tr" hint-placeholder-count="3"><span class="{{tr.cls}}" title="{{tr.name}}"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 3h10v5a5 5 0 0 1-10 0zM7 5H4a3 3 0 0 0 3.5 4M17 5h3a3 3 0 0 1-3.5 4M10 14h4v3h3v3H7v-3h3z" fill="{{tr.c}}"/></svg><b>{{tr.n}}</b></span></sc-for></div>
      <span style="display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 10px; background: #1A0B3ACC; border: 1px solid #FFC53D88; font-weight: 800; font-size: 14px; color: #FFC53D"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC53D"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#B8860B" stroke-width="2"/></svg>{{coins}} VCD</span>
    </div>
    <a href="Logros.dc.html" class="am-shine am-pulse-gold" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #FDE68A, #FBBF24 45%, #F97316); color: #150925; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 24px; letter-spacing: 2px; box-shadow: 0 5px 0 #B8860B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#150925"><path d="M7 3h10v3h3v2a5 5 0 0 1-5 5h-.3A5 5 0 0 1 13 15v2h3v3H8v-3h3v-2a5 5 0 0 1-1.7-2H9a5 5 0 0 1-5-5V6h3zM6 8a3 3 0 0 0 1.5 2.6A7 7 0 0 1 7 8zm12 0h-1a7 7 0 0 1-.5 2.6A3 3 0 0 0 18 8z"/></svg>
      LOGROS
      <sc-if value="{{hasBadge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: -6px; top: -8px; min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: #FF5C5C; color: #FFFFFF; font: 800 13px Exo2, sans-serif; display: flex; align-items: center; justify-content: center; font-style: normal; letter-spacing: 0">{{badge}}</span></sc-if>
    </a>
    <div style="display: flex; gap: 6px">
      <a href="Taquilla.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 36px; border-radius: 12px; background: linear-gradient(180deg, #0B1A44, #050C24); border: 0; box-shadow: inset 0 0 0 1.5px #22D3EE99, inset 0 -3px 0 #22D3EE, 0 4px 10px #0007; color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 12px">Taquilla</a>
      <a href="MiEstadio.dc.html" style="flex: 1.1; display: flex; align-items: center; justify-content: center; gap: 5px; height: 36px; border-radius: 12px; background: linear-gradient(180deg, #0B1A44, #050C24); border: 0; box-shadow: inset 0 0 0 1.5px #53D88E99, inset 0 -3px 0 #53D88E, 0 4px 10px #0007; color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 12px; white-space: nowrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 20h18M5 20V10l7-5l7 5v10M9 20v-5h6v5"/></svg>Mi estadio</a>
      <a href="Ajustes.dc.html" style="flex: 1.3; display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border-radius: 12px; background: linear-gradient(180deg, #0B1A44, #050C24); border: 0; box-shadow: inset 0 0 0 1.5px #A78BFA99, inset 0 -3px 0 #A78BFA, 0 4px 10px #0007; color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Configuración</a>
    </div>
  </div>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
    <div role="tablist" style="position: relative; display: flex; padding: 4px; border-radius: 16px; background: linear-gradient(90deg, #06102EE6, #0A1A4AE6); border: 1px solid #3DA9FF66; box-shadow: 0 6px 16px #0006">
      <span style="{{thumb}}"></span>
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
    </div>
    <div key="{{sportKey}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{tiles}}" as="s" hint-placeholder-count="9">
        <div style="{{s.box}}">
          <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 1.5px; color: {{s.glow}}">{{s.label}}</span>
          <span style="font-family: 'Titulos', sans-serif; font-size: 30px; line-height: 1; color: {{s.color}}; text-shadow: 0 2px 0 #0008, 0 0 16px {{s.glow}}88">{{s.value}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #A3A3C2"><span>VICTORIAS · EMPATES · DERROTAS</span><span>{{totalLabel}}</span></div>
      <div style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: linear-gradient(90deg, #0B1A44, #06102E); box-shadow: inset 0 0 0 1px #3DA9FF44, inset 0 1px 3px #0009"><div style="{{barW}}"></div><div style="{{barD}}"></div><div style="{{barL}}"></div></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sport: 'all' };
  }
  store(key, def) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? def : v; } catch (e) { return def; } }
  achievements() {
    // goals for the Logros screen: progress comes from the saved match record and the ranks
    const R = this.store('arenamix.record.v1', {}), all = R.all || {}, mmr = this.store('arenamix.mmr.v1', {});
    const top = Object.keys(mmr).reduce((m, k) => Math.max(m, mmr[k] || 0), 0);
    const sports = ['futbol', 'baloncesto', 'tenis', 'voley'].filter((s) => R[s] && R[s].played > 0).length;
    const g = (k) => all[k] || 0;
    const A = (id, icon, title, desc, cur, goal, reward) => ({ id, icon, title, desc, cur: Math.min(cur, goal), goal, reward });
    return [
      A('p1', 'ball', 'Primer partido', 'Juega tu primer partido', g('played'), 1, 50),
      A('p10', 'ball', 'Calentando motores', 'Juega 10 partidos', g('played'), 10, 100),
      A('p50', 'ball', 'Habitual del estadio', 'Juega 50 partidos', g('played'), 50, 300),
      A('p100', 'ball', 'Centenario', 'Juega 100 partidos', g('played'), 100, 600),
      A('p250', 'ball', 'Leyenda de la arena', 'Juega 250 partidos', g('played'), 250, 1500),
      A('w1', 'trophy', 'Primera victoria', 'Gana un partido', g('won'), 1, 50),
      A('w10', 'trophy', 'Ganador', 'Gana 10 partidos', g('won'), 10, 150),
      A('w50', 'trophy', 'Campeón de barrio', 'Gana 50 partidos', g('won'), 50, 500),
      A('w100', 'trophy', 'Máquina de ganar', 'Gana 100 partidos', g('won'), 100, 1000),
      A('g10', 'goal', 'Goleador', 'Marca 10 goles', g('gf'), 10, 100),
      A('g50', 'goal', 'Pichichi', 'Marca 50 goles', g('gf'), 50, 300),
      A('g200', 'goal', 'Bota de oro', 'Marca 200 goles', g('gf'), 200, 800),
      A('s3', 'fire', 'En racha', 'Gana 3 partidos seguidos', g('best'), 3, 150),
      A('s5', 'fire', 'Intratable', 'Gana 5 partidos seguidos', g('best'), 5, 300),
      A('s10', 'fire', 'Imparable', 'Gana 10 partidos seguidos', g('best'), 10, 800),
      A('c5', 'shield', 'Muro', 'Deja la portería a cero 5 veces', g('clean'), 5, 200),
      A('sp4', 'multi', 'Multideporte', 'Juega a los 4 deportes', sports, 4, 200),
      A('r1', 'rank', 'Oro', 'Llega a Oro en cualquier modo', top >= 750 ? 1 : 0, 1, 300),
      A('r2', 'rank', 'Diamante', 'Llega a Diamante en cualquier modo', top >= 2100 ? 1 : 0, 1, 800),
      A('r3', 'rank', 'Campeón', 'Llega a Campeón en cualquier modo', top >= 3075 ? 1 : 0, 1, 1500)
    ];
  }
  // profile picture, title and trophy cabinet
  extrasVals() {
    const PICS = ['ty', 'vegas', 'granny', 'remy', 'leo', 'nico', 'dani'];
    const A = window.AMChars, me = A && A.pref() !== 'clasico' ? A.pref() : 'dani';
    const pic = this.store('arenamix.avatar.v1', me);
    const R = this.store('arenamix.record.v1', {}), all = R.all || {}, C = this.store('arenamix.career.v1', {}) || {}, T = this.store('arenamix.trophies.v1', { copa: 0, liga: 0 }) || {};
    const TITLES = [['Novato', true], ['Goleador', (all.gf || 0) >= 10], ['Rey del regate', (C.skills || 0) >= 50], ['Muro defensivo', (all.clean || 0) >= 5], ['Imparable', (all.best || 0) >= 5], ['Veterano', (all.played || 0) >= 50], ['Campeón de Copa', (T.copa || 0) > 0], ['Rey de la Liga', (T.liga || 0) > 0], ['Hat-trick', (C.hats || 0) > 0]];
    const open = TITLES.filter((t) => t[1]).map((t) => t[0]);
    const cur = open.indexOf(this.store('arenamix.title.v1', 'Novato')) >= 0 ? this.store('arenamix.title.v1', 'Novato') : 'Novato';
    const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} this.forceUpdate(); };
    const tro = [['Copa Arena', T.copa || 0, '#FBBF24'], ['Liga Arena', T.liga || 0, '#C084FC'], ['Retos', (this.store('arenamix.retos.v1', {}) || {}).done ? ((this.store('arenamix.retos.v1', {}) || {}).done.length) : 0, '#22D3EE']];
    return {
      pic: 'assets/chars/' + (PICS.indexOf(pic) >= 0 ? pic : me) + '.png',
      nextPic: () => put('arenamix.avatar.v1', PICS[(PICS.indexOf(pic) + 1) % PICS.length]),
      title: cur.toUpperCase(), nextTitle: () => put('arenamix.title.v1', open[(open.indexOf(cur) + 1) % open.length]),
      trophies: tro.map(([name, n, c]) => ({ name: name + ': ' + n, n: String(n), c, cls: n ? '' : 'off' }))
    };
  }
  claimed() { return this.store('arenamix.ach.v1', {}); }
  coins() { const W = this.store('arenamix.wallet.v1', null); return W && typeof W.coins === 'number' ? W.coins : 2450; }
  fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  renderVals() {
    const s = this.state, R = this.store('arenamix.record.v1', {}), r = R[s.sport] || { played: 0, won: 0, lost: 0, drawn: 0, gf: 0, ga: 0, clean: 0, best: 0 };
    const goals = s.sport === 'all' || s.sport === 'futbol', pct = (a) => (r.played ? Math.round(a / r.played * 100) : 0);
    // every tile in its own colour: a coloured glass card with a glow behind the number
    const tile = (label, value, color, tint) => { const c = tint || color || '#A78BFA'; return { label, value: String(value), color: '#FFFFFF', glow: c, box: 'position: relative; display: flex; flex-direction: column; gap: 3px; padding: 10px 12px 10px 16px; border-radius: 14px; overflow: hidden; background: radial-gradient(70% 90% at 100% 0%, ' + c + '33, transparent 70%), linear-gradient(160deg, #0B1A44F0, #040A1EF0); box-shadow: inset 4px 0 0 ' + c + ', inset 0 0 0 1px ' + c + '55, inset 0 1px 0 #ffffff22, 0 6px 14px #0007;' }; };
    const tiles = [
      tile('PARTIDOS', r.played, null, '#3B82F6'), tile('VICTORIAS', r.won, '#53D88E'), tile('DERROTAS', r.lost, '#FF8A8E'),
      tile('EMPATES', r.drawn, null, '#94A3B8'), tile('% VICTORIAS', pct(r.won) + '%', '#22D3EE'), tile('MEJOR RACHA', r.best, '#FFC53D'),
      tile('GOLES MARCADOS', goals ? r.gf : '—', null, '#F97316'), tile('GOLES ENCAJADOS', goals ? r.ga : '—', null, '#E11D48'), tile('PORTERÍAS A CERO', goals ? r.clean : '—', null, '#A855F7')
    ];
    const labels = { all: 'Todos', futbol: 'Fútbol' };
    const keys = Object.keys(labels), ti = Math.max(0, keys.indexOf(s.sport));
    const tabs = keys.map((k) => ({ label: labels[k], sel: k === s.sport ? 'true' : 'false', pick: () => this.setState({ sport: k }), style: 'position: relative; z-index: 1; flex: 1; height: 34px; border: 0; border-radius: 12px; font: 800 13px Exo2, sans-serif; cursor: pointer; background: transparent; transition: color .3s; color: ' + (k === s.sport ? '#FFFFFF;' : '#9FB6E0;') }));
    const cl = this.claimed(), ready = this.achievements().filter((a) => a.cur >= a.goal && !cl[a.id]).length;
    const mmr = this.store('arenamix.mmr.v1', {}), top = Object.keys(mmr).reduce((m, k) => Math.max(m, mmr[k] || 0), 0);
    const tiers = [['Bronce', 0], ['Plata', 300], ['Oro', 750], ['Platino', 1350], ['Diamante', 2100], ['Campeón', 3075], ['Super campeón', 4275], ['Élite', 5775]];
    let best = 'Sin rango'; if (Object.keys(mmr).length) tiers.forEach(([n, v]) => { if (top >= v) best = 'Mejor rango: ' + n; });
    const w = (a, c) => 'width: ' + pct(a) + '%; background: ' + c + ';';
    return {
      myLv: String(window.AMProgress ? window.AMProgress.level().level : 1),
      ...this.extrasVals(),
      tiles, tabs, sportKey: s.sport, myName: window.AMOnline ? window.AMOnline.myName() : 'Tú',
      thumb: 'position: absolute; top: 4px; bottom: 4px; left: calc(4px + ' + ti + ' * (100% - 8px) / 2); width: calc((100% - 8px) / 2); border-radius: 12px; background: linear-gradient(180deg, #3DA9FF, #0A3DCC); box-shadow: inset 0 1px 0 #FFFFFF66, 0 0 14px #1E8BFF; transition: left .4s cubic-bezier(.3,1.5,.5,1);', coins: this.fmt(this.coins()), bestRank: best,
      hasBadge: ready > 0, badge: String(ready),
      totalLabel: r.played + ' partidos',
      barW: w(r.won, '#53D88E'), barD: w(r.drawn, '#8C8CB0'), barL: w(r.lost, '#FF5C5C')
    };
  }
}
</script>
</body>
</html>
