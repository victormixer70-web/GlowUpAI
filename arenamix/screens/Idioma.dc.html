<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir idioma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
input::placeholder{color:#8686A6}
.id-flag{position:relative;flex:none;width:44px;height:30px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 2px #0B0B14,0 3px 0 #05050A}
.id-flag::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#FFFFFF55 45%,transparent 60%) -150% 0/250% 100% no-repeat;animation:idWave 3.6s ease-in-out infinite}
@keyframes idWave{0%,55%{background-position:-150% 0}100%{background-position:150% 0}}
.id-globe{animation:idSpin 10s linear infinite}
@keyframes idSpin{to{transform:rotate(360deg)}}
.id-row{transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.id-row:active{transform:scale(.97)}
.id-on .id-flag{animation:idPop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes idPop{0%{transform:scale(.8) rotate(-8deg)}100%{transform:scale(1)}}
</style>
</helmet>
<div class="bc-stage" style="position: relative; width: 844px; height: 390px; box-sizing: border-box;  isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif; overflow: hidden">
  <div class="am-bg under"></div>
  <div class="bc-beams" style="z-index: -1"></div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 20px 6px 20px">
    <a href="Main.dc.html" aria-label="Volver" class="bc-para" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 38px; background: #17172A; color: #F4F4FA"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
    <div style="display: flex; flex-direction: column">
      <h1 class="bc-title" style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 30px; line-height: 1; letter-spacing: 1px"><svg class="id-globe" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2" style="filter: drop-shadow(0 0 6px #22D3EE)"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3 3 16 0 19M12 2.5c-3 3-3 16 0 19"/></svg>IDIOMA</h1>
      <span style="font-size: 12px; color: #A3A3C2">Menús, partidas y tienda. Puedes cambiarlo en Ajustes.</span>
    </div>
    <div style="flex: 1"></div>
        <label style="display: flex; align-items: center; gap: 10px; height: 44px; width: 220px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #17172A; border: 1px solid #2E2E52">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3C2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" aria-label="Buscar idioma" placeholder="Buscar idioma" style="flex: 1; border: 0; outline: none; background: transparent; color: #F4F4FA; font: 500 15px Exo2, sans-serif">
    </label>
        <a href="Main.dc.html" class="bc-btn am-shine" style="flex: none; display: flex; align-items: center; justify-content: center; height: 42px; padding: 0 24px; text-decoration: none; font-size: 19px; white-space: nowrap">CONFIRMAR · {{current}}</a>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 76px; bottom: 14px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="10">
      <button type="button" onClick="{{l.pick}}" class="{{l.cls}}" style="{{l.rowStyle}}">
        <span class="id-flag" aria-hidden="true" style="{{l.flag}}"></span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
          <span style="font-size: 16px; font-weight: 700; color: #F4F4FA">{{l.native}}</span>
          <span style="font-size: 12px; color: #A3A3C2">{{l.name}}</span>
        </span>
        <span style="{{l.dotStyle}}"></span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'es' };
  }
  renderVals() {
    const list = [
      { id: 'es', code: 'ES', native: 'Español', name: 'Spanish' },
      { id: 'en', code: 'EN', native: 'English', name: 'Inglés' },
      { id: 'pt', code: 'PT', native: 'Português', name: 'Portugués' },
      { id: 'fr', code: 'FR', native: 'Français', name: 'Francés' },
      { id: 'de', code: 'DE', native: 'Deutsch', name: 'Alemán' },
      { id: 'it', code: 'IT', native: 'Italiano', name: 'Italiano' },
      { id: 'ja', code: 'JA', native: '日本語', name: 'Japonés' },
      { id: 'ko', code: 'KO', native: '한국어', name: 'Coreano' },
      { id: 'ar', code: 'AR', native: 'العربية', name: 'Árabe' },
      { id: 'tr', code: 'TR', native: 'Türkçe', name: 'Turco' }
    ];
    const picked = this.state.picked;
    const base = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 6px 14px; box-sizing: border-box; border-radius: 14px; font-family: Exo2, sans-serif; text-align: left; cursor: pointer; ';
    // simple flags drawn with gradients (English: the British blue with its red and white cross)
    const FLAG = {
      es: 'linear-gradient(180deg, #C60B1E 25%, #FFC400 25% 75%, #C60B1E 75%)',
      en: 'linear-gradient(90deg, transparent 42%, #C8102E 42% 58%, transparent 58%), linear-gradient(180deg, transparent 38%, #C8102E 38% 62%, transparent 62%), linear-gradient(90deg, transparent 36%, #FFFFFF 36% 64%, transparent 64%), linear-gradient(180deg, transparent 30%, #FFFFFF 30% 70%, transparent 70%), #012169',
      pt: 'linear-gradient(90deg, #046A38 40%, #DA291C 40%)',
      fr: 'linear-gradient(90deg, #0055A4 33.3%, #FFFFFF 33.3% 66.6%, #EF4135 66.6%)',
      de: 'linear-gradient(180deg, #000000 33.3%, #DD0000 33.3% 66.6%, #FFCE00 66.6%)',
      it: 'linear-gradient(90deg, #009246 33.3%, #FFFFFF 33.3% 66.6%, #CE2B37 66.6%)',
      ja: 'radial-gradient(circle, #BC002D 0 7px, transparent 7.5px), #FFFFFF',
      ko: 'radial-gradient(circle, transparent 7.5px, #FFFFFF 8px), linear-gradient(180deg, #CD2E3A 50%, #0047A0 50%)',
      ar: 'linear-gradient(180deg, #CE1126 33.3%, #FFFFFF 33.3% 66.6%, #000000 66.6%)',
      tr: 'radial-gradient(circle at 46% 50%, #E30A17 0 5px, transparent 5.5px), radial-gradient(circle at 40% 50%, #FFFFFF 0 7px, transparent 7.5px), #E30A17'
    };
    const langs = list.map((l) => {
      const on = l.id === picked;
      return {
        ...l, cls: 'id-row' + (on ? ' id-on' : ''), flag: 'background: ' + (FLAG[l.id] || '#21213A') + ';',
        rowStyle: base + (on ? 'background: linear-gradient(90deg, #22D3EE26, #1E1A3A 60%); border: 2px solid #22D3EE; box-shadow: 0 0 16px #22D3EE44, 0 3px 0 #05050A;' : 'background: #17172A; border: 2px solid transparent; box-shadow: 0 3px 0 #05050A;'),
        dotStyle: 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; ' + (on ? 'border: 7px solid #22D3EE; background: #0B0B14;' : 'border: 2px solid #4C4C78;'),
        pick: () => this.setState({ picked: l.id })
      };
    });
    const current = list.find((l) => l.id === picked).native.toUpperCase();
    return { langs, current };
  }
}
</script>
</body>
</html>
