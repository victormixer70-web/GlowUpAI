<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir idioma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
input::placeholder{color:#8686A6}
.id-flag{position:relative;flex:none;width:44px;height:30px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 2px #0B0B14,0 3px 0 #05050A}
.id-flag::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#FFFFFF55 45%,transparent 60%) -150% 0/250% 100% no-repeat;animation:idWave 3.6s ease-in-out infinite}
@keyframes idWave{0%,55%{background-position:-150% 0}100%{background-position:150% 0}}
.id-globe{animation:idSpin 10s linear infinite}
@keyframes idSpin{to{transform:rotate(360deg)}}
.id-row{transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.id-row:active{transform:scale(.97)}
.id-on .id-flag{animation:idPop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes idPop{0%{transform:scale(.8) rotate(-8deg)}100%{transform:scale(1)}}
</style>
</helmet>
<div class="bc-stage" style="position: relative; width: 844px; height: 390px; box-sizing: border-box;  isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif; overflow: hidden">
  <div class="am-bg under"></div>
  <div class="bc-beams" style="z-index: -1"></div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 20px 6px 20px">
    <a href="Main.dc.html" aria-label="Volver" class="bc-para" style="display: flex; align-items: center; justify-content: center; width: 46px; height: 38px; background: #17172A; color: #F4F4FA"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
    <div style="display: flex; flex-direction: column">
      <h1 class="bc-title" style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 30px; line-height: 1; letter-spacing: 1px"><svg class="id-globe" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2" style="filter: drop-shadow(0 0 6px #22D3EE)"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3 3 16 0 19M12 2.5c-3 3-3 16 0 19"/></svg>IDIOMA</h1>
      <span style="font-size: 12px; color: #A3A3C2">Menús, partidas y tienda. Puedes cambiarlo en Ajustes.</span>
    </div>
    <div style="flex: 1"></div>
        <label style="display: flex; align-items: center; gap: 10px; height: 44px; width: 220px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #17172A; border: 1px solid #2E2E52">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3C2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" aria-label="Buscar idioma" placeholder="Buscar idioma" style="flex: 1; border: 0; outline: none; background: transparent; color: #F4F4FA; font: 500 15px Exo2, sans-serif">
    </label>
        <a href="Main.dc.html" onClick="{{confirm}}" class="bc-btn am-shine" style="flex: none; display: flex; align-items: center; justify-content: center; height: 42px; padding: 0 24px; text-decoration: none; font-size: 19px; white-space: nowrap">CONFIRMAR · {{current}}</a>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 76px; bottom: 14px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="10">
      <button type="button" onClick="{{l.pick}}" class="{{l.cls}}" style="{{l.rowStyle}}">
        <span class="id-flag" aria-hidden="true" style="{{l.flag}}"></span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
          <span translate="no" style="font-size: 16px; font-weight: 700; color: #F4F4FA">{{l.native}}</span>
          <span style="font-size: 12px; color: #A3A3C2">{{l.name}}</span>
        </span>
        <sc-if value="{{l.soon}}" hint-placeholder-val="{{ false }}"><span style="padding: 3px 8px; border-radius: 8px; background: #26264A; color: #A3A3C2; font: 800 10px Exo2, sans-serif; letter-spacing: 1px">PRONTO</span></sc-if>
        <span style="{{l.dotStyle}}"></span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: window.AMI18n ? window.AMI18n.lang() : 'es' };
  }
  renderVals() {
    const list = [
      { id: 'es', code: 'ES', native: 'Español', name: 'Spanish' },
      { id: 'en', code: 'EN', native: 'English', name: 'Inglés' },
      { id: 'pt', code: 'PT', native: 'Português', name: 'Portugués' },
      { id: 'fr', code: 'FR', native: 'Français', name: 'Francés' },
      { id: 'de', code: 'DE', native: 'Deutsch', name: 'Alemán' },
      { id: 'it', code: 'IT', native: 'Italiano', name: 'Italiano' },
      { id: 'ja', code: 'JA', native: '日本語', name: 'Japonés' },
      { id: 'ko', code: 'KO', native: '한국어', name: 'Coreano' },
      { id: 'ar', code: 'AR', native: 'العربية', name: 'Árabe' },
      { id: 'tr', code: 'TR', native: 'Türkçe', name: 'Turco' }
    ];
    // Japanese, Korean and Arabic are not offered
    list.splice(0, list.length, ...list.filter((l) => ['ja', 'ko', 'ar'].indexOf(l.id) < 0));
    const picked = this.state.picked;
    const base = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 6px 14px; box-sizing: border-box; border-radius: 14px; font-family: Exo2, sans-serif; text-align: left; cursor: pointer; ';
    // each language's flag, drawn as a small picture (3:2)
    const SVG = {
      es: '<rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/><g transform="translate(14 13)"><rect x="0" y="2" width="9" height="11" rx="2" fill="#AA151B" stroke="#7A4E0E" stroke-width=".8"/><rect x="4.5" y="2" width="4.5" height="5.5" fill="#F1BF00"/><path d="M0 0h9l-1 2h-7z" fill="#C8A04A"/><rect x="-2.5" y="3" width="1.5" height="10" fill="#C8C8C8"/><rect x="10" y="3" width="1.5" height="10" fill="#C8C8C8"/></g>',
      en: '<clipPath id="c"><path d="M30 20h30v20zv20H0zH0V0zV0h30z"/></clipPath><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#FFFFFF" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" clip-path="url(#c)" stroke="#C8102E" stroke-width="5"/><path d="M30 0v40M0 20h60" stroke="#FFFFFF" stroke-width="12"/><path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="7"/>',
      pt: '<rect width="60" height="40" fill="#DA291C"/><rect width="24" height="40" fill="#046A38"/><circle cx="24" cy="20" r="8.5" fill="none" stroke="#FFE600" stroke-width="2.2"/><path d="M19.5 14.5h9v7c0 3-2 5-4.5 6c-2.5-1-4.5-3-4.5-6z" fill="#FFFFFF" stroke="#DA291C" stroke-width="1.6"/><g fill="#003399"><rect x="23" y="17" width="2" height="2"/><rect x="21" y="19" width="2" height="2"/><rect x="25" y="19" width="2" height="2"/><rect x="23" y="21" width="2" height="2"/></g>',
      fr: '<rect width="20" height="40" fill="#0055A4"/><rect x="20" width="20" height="40" fill="#FFFFFF"/><rect x="40" width="20" height="40" fill="#EF4135"/>',
      de: '<rect width="60" height="14" fill="#000000"/><rect y="13.3" width="60" height="13.4" fill="#DD0000"/><rect y="26.6" width="60" height="13.4" fill="#FFCE00"/>',
      it: '<rect width="20" height="40" fill="#009246"/><rect x="20" width="20" height="40" fill="#FFFFFF"/><rect x="40" width="20" height="40" fill="#CE2B37"/>',
      ja: '<rect width="60" height="40" fill="#FFFFFF"/><circle cx="30" cy="20" r="12" fill="#BC002D"/>',
      ko: '<rect width="60" height="40" fill="#FFFFFF"/><g transform="translate(30 20) rotate(33.7)"><path d="M-10 0a10 10 0 0 1 20 0a5 5 0 0 1-10 0a5 5 0 0 0-10 0z" fill="#CD2E3A"/><path d="M-10 0a10 10 0 0 0 20 0a5 5 0 0 0-10 0a5 5 0 0 1-10 0z" fill="#0047A0"/></g><g fill="#000000"><g transform="translate(12 8) rotate(-56.3)"><rect x="-5" y="-4" width="10" height="1.8"/><rect x="-5" y="-1" width="10" height="1.8"/><rect x="-5" y="2" width="10" height="1.8"/></g><g transform="translate(48 32) rotate(-56.3)"><rect x="-5" y="-4" width="4.3" height="1.8"/><rect x=".7" y="-4" width="4.3" height="1.8"/><rect x="-5" y="-1" width="4.3" height="1.8"/><rect x=".7" y="-1" width="4.3" height="1.8"/><rect x="-5" y="2" width="4.3" height="1.8"/><rect x=".7" y="2" width="4.3" height="1.8"/></g><g transform="translate(48 8) rotate(56.3)"><rect x="-5" y="-4" width="10" height="1.8"/><rect x="-5" y="-1" width="4.3" height="1.8"/><rect x=".7" y="-1" width="4.3" height="1.8"/><rect x="-5" y="2" width="10" height="1.8"/></g><g transform="translate(12 32) rotate(56.3)"><rect x="-5" y="-4" width="4.3" height="1.8"/><rect x=".7" y="-4" width="4.3" height="1.8"/><rect x="-5" y="-1" width="10" height="1.8"/><rect x="-5" y="2" width="4.3" height="1.8"/><rect x=".7" y="2" width="4.3" height="1.8"/></g></g>',
      ar: '<rect width="60" height="40" fill="#006C35"/><path d="M14 15c2-3 4 1 6-2s3 2 5-1 4 2 6-1 3 2 5-1 4 2 6-1 3 2 4 0" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/><path d="M17 19c3 1 6-1 9 0s6-1 9 0 6-1 9 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/><path d="M16 27h26l3-1.2l-3-1h-26z" fill="#FFFFFF"/><rect x="14" y="25.2" width="3" height="2.6" rx=".6" fill="#FFFFFF"/>',
      tr: '<rect width="60" height="40" fill="#E30A17"/><circle cx="23" cy="20" r="10" fill="#FFFFFF"/><circle cx="25.5" cy="20" r="8" fill="#E30A17"/><path d="M33 20l7.6-2.5l-4.7 6.5v-8l4.7 6.5z" fill="#FFFFFF"/>'
    };
    const flagBg = (id) => SVG[id] ? 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" preserveAspectRatio="none">' + SVG[id] + '</svg>') + '") center / 100% 100% no-repeat, #21213A' : '#21213A';
    const langs = list.map((l) => {
      const on = l.id === picked, soon = !!(window.AMI18n && !window.AMI18n.ready(l.id));
      return {
        soon,
        ...l, cls: 'id-row' + (on ? ' id-on' : ''), flag: 'background: ' + flagBg(l.id) + ';',
        rowStyle: base + (on ? 'background: linear-gradient(90deg, #22D3EE26, #1E1A3A 60%); border: 2px solid #22D3EE; box-shadow: 0 0 16px #22D3EE44, 0 3px 0 #05050A;' : 'background: #17172A; border: 2px solid transparent; box-shadow: 0 3px 0 #05050A;'),
        dotStyle: 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; ' + (on ? 'border: 7px solid #22D3EE; background: #0B0B14;' : 'border: 2px solid #4C4C78;'),
        pick: () => { if (!soon) this.setState({ picked: l.id }); }
      };
    });
    const current = list.find((l) => l.id === picked).native.toUpperCase();
    return { langs, current,
      // save the language; the app reloads in it and goes back to the start
      confirm: (e) => { const I = window.AMI18n; if (!I || I.lang() === picked) return; e.preventDefault(); try { localStorage.setItem('arenamix.lang.v1', picked); } catch (er) {} location.hash = '#/Main'; location.reload(); } };
  }
}
</script>
</body>
</html>
