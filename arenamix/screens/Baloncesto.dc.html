<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: #120E0A; color: #F4F4FA; font-family: Manrope, sans-serif; user-select: none; -webkit-user-select: none">

  <svg width="844" height="390" viewBox="0 0 844 390" style="position: absolute; left: 0; top: 0; pointer-events: none">

  <button type="button" aria-label="Zona de tiro: desliza hacia arriba hacia la canasta" onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pCancel}}" style="position: absolute; inset: 0; width: 844px; height: 390px; padding: 0; border: 0; background: transparent; touch-action: none; cursor: crosshair"></button>
  <sc-if value="{{no3d}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #CACAE0">Tu navegador no permite gráficos 3D (WebGL) en esta vista.</div></sc-if>

  <div style="position: absolute; left: 12px; top: 10px; display: flex; align-items: center; gap: 8px">
    <a href="Modos.dc.html" aria-label="Volver a modos" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #0B0B14CC; color: #F4F4FA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
    </a>
    <span style="padding: 8px 12px; border-radius: 12px; background: #0B0B14CC; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 20px; letter-spacing: 1px">BALONCESTO</span>
    <div style="{{tabsStyle}}">

      <button type="button" onClick="{{setFree}}" style="{{freeTab}}">Tiros libres</button>

  </div>

      <span style="font-size: 13px; color: #CACAE0; text-align: center; max-width: 460px; line-height: 1.5">{{startText}}</span>

    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":null},"locked":{"editor":null},"onEnd":{"editor":null},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 0 };
    this.tick = this.tick.bind(this);
    this.canvasRef = (el) => { if (el && el !== this.cv) { this.cv = el; this.init3D(); } };
    this.mode = props.mode === 'free' ? 'free' : 'three';
    this.best = { three: 0, free: 0 };
    this.reset();
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    if (this.R) { this.R.dispose(); this.R = null; }
  }
  spots() {
    if (this.mode === 'free') return Array.from({ length: 10 }, () => ({ d: 4.225, a: 0, money: false }));
    const out = [];
    [-1.2, -0.6, 0, 0.6, 1.2].forEach((a, i) => { for (let k = 0; k < 3; k++) out.push({ d: Math.abs(a) > 1 ? 6.75 : 6.75, a, money: k === 2, spot: i }); });
    return out;
  }
  reset() {
    this.st = this.loadSportStats('basket');
    this.list = this.spots();
    this.idx = 0; this.pts = 0; this.made = 0;
    this.time = 60;
    this.phase = 'start';
    this.pt = 0; this.result = null; this.swipe = null;
    this.placeBall();
    if (this.R) { this.updateRack(); this.camSnap = true; this.draw3D(0); }
  }
  shooterPos() {
    const s = this.list[Math.min(this.idx, this.list.length - 1)];
    return { x: Math.sin(s.a) * s.d, z: Math.cos(s.a) * s.d, a: s.a };
  }
  placeBall() {
    const p = this.shooterPos();
    const tx = -Math.sin(p.a), tz = -Math.cos(p.a);
    this.b = { x: p.x + tx * 0.3, y: 2.0, z: p.z + tz * 0.3, vx: 0, vy: 0, vz: 0, spin: 0 };
    this.jump = 0; this.touched = false; this.board = false; this.scored = false; this.below = false;
  }
  loop() {
    if (this.raf) return;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.tick);
  }
  tick(now) {
    const dt = Math.min(0.033, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    for (let i = 0; i < 6; i++) this.step(dt / 6);
    this.draw3D(dt);
    this.forceUpdate();
    this.raf = (this.phase === 'aim' && this.mode === 'three') || this.phase === 'jump' || this.phase === 'flight' || this.phase === 'result' || this.camMoving ? requestAnimationFrame(this.tick) : null;
  }
  idealSpeed(d, h, th) {
    const c = Math.cos(th), den = 2 * c * c * (d * Math.tan(th) - h);
    return Math.sqrt(9.81 * d * d / Math.max(0.1, den));
  }
  solveSpeed(d, y0, th) {
    const range = (v) => {
      let x = 0, y = y0, vx = Math.cos(th) * v, vy = Math.sin(th) * v, dt = 1 / 400;
      for (let i = 0; i < 2000; i++) {
        const sp = Math.hypot(vx, vy), py = y;
        vy -= 9.81 * dt; vx -= 0.012 * sp * vx * dt; vy -= 0.012 * sp * vy * dt;
        x += vx * dt; y += vy * dt;
        if (vy < 0 && py >= 3.05 && y < 3.05) return x;
        if (y < 0) return 0;
      }
      return 0;
    };
    let lo = 3, hi = 16;
    for (let i = 0; i < 28; i++) { const m = (lo + hi) / 2; if (range(m) < d) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  shoot() {
    const pts = this.swipe; this.swipe = null;
    if (!pts || pts.length < 2) { this.forceUpdate(); return; }
    const p0 = pts[0], p1 = pts[pts.length - 1];
    const dy = p0.y - p1.y, dx = p1.x - p0.x;
    if (dy < 30) { this.forceUpdate(); return; }
    const ratio = dy / 230;
    const tol = 0.1 + 0.12 * this.tt('tri');
    const speedErr = (ratio - 1) * 0.06 * (Math.abs(ratio - 1) < tol ? 0.35 : 1);
    const lat = Math.atan2(dx, dy) * (0.32 - 0.2 * this.tt('tri')) + (Math.random() - 0.5) * 0.03 * (1 - this.tt('tri'));
    this.shot = { speedErr, lat, ratio, tol };
    this.phase = 'jump'; this.pt = 0;
    this.loop();
  }
  release() {
    const b = this.b, p = this.shooterPos();
    const jumpH = 0.35 + 0.3 * this.tt('sal');
    const rx = 0 - b.x, rz = 0 - b.z, d = Math.hypot(rx, rz);
    const th = 52 * Math.PI / 180, h = 3.05 - b.y;
    const v = this.solveSpeed(d, b.y, th) * (1 + this.shot.speedErr);
    const ang = Math.atan2(rx, rz) + this.shot.lat;
    b.vx = Math.sin(ang) * Math.cos(th) * v;
    b.vz = Math.cos(ang) * Math.cos(th) * v;
    b.vy = Math.sin(th) * v;
    b.spin = -12;
    this.phase = 'flight'; this.pt = 0;
    this.lastJump = jumpH;
  }
  step(dt) {
    this.pt += dt;
    if (this.mode === 'three' && (this.phase === 'aim' || this.phase === 'jump' || this.phase === 'flight' || this.phase === 'result')) {
      this.time -= dt;
      if (this.time <= 0) { this.time = 0; this.finish(); return; }
    }
    const b = this.b;
    if (this.phase === 'jump') {
      const J = 0.35 + 0.3 * this.tt('sal');
      this.jump = Math.sin(Math.min(1, this.pt / 0.6) * Math.PI) * J;
      b.y = 2.0 + this.jump + Math.min(1, this.pt / 0.3) * 0.25;
      if (this.pt >= 0.3) this.release();
      return;
    }
    if (this.phase === 'flight' || this.phase === 'result') {
      if (this.jump > 0) this.jump = Math.max(0, Math.sin(Math.min(1, (this.pt + 0.3) / 0.6) * Math.PI) * (0.35 + 0.3 * this.tt('sal')));
      const py = b.y;
      const sp = Math.hypot(b.vx, b.vy, b.vz);
      b.vy -= 9.81 * dt;
      b.vx -= 0.012 * sp * b.vx * dt; b.vy -= 0.012 * sp * b.vy * dt; b.vz -= 0.012 * sp * b.vz * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      const r = 0.12;
      // rim
      const hx = b.x, hz = b.z, hd = Math.hypot(hx, hz) || 1e-6;
      const nx = hx / hd * 0.225, nz = hz / hd * 0.225;
      const ddx = b.x - nx, ddy = b.y - 3.05, ddz = b.z - nz, dist = Math.hypot(ddx, ddy, ddz);
      if (dist < r + 0.01) {
        const ux = ddx / dist, uy = ddy / dist, uz = ddz / dist, vn = b.vx * ux + b.vy * uy + b.vz * uz;
        if (vn < 0) { b.vx -= 1.55 * vn * ux; b.vy -= 1.55 * vn * uy; b.vz -= 1.55 * vn * uz; b.vx *= 0.92; b.vz *= 0.92; this.touched = true; }
        const push = r + 0.01 - dist; b.x += ux * push; b.y += uy * push; b.z += uz * push;
      }
      // backboard
      if (b.z - r < -0.375 && b.z > -0.6 && Math.abs(b.x) < 0.9 && b.y > 2.9 && b.y < 3.95 && b.vz < 0) { b.z = -0.375 + r; b.vz = -b.vz * 0.65; this.board = true; }
      // floor
      if (b.y < r) { b.y = r; if (b.vy < -1) { b.vy = -b.vy * 0.72; b.vx *= 0.85; b.vz *= 0.85; } else b.vy = 0; }
      // score
      if (!this.scored && py >= 3.05 && b.y < 3.05 && b.vy < 0 && Math.hypot(b.x, b.z) < 0.2) { this.scored = true; this.netT = 0.6; this.onResult(true); }
      if (this.netT > 0) this.netT -= dt;
      if (this.phase === 'flight' && !this.scored && (b.y < 2.2 && b.vy < 0 && this.pt > 0.5 || this.pt > 3)) this.onResult(false);
    }
    if (this.phase === 'result' && this.pt > (this.mode === 'three' ? 0.9 : 1.4)) {
      this.idx++;
      if (this.idx >= this.list.length) { this.finish(); return; }
      const moved = this.list[this.idx].spot !== this.list[this.idx - 1].spot;
      this.placeBall();
      this.phase = 'aim'; this.pt = 0; this.result = null;
      if (moved) { this.camMoving = true; this.camT = 0; }
    }
  }
  onResult(made) {
    const s = this.list[this.idx];
    let p = 0;
    if (made) { p = this.mode === 'free' ? 1 : s.money ? 2 : 1; this.made++; }
    this.pts += p;
    const kind = made ? (!this.touched && !this.board ? 'swish' : this.board ? 'tablero' : 'dentro') : 'fallo';
    this.result = { kind, p };
    this.phase = 'result'; this.pt = 0;
  }
  finish() {
    this.phase = 'done';
    this.best[this.mode] = Math.max(this.best[this.mode], this.pts);
  }
  mat(color, o) {
    const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.75, metalness: 0.02 }, o || {}));
    m.color = new THREE.Color(color).convertSRGBToLinear();
    if (o && o.emissive != null) m.emissive = new THREE.Color(o.emissive).convertSRGBToLinear();
    return m;
  }
  canvasTex(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  }
  makePlayer(o) {
    const T = THREE, g = new T.Group(), body = new T.Group();
    g.add(body);
    const tones = [0xc68a5e, 0xe0b48f, 0x8d5a3b, 0xf1c9a5, 0x6b4129, 0xb9794f];
    const skinHex = o.skin || tones[Math.floor(Math.random() * tones.length)];
    const skin = this.mat(skinHex, { roughness: 0.62 });
    const skinDark = this.mat(new T.Color(skinHex).multiplyScalar(0.78), { roughness: 0.7 });
    const shirt = this.mat(o.shirt, { roughness: 0.68 }), shorts = this.mat(o.shorts, { roughness: 0.7 });
    const trimCol = new T.Color(o.trimCss || '#0B0B14');
    const trim = this.mat(trimCol, { roughness: 0.6 });
    const sock = this.mat(o.socks, { roughness: 0.8 });
    const boot = this.mat(o.boot || 0x22d3ee, { roughness: 0.35, metalness: 0.1 });
    const sole = this.mat(0x111111, { roughness: 0.6 });
    const hairM = this.mat(o.hair || 0x241811, { roughness: 0.85 });
    const hand = o.gloves ? this.mat(0xf2f5fa, { roughness: 0.5 }) : skin;
    const add = (parent, mesh, x, y, z) => { mesh.position.set(x || 0, y || 0, z || 0); mesh.castShadow = true; parent.add(mesh); return mesh; };
    const lathe = (pts, m, seg) => new T.Mesh(new T.LatheGeometry(pts.map(([r, y]) => new T.Vector2(r, y)), seg || 18), m);
    const sph = (r, m, w, h) => new T.Mesh(new T.SphereGeometry(r, w || 18, h || 14), m);
    const cyl = (rt, rb, h, m, seg) => new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 16), m);
    // legs
    const legs = [];
    [-1, 1].forEach((s) => {
      const hip = new T.Group(); hip.position.set(0.1 * s, 0.94, 0); body.add(hip);
      add(hip, lathe([[0.001, 0], [0.072, 0.02], [0.088, 0.14], [0.098, 0.3], [0.1, 0.44], [0.001, 0.46]], skin), 0, -0.46, 0);
      add(hip, cyl(0.112, 0.118, 0.2, shorts), 0, -0.07, 0);
      add(hip, cyl(0.119, 0.119, 0.025, trim), 0, -0.165, 0);
      const knee = new T.Group(); knee.position.y = -0.45; hip.add(knee);
      add(knee, sph(0.066, skin), 0, 0, 0.005);
      add(knee, lathe([[0.001, -0.43], [0.045, -0.42], [0.05, -0.3], [0.07, -0.16], [0.064, -0.04], [0.06, 0], [0.001, 0.01]], skin), 0, 0, 0);
      add(knee, cyl(0.068, 0.056, 0.32, sock), 0, -0.27, 0);
      add(knee, cyl(0.07, 0.07, 0.03, trim), 0, -0.115, 0);
      const bt = add(knee, new T.Mesh(new T.BoxGeometry(0.105, 0.075, 0.24), boot), 0, -0.44, 0.045);
      add(knee, sph(0.053, boot), 0, -0.445, 0.155).scale.set(1, 0.7, 1);
      add(knee, new T.Mesh(new T.BoxGeometry(0.11, 0.022, 0.31), sole), 0, -0.48, 0.06);
      add(knee, new T.Mesh(new T.BoxGeometry(0.06, 0.01, 0.1), trim), 0, -0.4, 0.06);
      legs.push({ hip, knee });
    });
    // pelvis + torso
    add(body, lathe([[0.001, 0], [0.17, 0.01], [0.2, 0.08], [0.19, 0.2], [0.001, 0.21]], shorts), 0, 0.84, 0).scale.z = 0.82;
    const torso = add(body, lathe([[0.001, 0], [0.18, 0.0], [0.17, 0.12], [0.185, 0.3], [0.225, 0.46], [0.2, 0.58], [0.1, 0.64], [0.001, 0.645]], shirt), 0, 1.02, 0);
    torso.scale.z = 0.72;
    add(body, cyl(0.181, 0.181, 0.03, trim), 0, 1.04, 0).scale.z = 0.73;
    const collar = add(body, new T.Mesh(new T.TorusGeometry(0.075, 0.016, 8, 24), trim), 0, 1.655, 0.005);
    collar.rotation.x = Math.PI / 2;
    if (o.number) {
      const mkNum = (size) => this.canvasTex(128, 128, (c) => { c.fillStyle = o.trimCss || '#0B0B14'; c.font = '800 ' + size + 'px Barlow Condensed, Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(o.number, 64, 70); });
      const back = new T.Mesh(new T.PlaneGeometry(0.28, 0.28), new T.MeshStandardMaterial({ map: mkNum(92), transparent: true, roughness: 0.8 }));
      back.position.set(0, 1.36, -0.17); back.rotation.y = Math.PI; body.add(back);
      const front = new T.Mesh(new T.PlaneGeometry(0.12, 0.12), new T.MeshStandardMaterial({ map: mkNum(92), transparent: true, roughness: 0.8 }));
      front.position.set(0.08, 1.48, 0.162); front.rotation.x = -0.12; body.add(front);
    }
    // head
    add(body, cyl(0.055, 0.065, 0.12, skin), 0, 1.68, 0);
    const head = new T.Group(); head.position.y = 1.83; body.add(head);
    add(head, sph(0.112, skin, 24, 18)).scale.set(0.92, 1.08, 1);
    add(head, sph(0.085, skin), 0, -0.06, 0.03).scale.set(1, 0.8, 1);
    [-1, 1].forEach((s) => {
      add(head, sph(0.03, skinDark, 10, 8), 0.103 * s, -0.005, -0.005).scale.set(0.45, 1, 0.75);
      add(head, sph(0.017, this.mat(0xffffff, { roughness: 0.3 }), 10, 8), 0.036 * s, 0.012, 0.097);
      add(head, sph(0.009, this.mat(0x2a1a10, { roughness: 0.2 }), 8, 6), 0.036 * s, 0.012, 0.111);
      const brow = add(head, new T.Mesh(new T.BoxGeometry(0.036, 0.008, 0.01), hairM), 0.037 * s, 0.04, 0.102);

      greenStyle: 'position: absolute; left: 0; right: 0; bottom: ' + ((1 - tol) / 2 * 100).toFixed(1) + '%; height: ' + (tol * 100).toFixed(1) + '%; background: #2FBF7166; border-top: 2px solid #53D88E; border-bottom: 2px solid #53D88E;',
      fillStyle: 'position: absolute; left: 3px; right: 3px; bottom: 3px; border-radius: 6px; height: ' + Math.min(96, ratio * 50).toFixed(1) + '%; background: ' + (Math.abs(ratio - 1) < tol ? '#53D88E' : '#FF8A3D') + ';',
      showHint: this.phase === 'aim' && !sw,
      hintText: 'Desliza hacia arriba: la longitud marca la fuerza (zona verde de la barra) y la dirección, el apunte' + (cur && cur.money ? ' · ★ balón dorado: 2 puntos' : ''),
      showResult: this.phase === 'result' && !!R,
      resultText: rm[0],
      resultSub: R && R.p ? '+' + R.p + (R.p > 1 ? ' puntos' : ' punto') : '',
      resultStyle: 'font-family: \'Barlow Condensed\', sans-serif; font-weight: 800; font-style: italic; font-size: 66px; line-height: 1; letter-spacing: 2px; color: ' + rm[1] + '; text-shadow: 0 5px 0 #0B0B14; transform: scale(' + (0.4 + rs * 0.6).toFixed(2) + ');',
      showStart: this.phase === 'start',
      startTitle: this.mode === 'three' ? 'CONCURSO DE TRIPLES' : 'TIROS LIBRES',
      startText: this.mode === 'three' ? '5 posiciones, 3 balones en cada una y 60 segundos. El último balón de cada posición es dorado y vale 2 puntos.' : '10 tiros libres. Intenta meter el máximo; el swish (sin tocar aro) se celebra más.',
      showDone: this.phase === 'done',
      tabsStyle: this.props.locked ? 'display: none;' : 'display: flex; padding: 4px; gap: 4px; border-radius: 14px; background: #0B0B14CC',
      doneBtn: this.props.onEnd ? 'CONTINUAR' : 'OTRA RONDA',
      doneAction: () => { if (this.props.onEnd) this.props.onEnd(this.pts); else { this.reset(); this.phase = 'aim'; this.pt = 0; this.camSnap = true; this.loop(); this.forceUpdate(); } },
      doneKicker: this.mode === 'three' ? 'CONCURSO DE TRIPLES' : 'TIROS LIBRES',
      doneSub: this.made + ' canastas de ' + Math.min(this.idx + (this.phase === 'done' && this.idx < this.list.length ? 0 : 0), this.list.length) + ' tiros · récord ' + this.best[this.mode],
      start: () => { if (this.phase === 'done') this.reset(); this.phase = 'aim'; this.pt = 0; this.camSnap = true; this.loop(); this.forceUpdate(); },
      pDown: (e) => {
        if (this.phase !== 'aim') return;
        e.preventDefault();
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
        this.swipe = [this.local(e)]; this.forceUpdate();
      },
      pMove: (e) => {
        if (!this.swipe) return;
        const q = this.local(e), l = this.swipe[this.swipe.length - 1];
        if (Math.hypot(q.x - l.x, q.y - l.y) > 4 && this.swipe.length < 60) { this.swipe.push(q); this.forceUpdate(); }
      },
      pUp: (e) => { if (this.swipe) { this.swipe.push(this.local(e)); this.shoot(); } },
      pCancel: () => { this.swipe = null; this.forceUpdate(); }
    };
  }
}
</script>
