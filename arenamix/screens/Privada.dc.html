<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
.pv-th{display:flex;align-items:center;gap:8px;height:22px}
.pv-th b{font:400 12px Titulos,sans-serif;letter-spacing:2px}
.pv-th i{width:14px;height:18px;border-radius:4px;box-shadow:0 0 0 1.5px #02040C,0 0 0 2.5px #ffffff55,0 0 10px var(--tc)}
.pv-th em{font-style:normal;font-size:10.5px;font-weight:700;color:#9FB4D8}
.pv-th button{margin-left:auto;height:22px;padding:0 10px;border:0;border-radius:11px;background:#06102E;box-shadow:0 0 0 1.5px var(--tc);color:#fff;font:400 10px Titulos,sans-serif;letter-spacing:1px;cursor:pointer}
.pv-pitch{position:absolute;left:14px;right:14px;top:112px;bottom:70px;border-radius:16px;overflow:hidden;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--ca) 22%,transparent),transparent 30%,transparent 70%,color-mix(in srgb,var(--cb) 22%,transparent)),repeating-linear-gradient(90deg,#17603333 0 54px,#14552D33 54px 108px);box-shadow:inset 0 0 0 2px #FFFFFF14}
.pv-pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#FFFFFF22}
.pv-pitch::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border-radius:50%;box-shadow:inset 0 0 0 2px #FFFFFF22}
.pv-vs{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#FFE38A,#FFC53D 60%,#B7791F);color:#2A1C02;font:800 italic 18px 'Barlow Condensed',sans-serif;box-shadow:0 0 0 3px #040A1C,0 0 18px #FFC53D88;z-index:2;animation:pvVs 1.6s ease-in-out infinite;pointer-events:none}
@keyframes pvVs{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-6deg)}}
.pv-av{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 12px Exo2,sans-serif;color:transparent;box-shadow:0 0 0 2px #02040C,0 0 0 4px var(--pc,#3DA9FF)}
.pv-code{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:6px;background:linear-gradient(90deg,#3A2A0A,#2A1E06);box-shadow:inset 0 0 0 1.5px #FFC53D;-webkit-mask-image:radial-gradient(circle at 0 50%,transparent 5px,#000 5.5px),radial-gradient(circle at 100% 50%,transparent 5px,#000 5.5px);-webkit-mask-composite:source-in;mask-composite:intersect}
.pv-go{position:relative;display:flex;align-items:center;gap:10px}
.pv-go .rg{position:absolute;inset:0;border-radius:14px;box-shadow:0 0 0 2px #22D3EE;opacity:0;animation:pvRing 2.2s ease-out infinite;pointer-events:none}
@keyframes pvRing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.15,1.5)}}
.pv-ball{animation:pvSpin 1.4s linear infinite}
@keyframes pvSpin{to{transform:rotate(360deg)}}
</style>

<div class="bc-stage" style="position: relative; width: 844px; height: 390px; overflow: hidden;  isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>

    <span class="bc-title hd" style="position: absolute; left: 66px; top: 15px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 26px; letter-spacing: 2px">SALA PRIVADA</span>
    <span style="position: absolute; left: 296px; top: 14px; width: 172px; flex-wrap: wrap; row-gap: 3px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A9BEDD; white-space: nowrap">Código <span class="pv-code"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFC53D" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><b style="color: #FFE38A; letter-spacing: 3px; font-size: 15px">{{code}}</b></span><span style="display: flex; align-items: center; gap: 6px; width: 172px; font-size: 10px"><span style="{{netDot}}"></span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis">{{netLabel}}</span></span></span>

      <sc-if value="{{notGuest}}" hint-placeholder-val="{{ true }}">

      </sc-if>

    <sc-if value="{{showJoin}}" hint-placeholder-val="{{ false }}">

    <div style="position: absolute; left: 24px; top: 120px; right: 24px; bottom: 78px; display: flex; gap: 60px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <div class="pv-th" style="--tc: {{colA}}"><i style="background: {{colA}}"></i><b style="color: {{inkA}}">LOCAL</b><em>{{nameA}}</em><sc-if value="{{colBtn}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{openCols}}" aria-label="Elegir mis colores de local y visitante">MIS COLORES</button></sc-if></div>
        <sc-for list="{{teamA}}" as="p" hint-placeholder-count="2">
          <button type="button" onClick="{{p.tap}}" style="{{p.style}}"><span class="pv-av" style="{{p.avStyle}}">{{p.ini}}</span><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span><span style="{{p.tagStyle}}">{{p.tag}}</span></button>
        </sc-for>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <div class="pv-th" style="--tc: {{colB}}"><i style="background: {{colB}}"></i><b style="color: {{inkB}}">VISITANTE</b><em>{{nameB}}</em></div>
        <sc-for list="{{teamB}}" as="p" hint-placeholder-count="2">
          <button type="button" onClick="{{p.tap}}" style="{{p.style}}"><span class="pv-av" style="{{p.avStyle}}">{{p.ini}}</span><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span><span style="{{p.tagStyle}}">{{p.tag}}</span></button>
        </sc-for>
      </div>
    </div>
    <div style="position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; gap: 14px">
      <span style="flex: 1"></span><button type="button" class="am-q" aria-label="Cómo funciona la sala" data-help="{{note}}">?</button>
      <sc-if value="{{canKeep}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #A9BEDD">TU POSICIÓN</span><div style="display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: #0B1A44"><button type="button" onClick="{{setField}}" style="{{fieldStyle}}">CAMPO</button><button type="button" onClick="{{setKeeper}}" style="{{keeperStyle}}">PORTERO</button></div></div></sc-if>
      <button type="button" onClick="{{startMatch}}" class="bc-btn am-shine pv-go" style="flex: none; height: 52px; padding: 0 30px 0 20px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #9AF5FF, #22D3EE 60%, #0EA5C0); color: #040A1C; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 24px; letter-spacing: 2px; cursor: pointer; box-shadow: inset 0 2px 0 #FFFFFFAA, 0 5px 0 #0E8FA3, 0 0 20px #22D3EE66"><span class="rg"></span><span class="rg" style="animation-delay: -1.1s"></span><svg class="pv-ball" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#FFFFFF" stroke="#040A1C" stroke-width="1.6"/><path d="M12 7l3.4 2.5l-1.3 4h-4.2l-1.3-4z" fill="#040A1C"/><path d="M12 7V3M15.4 9.5l3.8-1.2M14.1 13.5l2.3 3.3M9.9 13.5l-2.3 3.3M8.6 9.5L4.8 8.3" stroke="#040A1C" stroke-width="1.3"/></svg>{{startLabel}}</button>
    </div>
    <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 0; right: 0; top: 160px; display: flex; justify-content: center; pointer-events: none"><span style="max-width: 460px; padding: 10px 16px; border-radius: 12px; background: #F4F4FA; color: #040A1C; font-size: 13px; font-weight: 800; text-align: center">{{toastText}}</span></div>
    </sc-if>
  </sc-if>

  <sc-if value="{{isOnlineMatch}}" hint-placeholder-val="{{ false }}">
    <dc-import name="Partido" online="{{online}}" label="PARTIDA ONLINE" mode="quick" duration="120" team-size="{{teamSize}}" autostart="{{ true }}" home-name="Tu equipo" away-name="{{rivalTeamName}}" away-color="#3EA6FF" away-trim="#040A1C" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import>
  </sc-if>
  <sc-if value="{{offlineTeam}}" hint-placeholder-val="{{ false }}">
    <dc-import name="Partido" keeper="{{asKeeper}}" label="PARTIDA PRIVADA" mode="quick" duration="120" team-size="{{teamSize}}" autostart="{{ true }}" home-name="Invitado_4821" mates="{{mates}}" rivals="{{rivals}}" away-name="Equipo rival" away-color="#3EA6FF" away-trim="#040A1C" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import>
  </sc-if>
  <sc-if value="{{isDuelMatch}}" hint-placeholder-val="{{ false }}">
    <dc-import name="Duelo" kind="{{duelKind}}" rival-name="{{rivalName}}" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import>
  </sc-if>
  <sc-if value="{{isBasket}}" hint-placeholder-val="{{ false }}"><dc-import name="Baloncesto" mode="{{mgMode}}" locked="{{ true }}" on-end="{{onScore}}" hint-size="844px,390px"></dc-import></sc-if>
  <sc-if value="{{isTenis}}" hint-placeholder-val="{{ false }}"><dc-import name="Tenis" mode="{{mgMode}}" locked="{{ true }}" on-end="{{onScore}}" hint-size="844px,390px"></dc-import></sc-if>
  <sc-if value="{{isVoley}}" hint-placeholder-val="{{ false }}"><dc-import name="Voley" mode="{{mgMode}}" locked="{{ true }}" on-end="{{onScore}}" hint-size="844px,390px"></dc-import></sc-if>

      <span style="{{resTitleStyle}}">{{resTitle}}</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 1">{{scoreLabel}}</span>
      <div style="display: flex; gap: 8px; margin-top: 8px">

        <a href="Modos.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 18px; border-radius: 14px; border: 1.5px solid #F4F4FA; color: #F4F4FA; text-decoration: none; font-weight: 800; font-size: 14px">Salir</a>

    </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const sel = this.store('arenamix.sel') || {};
    this.sport = sel.sport || this.store('arenamix.sport') || 'futbol';
    this.C = this.catalog(this.sport);
    const fm = this.C.modes.filter((m) => !m.soon);
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    this.code = window.AMOnline ? window.AMOnline.newCode() : Array.from({ length: 5 }, () => abc[Math.floor(Math.random() * abc.length)]).join('');
    const first = fm.find((m) => m.id === 'm2') || fm[0];
    this.myName = window.AMOnline ? window.AMOnline.myName() : 'Jugador';
    // coming from the lobby with a party: this room has the code the friends were sent, and they play on my team
    let fmt0 = first.id;
    const ph = this.store('arenamix.privHost'), pj = this.store('arenamix.privJoin');
    if (ph && Date.now() - ph.at < 60000) { this.code = ph.code; if (this.C.modes.some((m) => m.id === ph.fmt && !m.soon)) fmt0 = ph.fmt; this.party = ph.party || []; }
    if (pj && Date.now() - pj.at < 60000) this.pendingJoin = pj.code;
    try { localStorage.removeItem('arenamix.privHost'); localStorage.removeItem('arenamix.privJoin'); } catch (e) {}
    this.state = { fmt: fmt0, slots: {}, phase: 'room', res: null, showJoin: false, joinCode: '', toast: '', target: 0, net: 'off', roster: [], name: this.myName };
  }
  /* ---------- online room: this phone hosts a room under its code until it joins someone else's ---------- */
  componentDidMount() {
    if (this.pendingJoin) { this.joinTries = 6; this.joinRoom(this.pendingJoin); } else if (this.sport === 'futbol') this.openHost(); this.pingT = setInterval(() => { if (this.room && this.state.phase === 'room') this.forceUpdate(); }, 2000); }
  look() {
    const A = window.AMChars, o = A ? A.outfit('futbol') : null;
    return { cols: window.AMTeams ? window.AMTeams.prefs() : null, club: window.AMTeams ? window.AMTeams.myClub() : null, char: A ? A.pref() : 'ty', hat: o ? o.hat || 'none' : 'none', hatColor: o ? o.hatColor || '' : '', face: o ? o.face || 'none' : 'none', stad: window.AMStad ? window.AMStad.get() : null, st: (() => { try { const j = JSON.parse(localStorage.getItem('arenamix.stats.v1') || 'null'); return j && j.stats ? j.stats : null; } catch (e) { return null; } })() };
  }
  openHost() {
    const O = window.AMOnline;
    if (!O || !O.available()) { this.setState({ net: 'off' }); return; }
    if (this.room) this.room.close();
    this.setState({ net: 'connecting', roster: [] });
    const room = this.room = O.host(this.code, this.myName, {
      open: () => { if (this.room !== room) return; this.setState({ net: 'host', roster: [{ id: room.me, name: this.myName, team: 0, slot: 0, look: this.look(), host: true }] }); },
      join: (id, name) => {
        if (this.room !== room) return;
        const mate = (this.party || []).some((p) => p.toLowerCase() === String(name).toLowerCase());
        const seat = this.freeSeat(mate ? [0, 1] : [1, 0]);
        if (!seat || this.state.phase === 'match') { room.sendTo(id, { t: 'full', why: seat ? 'La partida ya ha empezado.' : 'La sala está llena.' }); return; }
        this.setRoster(this.state.roster.concat([{ id, name, team: seat[0], slot: seat[1], look: null }]));
        this.say(name + ' ha entrado en la sala');
      },
      leave: (id) => {
        if (this.room !== room) return;
        const r = this.state.roster.find((x) => x.id === id);
        this.setRoster(this.state.roster.filter((x) => x.id !== id));
        if (r && this.state.phase !== 'match') this.say(r.name + ' ha salido de la sala');
      },
      msg: (id, m) => {
        if (this.room !== room) return;
        const R = this.state.roster;
        if (m.t === 'hello') this.setRoster(R.map((x) => (x.id === id ? { ...x, name: String(m.name || x.name).slice(0, 16), look: m.look || null } : x)));
        if (m.t === 'seat' && !R.some((x) => x.team === m.team && x.slot === m.slot) && m.slot < this.size()) this.setRoster(R.map((x) => (x.id === id ? { ...x, team: m.team, slot: m.slot } : x)));
      },
      error: (text, type) => {
        if (this.room !== room) return;
        if (type === 'unavailable-id') { this.code = O.newCode(); this.openHost(); return; }
        this.room = null; room.close();
        this.setState({ net: 'off' }); this.say(text);
      }
    });
  }
  joinRoom(code) {
    const O = window.AMOnline;
    if (!O || !O.available()) { this.say('Este navegador no permite jugar online.'); return; }
    if (this.room) this.room.close();
    this.setState({ net: 'connecting', roster: [] });
    const room = this.room = O.join(code, this.myName, {
      open: () => { if (this.room !== room) return; this.joinTries = 0; this.setState({ net: 'guest' }); room.send({ t: 'hello', name: this.myName, look: this.look() }); },
      msg: (id, m) => {
        if (this.room !== room) return;
        if (m.t === 'lobby') this.setState({ roster: m.roster, fmt: m.fmt, hostCode: m.code });
        if (m.t === 'start') this.setState({ roster: m.roster, fmt: m.fmt, phase: 'match', res: null });
        if (m.t === 'full') { this.say(m.why); this.backHome(); }
      },
      leave: () => { if (this.room !== room) return; this.say('El anfitrión ha cerrado la sala'); if (this.state.phase !== 'match') this.backHome(); },
      error: (text) => {
        if (this.room !== room) return;
        // the leader's room may still be opening: try again a few times
        if (this.joinTries > 0) { this.joinTries--; this.room = null; try { room.close(); } catch (e) {} this.setState({ net: 'connecting' }); setTimeout(() => this.joinRoom(code), 1500); return; }
        this.say(text); this.backHome();
      }
    });
  }
  backHome() { if (this.room) { this.room.close(); this.room = null; } this.setState({ phase: 'room', res: null }); setTimeout(() => this.openHost(), 300); }
  freeSeat(order, R) {
    R = R || this.state.roster;
    const n = this.size();
    for (const t of order) for (let k = 0; k < n; k++) if (!R.some((x) => x.team === t && x.slot === k)) return [t, k];
    return null;
  }
  // the host owns the list of who sits where, and tells everyone
  setRoster(R, fmt) {
    this.setState({ roster: R }, () => this.lobbyOut(fmt));
  }
  lobbyOut(fmt) { if (this.room && this.room.isHost) this.room.send({ t: 'lobby', roster: this.state.roster, fmt: fmt || this.state.fmt, code: this.code }); }
  guests() { return this.state.roster.filter((x) => !x.host).length; }
  catalog(sport) {
    const team = (n, soon) => ({ id: 'm' + n, title: n + 'VS' + n, kind: 'team', n, soon, desc: soon ? 'Partido por equipos. Lo estamos preparando.' : n === 1 ? 'Tú contra otro jugador, con porteros.' : n + ' contra ' + n + ', con porteros.' });
    const teams = (soon) => [1, 2, 3, 4].map((n) => team(n, soon));
    const S = {
      futbol: { name: 'FÚTBOL', c1: '#145A33', c2: '#22914F', modes: teams(false).concat([
        { id: 'pens', title: 'TANDA DE PENALTIS', kind: 'duel', duel: 'pen', desc: '5 tiros y 5 paradas por turnos. Muerte súbita.' },
        { id: 'fk', title: 'TIROS LIBRES', kind: 'duel', duel: 'free', desc: '7 escenarios distintos, con barrera.' }]),
        train: [{ id: 'train', title: 'PENALTIS Y FALTAS', href: 'Entrenamiento.dc.html', desc: 'Práctica libre con dianas y todos los escenarios.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      baloncesto: { name: 'BALONCESTO', c1: '#7A3B12', c2: '#C2652A', modes: teams(true).concat([

        { id: 'ft', title: 'TIROS LIBRES', kind: 'mg', comp: 'Baloncesto', mode: 'free', unit: 'puntos', rival: [4, 9], desc: '10 tiros libres. Gana quien meta más.' }]),
        train: [{ id: 'train', title: 'PISTA LIBRE', href: 'Baloncesto.dc.html', desc: 'Triples y tiros libres sin presión.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      tenis: { name: 'TENIS', c1: '#1E3A8A', c2: '#2563C9', modes: teams(true).slice(0, 2).concat([
        { id: 'serve', title: 'DESAFÍO DE SAQUE', kind: 'mg', comp: 'Tenis', mode: 'serve', unit: 'puntos', rival: [6, 16], desc: '10 saques alternando lados. 1 punto en el cuadro, 3 en la zona marcada.' },
        { id: 'rally', title: 'DESAFÍO DE PELOTEO', kind: 'mg', comp: 'Tenis', mode: 'rally', unit: 'puntos', rival: [6, 16], desc: '10 bolas de la máquina: devuélvelas dentro; 3 puntos en la zona marcada.' }]),
        train: [{ id: 'train', title: 'PISTA DE TENIS', href: 'Tenis.dc.html', desc: 'Saques y peloteo sin presión.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] },
      voley: { name: 'VÓLEY', c1: '#7A6430', c2: '#C9A85C', modes: teams(true).concat([
        { id: 'serve', title: 'DESAFÍO DE SAQUE', kind: 'mg', comp: 'Voley', mode: 'serve', unit: 'puntos', rival: [8, 22], desc: '10 saques. Las zonas marcadas valen 3.' },
        { id: 'spike', title: 'DESAFÍO DE REMATE', kind: 'mg', comp: 'Voley', mode: 'spike', unit: 'puntos', rival: [10, 24], desc: '10 remates contra el bloqueo.' }]),
        train: [{ id: 'train', title: 'PISTA LIBRE', href: 'Voley.dc.html', desc: 'Saques y remates a tu ritmo.' }, { id: 'tut', title: 'TUTORIAL', href: 'Tutorial.dc.html', desc: 'Repasa los controles paso a paso.' }] }

  }
  tiers() {

      { name: 'Bronce', c1: '#C07A3E', c2: '#7A4520', text: '#E3A56E', wins: 4, start: 0 },
      { name: 'Plata', c1: '#C9D2DF', c2: '#6D788A', text: '#DCE3EE', wins: 6, start: 300 },
      { name: 'Oro', c1: '#F2C14E', c2: '#A8771A', text: '#F2C14E', wins: 8, start: 750 },
      { name: 'Platino', c1: '#5FD3C6', c2: '#24786F', text: '#7FE3D7', wins: 10, start: 1350 },
      { name: 'Diamante', c1: '#6FB6FF', c2: '#2A5FB0', text: '#8CC5FF', wins: 13, start: 2100 },
      { name: 'Campeón', c1: '#B57BFF', c2: '#5E2FA8', text: '#C79BFF', wins: 16, start: 3075, wings: true },
      { name: 'Super campeón', c1: '#FF5C8A', c2: '#A3204A', text: '#FF86A6', wins: 20, start: 4275, wings: true },

  rankOf(m) {
    const T = this.tiers();
    let i = T.length - 1;
    while (i > 0 && m < T[i].start) i--;
    const t = T[i], step = t.wins * 25;
    const div = Math.min(2, Math.floor((m - t.start) / step));
    const lo = t.start + div * step;
    const hi = div < 2 ? lo + step : (i < T.length - 1 ? T[i + 1].start : lo + step);
    return { ...t, div, label: t.name + ' ' + (div + 1), lo, hi, idx: i * 3 + div };
  }
  store(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
    return null;
  }
  mmrOf(sport, id) {
    const all = this.store('arenamix.mmr.v1') || {};

  }
  say(t) {

      const add = (k) => {

      add('all'); add(sport);

      if (window.AMProgress) {

  }
  finish(r) { const f = this.fmtObj(); this.recordMatch(this.sport, f ? f.kind : 'team', r); this.setState({ phase: 'result', res: r }); }
  renderVals() {
    const s = this.state, f = this.fmtObj(), n = this.size();
    const guest = s.net === 'guest', guests = this.guests(), online = s.net === 'host' || guest;
    const formats = this.C.modes.filter((m) => !m.soon).map((m) => ({
      title: m.title,
      style: 'height: 36px; padding: 0 12px; border-radius: 10px; font: 800 12px Exo2, sans-serif; cursor: ' + (guest ? 'default' : 'pointer') + '; ' + (m.id === s.fmt ? 'background: #22D3EE; color: #040A1C; border: 0;' : 'background: #0B1A44; color: #CACAE0; border: 1px solid #1E3A6E;') + (guest && m.id !== s.fmt ? ' opacity: .45;' : ''),
      pick: () => {

    const meId = this.room && this.room.me;
    const slot = (team, i) => {
      const key = team + i, tn = team === 'A' ? 0 : 1;
      const occ = online ? s.roster.find((x) => x.team === tn && x.slot === i) : null;
      const you = online ? !!occ && occ.id === meId : team === 'A' && i === 0;
      const kind = you ? 'you' : occ ? 'player' : online ? 'ai' : this.slotKind(key);
      const ping = occ && !you ? (s.net === 'host' ? this.room.pings[occ.id] : occ.host ? this.room.ping : 0) : 0;
      const name = you ? s.name + ' (tú)' : occ ? occ.name : kind === 'friend' ? 'Amigo invitado' : 'IA ' + (team === 'A' ? 'compañera' : 'rival') + (n > 1 ? ' ' + (team === 'A' ? i : i + 1) : '');
      const tag = occ && occ.host ? 'ANFITRIÓN' + (ping ? ' · ' + ping + ' ms' : '') : you ? 'TÚ' : occ ? 'CONECTADO' + (ping ? ' · ' + ping + ' ms' : '') : online ? (s.net === 'host' && tn === 0 ? 'IA · toca para ponerte' : 'IA · toca para ponerte') : kind === 'friend' ? 'ESPERANDO…' : 'IA · toca para invitar';
      const segS = (on) => 'height: 30px; padding: 0 12px; border: 0; border-radius: 8px; font: 800 12px Exo2, sans-serif; cursor: pointer; ' + (on ? 'background: #22D3EE; color: #040A1C;' : 'background: transparent; color: #CACAE0;');
    return {
      canKeep: n === 4,
      fieldStyle: segS(!s.keeper), keeperStyle: segS(!!s.keeper),
      setField: () => this.setState({ keeper: false }), setKeeper: () => this.setState({ keeper: true }),
      asKeeper: n === 4 && !!s.keeper,
        name, tag, ini: (name || '?').replace(/^IA\s*/, '').trim().charAt(0).toUpperCase() || 'IA',
        // a face for everybody: yours, or a character picked from the name
        avStyle: (() => { const pc = you ? '#22D3EE' : occ ? '#53D88E' : kind === 'friend' ? '#3DA9FF' : tn === 0 ? '#FF8A3D' : '#3EA6FF'; const A = window.AMChars, mine = you && A && A.pref() !== 'clasico' ? 'assets/chars/' + A.pref() + '.png' : ''; const PICS = ['dani', 'leo', 'nico', 'remy', 'ty', 'vegas']; let h = 7; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const pic = mine || 'assets/chars/' + PICS[h % PICS.length] + '.png'; return '--pc: ' + pc + '; background: url(' + pic + ') center 20%/cover, radial-gradient(circle at 50% 30%, ' + pc + ', #06102E);' + (kind === 'friend' && !occ ? ' filter: grayscale(1) brightness(.6);' : ''); })(),
        style: 'display: flex; justify-content: space-between; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 8px; border-radius: 12px; font: 800 13px Exo2, sans-serif; color: #F4F4FA; text-align: left; cursor: ' + (you ? 'default' : 'pointer') + '; border: 0; ' + (you ? 'background: linear-gradient(90deg, #0A3DCCAA, #06102EE6 70%); box-shadow: inset 4px 0 0 #22D3EE, inset 0 0 0 1px #3DA9FF88, 0 6px 14px #0007;' : kind === 'friend' ? 'background: linear-gradient(90deg, #3A1A7099, #06102EE6 70%); box-shadow: inset 4px 0 0 #3DA9FF, inset 0 0 0 1px #3DA9FF66;' : 'background: linear-gradient(90deg, ' + (tn === 0 ? '#FF8A3D33' : '#3EA6FF33') + ', #06102EE0 60%); box-shadow: inset 4px 0 0 ' + (tn === 0 ? '#FF8A3D' : '#3EA6FF') + ', inset 0 0 0 1px #ffffff1a, 0 6px 14px #0006;'),
        tagStyle: 'font-size: 10px; letter-spacing: .5px; color: ' + (you ? '#22D3EE' : kind === 'player' ? '#53D88E' : kind === 'friend' ? '#3DA9FF' : '#8FA8CC') + ';',
        tap: () => {

            // sit here: the host only on its own team (it runs the match from that side)
            if (s.net === 'host') { if (tn !== 0) { this.say('El anfitrión juega en el equipo local'); return; } this.setRoster(s.roster.map((x) => (x.id === meId ? { ...x, slot: i } : x))); }
            else this.room.send({ t: 'seat', team: tn, slot: i });

          const slots = { ...s.slots, [key]: kind === 'friend' ? 'ai' : 'friend' }; this.setState({ slots }); if (kind !== 'friend') this.say('Hueco reservado para un amigo. Pásale el código ' + this.code + '.');
        }
      };
    };
    const teamA = Array.from({ length: n }, (_, i) => slot('A', i)), teamB = Array.from({ length: n }, (_, i) => slot('B', i));
    // the colours each team will wear (the same rules as the match: AMTeams)
    const TM = window.AMTeams, plan = (() => {

      const lookAt = (tn, i) => { const o = online ? s.roster.find((x) => x.team === tn && x.slot === i) : null; return o && o.id !== meId ? o.look || null : null; };
      const isMe = (tn, i) => (online ? !!s.roster.find((x) => x.team === tn && x.slot === i && x.id === meId) : tn === 0 && i === 0);
      if (n === 1) {

        const pB = isMe(1, 0) ? TM.prefs() : (lookAt(1, 0) || {}).cols || TM.aiPrefs(null, 'IA rival');
        return TM.resolve1v1(pA, pB);

    })();
    const inkOf = (c) => (TM && !TM.clash(c, '#0A0F24') ? c : '#9FB4D8');
    // player cards in their team's colour, bigger when there are fewer of them (the room fills the space)
    const H = n === 1 ? 112 : n === 2 ? 80 : n === 3 ? 58 : 44, AV = n === 1 ? 78 : n === 2 ? 56 : n === 3 ? 42 : 32;
    const card = (p, c, side) => {
      const you = p.tag === 'TÚ';
      p.style = 'display: flex; justify-content: space-between; align-items: center; gap: 12px; height: ' + H + 'px; padding: 0 14px 0 10px; border-radius: 14px; border: 0; cursor: ' + (you ? 'default' : 'pointer') + '; text-align: left; color: #F4F7FF; font: 400 ' + (n <= 2 ? 17 : 13) + 'px Titulos, sans-serif; letter-spacing: .5px; background: linear-gradient(' + (side ? 270 : 90) + 'deg, ' + c + (you ? '66' : '33') + ', #06102EE6 62%); box-shadow: inset ' + (side ? -5 : 5) + 'px 0 0 ' + c + ', inset 0 0 0 1px ' + c + (you ? 'AA' : '44') + ', 0 6px 14px #0007' + (you ? ', 0 0 18px ' + c + '55' : '') + ';';
      p.avStyle += ' width: ' + AV + 'px; height: ' + AV + 'px; --pc: ' + c + ';';
    };
    teamA.forEach((p) => card(p, plan.home.c, 0));
    teamB.forEach((p) => card(p, plan.away.c, 1));
    const colV = { colA: plan.home.c, colB: plan.away.c, inkA: inkOf(plan.home.c), inkB: inkOf(plan.away.c),
      nameA: TM ? (n === 1 ? TM.nameOf(plan.home.c) : plan.home.c === TM.LOGO.home.c ? 'Colores ARENA MIX' : 'Color del club') : '',
      nameB: TM ? (n === 1 ? TM.nameOf(plan.away.c) : plan.away.c === TM.LOGO.away.c ? 'Colores ARENA MIX' : 'Color del club') : '',
      colBtn: !!TM && n === 1,
      openCols: () => { if (!TM) return; TM.openPicker(() => {
        // tell the room: the host updates its own seat, a guest says hello again with its new colours
        if (this.room && s.net === 'host') this.setRoster(this.state.roster.map((x) => (x.id === meId ? { ...x, look: this.look() } : x)));
        else if (this.room && s.net === 'guest') this.room.send({ t: 'hello', name: this.myName, look: this.look() });
        this.forceUpdate();
      }); } };
    const res = s.res, won = res && res.home > res.away, lost = res && res.home < res.away;
    const live = s.phase === 'match';

      netDot: 'width: 8px; height: 8px; border-radius: 4px; background: ' + (s.net === 'host' || guest ? '#53D88E' : s.net === 'connecting' ? '#FFC53D' : '#5A7099') + '; box-shadow: 0 0 8px ' + (s.net === 'host' || guest ? '#53D88E' : 'transparent') + ';',
      myName: s.name,
      onName: (e) => { const v = e.currentTarget.value.replace(/[^\wÁÉÍÓÚÑáéíóúñ .-]/g, '').slice(0, 16); this.setState({ name: v }); },
      saveName: () => {
        const v = (s.name || '').trim() || this.myName; this.myName = v; if (window.AMOnline) window.AMOnline.setName(v);
        this.setState({ name: v });

      isGuest: guest, notGuest: !guest, leaveRoom: () => { this.say('Has salido de la sala'); this.backHome(); },
      online: onlineMatch, offlineTeam: live && f.kind === 'team' && !onlineMatch, isOnlineMatch: !!onlineMatch,
      rivalTeamName: onlineMatch ? (onlineMatch.myTeam === 0 ? 'Rival' : 'Rival') : 'Equipo rival',

      isDuelMatch: live && f.kind === 'duel',
      isBasket: live && f.kind === 'mg' && f.comp === 'Baloncesto', isTenis: live && f.kind === 'mg' && f.comp === 'Tenis', isVoley: live && f.kind === 'mg' && f.comp === 'Voley',
      formats, teamA, teamB, ...colV,
      note: online ? (guest ? 'Toca un hueco libre para cambiarte de sitio. El anfitrión elige el modo y empieza el partido.' : 'Pasa el código ' + this.code + ' a tus amigos: entran con «Unirse con código». Los huecos libres los juega la IA.') : f.kind === 'team' && n > 1 ? 'Los huecos libres los juega la IA. En el partido puedes darle órdenes: ¡Pásala!, ¡Chuta!, ¡Atrás! y ¡Presiona!.' : 'Sin conexión online: de momento tu rival lo juega la IA.',
      showJoin: s.showJoin, joinCode: s.joinCode,
      toggleJoin: () => this.setState({ showJoin: !s.showJoin }),
      onJoinInput: (e) => this.setState({ joinCode: e.currentTarget.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6) }),
      join: () => {
        const c = s.joinCode;
        if (c.length < 5) { this.say('El código tiene 5 caracteres.'); return; }
        if (c === this.code) { this.say('Ese es el código de tu propia sala.'); return; }
        this.setState({ showJoin: false }); this.joinRoom(c);
      },
      invite: () => {
        const text = 'Únete a mi partida de ARENA MIX con el código ' + this.code + ': ' + location.href.split('#')[0];
        if (navigator.share) navigator.share({ title: 'ARENA MIX', text }).catch(() => {});
        else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => this.say('Invitación copiada. Pégala en un chat con tus amigos.'), () => this.say('Código de sala: ' + this.code));

      onScore: (score) => this.finish({ home: score, away: s.target }),
      fmtTitle: f.title,
      resTitle: won ? '¡VICTORIA!' : lost ? 'DERROTA' : 'EMPATE',
      resTitleStyle: 'font-family: \'Barlow Condensed\', sans-serif; font-weight: 800; font-style: italic; font-size: 48px; line-height: 1; letter-spacing: 2px; color: ' + (won ? '#22D3EE' : lost ? '#FF5C5C' : '#F4F4FA') + ';',

  }
