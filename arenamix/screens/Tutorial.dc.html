<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tutorial</title>
<script src="./support.js"></script>
<script src="/_blob/de0c1b42c380e04fabb186f97a299f57"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
.tu-chalk{position:absolute;left:0;top:0;width:430px;height:390px;pointer-events:none;opacity:.22}
.tu-chalk path,.tu-chalk circle{stroke-dasharray:7 7;animation:tuChalk 1.6s linear infinite}
@keyframes tuChalk{to{stroke-dashoffset:-28}}
.tu-step{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 22%,#17172A),#141428 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 40%,transparent),0 4px 0 #05050A;animation:tuIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes tuIn{from{opacity:0;transform:translateX(30px)}}
.tu-ic{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--sc);color:#0B0B14;box-shadow:0 0 12px color-mix(in srgb,var(--sc) 60%,transparent)}
.tu-ic svg{animation:tuBob 1.8s ease-in-out infinite}
@keyframes tuBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scale(1.08)}}
.tu-n{margin-left:auto;font:800 italic 22px/1 'Barlow Condensed',sans-serif;color:color-mix(in srgb,var(--sc) 70%,#fff);opacity:.5}
.tu-go{position:relative;display:flex;align-items:center;gap:10px}
.tu-go .rg{position:absolute;inset:0;border-radius:14px;box-shadow:0 0 0 2px #22D3EE;opacity:0;animation:tuRing 2.2s ease-out infinite;pointer-events:none}
@keyframes tuRing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.5)}}
.tu-ball{animation:tuSpin 1.4s linear infinite}
@keyframes tuSpin{to{transform:rotate(360deg)}}
.tu-whistle{animation:tuWh 2.6s ease-in-out infinite;transform-origin:30% 60%}
@keyframes tuWh{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg) scale(1.1)}90%{transform:rotate(10deg) scale(1.1)}}
</style>
</helmet>
<div class="bc-stage" style="position: relative; width: 844px; height: 390px; overflow: hidden;  isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif">
  <div class="am-bg under"></div>
  <div class="bc-beams" style="z-index: -1"></div>
  <sc-if value="{{isIntro}}" hint-placeholder-val="{{ true }}">
    <div style="{{introBg}}"></div>
    <svg class="tu-chalk" viewBox="0 0 430 390" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M40 330l16 16M56 330l-16 16M330 60l16 16M346 60l-16 16" style="animation: none; stroke-dasharray: none"/><circle cx="90" cy="70" r="12"/><circle cx="380" cy="300" r="12"/><path d="M60 320C120 250 90 160 150 120"/><path d="M110 76C200 40 280 50 330 70"/><path d="M370 290C330 220 380 160 300 140"/></svg>
    <div style="position: absolute; inset: 0; display: flex; align-items: center; gap: 36px; padding: 0 48px">
      <div style="width: 300px; display: flex; flex-direction: column; gap: 10px">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #FFC53D"><svg class="tu-whistle" width="26" height="22" viewBox="0 0 30 24"><path d="M2 10h14l6-6h6v8a9 9 0 1 1-18 0z" fill="#FFC53D" stroke="#7A4E0E" stroke-width="1.5" stroke-linejoin="round"/><circle cx="19" cy="14" r="3" fill="#7A4E0E"/></svg>PRIMERA VEZ EN {{sportName}}</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 52px; line-height: .95">TUTORIAL</span>
        <span style="font-size: 14px; line-height: 1.5; color: #CACAE0">{{introText}}</span>
        <div style="display: flex; gap: 10px; margin-top: 6px">
          <button type="button" onClick="{{play}}" class="bc-btn am-shine tu-go" style="height: 54px; padding: 0 28px 0 18px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #9AF5FF, #22D3EE 60%, #0EA5C0); color: #0B0B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 24px; letter-spacing: 2px; cursor: pointer; box-shadow: inset 0 2px 0 #FFFFFFAA, 0 5px 0 #0E8FA3, 0 0 20px #22D3EE66"><span class="rg"></span><span class="rg" style="animation-delay: -1.1s"></span><svg class="tu-ball" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#FFFFFF" stroke="#0B0B14" stroke-width="1.6"/><path d="M12 7l3.4 2.5l-1.3 4h-4.2l-1.3-4z" fill="#0B0B14"/><path d="M12 7V3M15.4 9.5l3.8-1.2M14.1 13.5l2.3 3.3M9.9 13.5l-2.3 3.3M8.6 9.5L4.8 8.3" stroke="#0B0B14" stroke-width="1.3"/></svg>EMPEZAR</button>
          <a href="Modos.dc.html" onClick="{{skip}}" style="display: flex; align-items: center; height: 54px; padding: 0 18px; border-radius: 14px; border: 1.5px solid #4C4C78; color: #CACAE0; text-decoration: none; font-weight: 700; font-size: 14px">Saltar</a>
        </div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #A3A3C2">VAS A APRENDER</span>
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
          <div class="tu-step" style="--sc: {{st.c}}; animation-delay: {{st.d}}s">
            <span class="tu-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{st.icon}}"/></svg></span>
            <span style="font-size: 13px; font-weight: 800">{{st.text}}</span>
            <span class="tu-n">{{st.n}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{isFoot}}" hint-placeholder-val="{{ false }}">
    <dc-import name="Partido" tutorial="{{ true }}" mode="quick" team-size="2" duration="600" autostart="{{ true }}" home-name="Invitado_4821" mates="{{mates}}" rivals="{{rivals}}" away-name="Entrenador" away-color="#3EA6FF" away-trim="#0B0B14" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import>
  </sc-if>
  <sc-if value="{{isBasket}}" hint-placeholder-val="{{ false }}"><dc-import name="Baloncesto" mode="three" locked="{{ true }}" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import></sc-if>
  <sc-if value="{{isTenis}}" hint-placeholder-val="{{ false }}"><dc-import name="Tenis" mode="serve" locked="{{ true }}" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import></sc-if>
  <sc-if value="{{isVoley}}" hint-placeholder-val="{{ false }}"><dc-import name="Voley" mode="serve" locked="{{ true }}" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import></sc-if>
  <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(circle at 50% 40%, #12304A, #0B0B14 70%)">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #A3A3C2">TUTORIAL DE {{sportName}}</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 56px; line-height: 1; color: #22D3EE">{{doneTitle}}</span>
      <span style="font-size: 14px; color: #CACAE0; text-align: center; max-width: 420px">{{doneText}}</span>
      <a href="Modos.dc.html" class="bc-btn am-shine" style="margin-top: 8px; display: flex; align-items: center; height: 52px; padding: 0 34px; border-radius: 14px; background: #22D3EE; color: #0B0B14; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 22px; letter-spacing: 2px; box-shadow: 0 5px 0 #0E8FA3">IR A LOS MODOS</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let sport = 'futbol';
    try { sport = JSON.parse(localStorage.getItem('arenamix.sport') || '"futbol"') || 'futbol'; } catch (e) {}
    this.sport = sport;
    this.state = { phase: 'intro', skipped: false };
  }
  markDone() {
    try {
      const d = JSON.parse(localStorage.getItem('arenamix.tut.v1') || '{}') || {};
      d[this.sport] = true;
      localStorage.setItem('arenamix.tut.v1', JSON.stringify(d));
    } catch (e) {}
  }
  info() {
    return {
      futbol: { name: 'FÚTBOL', bg: '#145A33', text: 'Un partido de práctica guiado, paso a paso. Unos 2 minutos.', steps: ['Moverte con el joystick', 'Coger el balón y esprintar', 'Pasar a un compañero', 'Regatear a un rival', 'Chutar a puerta y recuperar el balón'] },
      baloncesto: { name: 'BALONCESTO', bg: '#7A3B12', text: 'Una ronda de práctica del concurso de triples.', steps: ['Desliza el dedo hacia arriba para tirar', 'La longitud del gesto es la fuerza: busca la zona verde', 'La dirección del gesto es el apunte', 'El último balón de cada posición vale doble'] },
      tenis: { name: 'TENIS', bg: '#1E3A8A', text: 'Una ronda de práctica de saques.', steps: ['Espera a que la bola esté arriba', 'Desliza hacia el cuadro de saque iluminado', 'Más rápido = saque más fuerte', 'La zona verde vale 3 puntos'] },
      voley: { name: 'VÓLEY', bg: '#7A6430', text: 'Una ronda de práctica de saques.', steps: ['Desliza hacia la pista rival para sacar', 'Más rápido = saque más fuerte', 'Las zonas marcadas valen 3 puntos', '10 saques en total'] }
    }[this.sport] || null;
  }
  renderVals() {
    const s = this.state, I = this.info() || this.info.call({ sport: 'futbol' });
    const play = s.phase === 'play';
    return {
      sportName: I.name, introText: I.text,
      introBg: 'position: absolute; inset: 0; background: linear-gradient(120deg, ' + I.bg + ' 0%, #0B0B14 60%);',
      // each step with its own colour and a little icon: move, sprint, pass, dribble, shoot
      steps: I.steps.map((t, k) => ({ n: String(k + 1), text: t, d: (0.1 + k * 0.08).toFixed(2),
        c: ['#22D3EE', '#FFC53D', '#A78BFA', '#53D88E', '#FF8A3D'][k % 5],
        icon: ['M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6', 'M13 2L4 14h7l-1 8l9-12h-7z', 'M4 12h14M12 6l6 6l-6 6', 'M4 18c4 0 4-12 8-12s4 12 8 12', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7a5 5 0 1 0 0 10a5 5 0 1 0 0-10M12 11a1 1 0 1 0 0 2'][k % 5] })),
      isIntro: s.phase === 'intro', isDone: s.phase === 'done',
      isFoot: play && this.sport === 'futbol', isBasket: play && this.sport === 'baloncesto', isTenis: play && this.sport === 'tenis', isVoley: play && this.sport === 'voley',
      mates: ['Compañero'], rivals: ['Rival', 'Rival 2'],
      play: () => this.setState({ phase: 'play' }),
      skip: () => this.markDone(),
      onEnd: (r) => { this.markDone(); this.setState({ phase: 'done', skipped: !!(r && r.skipped) }); },
      doneTitle: s.skipped ? 'TUTORIAL SALTADO' : '¡COMPLETADO!',
      doneText: s.skipped ? 'Puedes repetirlo cuando quieras desde Entrenamiento.' : 'Ya sabes lo básico. Ahora elige un modo: Competitivo, Informal o Entrenamiento.'
    };
  }
}
</script>
</body>
</html>
