<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tutorial</title>
<script src="./support.js"></script>
<script src="/_blob/de0c1b42c380e04fabb186f97a299f57"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D3EE}a:hover{color:#67E8F9}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: #0B0B14; color: #F4F4FA; font-family: Manrope, sans-serif">
  <sc-if value="{{isIntro}}" hint-placeholder-val="{{ true }}">
    <div style="{{introBg}}"></div>
    <div style="position: absolute; inset: 0; display: flex; align-items: center; gap: 36px; padding: 0 48px">
      <div style="width: 300px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #FFC53D">PRIMERA VEZ EN {{sportName}}</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 52px; line-height: .95">TUTORIAL</span>
        <span style="font-size: 14px; line-height: 1.5; color: #CACAE0">{{introText}}</span>
        <div style="display: flex; gap: 10px; margin-top: 6px">
          <button type="button" onClick="{{play}}" style="height: 54px; padding: 0 34px; border: 0; border-radius: 14px; background: #22D3EE; color: #0B0B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 24px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 5px 0 #0E8FA3">EMPEZAR</button>
          <a href="Modos.dc.html" onClick="{{skip}}" style="display: flex; align-items: center; height: 54px; padding: 0 18px; border-radius: 14px; border: 1.5px solid #4C4C78; color: #CACAE0; text-decoration: none; font-weight: 700; font-size: 14px">Saltar</a>
        </div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #A3A3C2">VAS A APRENDER</span>
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #17172A; border: 1px solid #26264A">
            <span style="flex: none; width: 28px; height: 28px; border-radius: 14px; background: #22D3EE; color: #0B0B14; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px">{{st.n}}</span>
            <span style="font-size: 13px; font-weight: 700">{{st.text}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{isFoot}}" hint-placeholder-val="{{ false }}">
    <dc-import name="Partido" tutorial="{{ true }}" mode="quick" team-size="2" duration="600" autostart="{{ true }}" home-name="Invitado_4821" mates="{{mates}}" rivals="{{rivals}}" away-name="Entrenador" away-color="#3EA6FF" away-trim="#0B0B14" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import>
  </sc-if>
  <sc-if value="{{isBasket}}" hint-placeholder-val="{{ false }}"><dc-import name="Baloncesto" mode="three" locked="{{ true }}" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import></sc-if>
  <sc-if value="{{isTenis}}" hint-placeholder-val="{{ false }}"><dc-import name="Tenis" mode="serve" locked="{{ true }}" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import></sc-if>
  <sc-if value="{{isVoley}}" hint-placeholder-val="{{ false }}"><dc-import name="Voley" mode="serve" locked="{{ true }}" on-end="{{onEnd}}" hint-size="844px,390px"></dc-import></sc-if>
  <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(circle at 50% 40%, #12304A, #0B0B14 70%)">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #A3A3C2">TUTORIAL DE {{sportName}}</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 56px; line-height: 1; color: #22D3EE">{{doneTitle}}</span>
      <span style="font-size: 14px; color: #CACAE0; text-align: center; max-width: 420px">{{doneText}}</span>
      <a href="Modos.dc.html" style="margin-top: 8px; display: flex; align-items: center; height: 52px; padding: 0 34px; border-radius: 14px; background: #22D3EE; color: #0B0B14; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 22px; letter-spacing: 2px; box-shadow: 0 5px 0 #0E8FA3">IR A LOS MODOS</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let sport = 'futbol';
    try { sport = JSON.parse(localStorage.getItem('arenamix.sport') || '"futbol"') || 'futbol'; } catch (e) {}
    this.sport = sport;
    this.state = { phase: 'intro', skipped: false };
  }
  markDone() {
    try {
      const d = JSON.parse(localStorage.getItem('arenamix.tut.v1') || '{}') || {};
      d[this.sport] = true;
      localStorage.setItem('arenamix.tut.v1', JSON.stringify(d));
    } catch (e) {}
  }
  info() {
    return {
      futbol: { name: 'FÚTBOL', bg: '#145A33', text: 'Un partido de práctica guiado, paso a paso. Unos 2 minutos.', steps: ['Moverte con el joystick', 'Coger el balón y esprintar', 'Pasar a un compañero', 'Regatear a un rival', 'Chutar a puerta y recuperar el balón'] },
      baloncesto: { name: 'BALONCESTO', bg: '#7A3B12', text: 'Una ronda de práctica del concurso de triples.', steps: ['Desliza el dedo hacia arriba para tirar', 'La longitud del gesto es la fuerza: busca la zona verde', 'La dirección del gesto es el apunte', 'El último balón de cada posición vale doble'] },
      tenis: { name: 'TENIS', bg: '#1E3A8A', text: 'Una ronda de práctica de saques.', steps: ['Espera a que la bola esté arriba', 'Desliza hacia el cuadro de saque iluminado', 'Más rápido = saque más fuerte', 'La zona verde vale 3 puntos'] },
      voley: { name: 'VÓLEY', bg: '#7A6430', text: 'Una ronda de práctica de saques.', steps: ['Desliza hacia la pista rival para sacar', 'Más rápido = saque más fuerte', 'Las zonas marcadas valen 3 puntos', '10 saques en total'] }
    }[this.sport] || null;
  }
  renderVals() {
    const s = this.state, I = this.info() || this.info.call({ sport: 'futbol' });
    const play = s.phase === 'play';
    return {
      sportName: I.name, introText: I.text,
      introBg: 'position: absolute; inset: 0; background: linear-gradient(120deg, ' + I.bg + ' 0%, #0B0B14 60%);',
      steps: I.steps.map((t, k) => ({ n: String(k + 1), text: t })),
      isIntro: s.phase === 'intro', isDone: s.phase === 'done',
      isFoot: play && this.sport === 'futbol', isBasket: play && this.sport === 'baloncesto', isTenis: play && this.sport === 'tenis', isVoley: play && this.sport === 'voley',
      mates: ['Compañero'], rivals: ['Rival', 'Rival 2'],
      play: () => this.setState({ phase: 'play' }),
      skip: () => this.markDone(),
      onEnd: (r) => { this.markDone(); this.setState({ phase: 'done', skipped: !!(r && r.skipped) }); },
      doneTitle: s.skipped ? 'TUTORIAL SALTADO' : '¡COMPLETADO!',
      doneText: s.skipped ? 'Puedes repetirlo cuando quieras desde Entrenamiento.' : 'Ya sabes lo básico. Ahora elige un modo: Competitivo, Informal o Entrenamiento.'
    };
  }
}
</script>
</body>
</html>
