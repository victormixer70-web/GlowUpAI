<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ranking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes rkIn{from{opacity:0;transform:translateX(20px)}}
@keyframes rkGlow{0%,100%{box-shadow:inset 0 0 0 1.5px #22D3EE,0 0 14px #22D3EE55}50%{box-shadow:inset 0 0 0 1.5px #22D3EE,0 0 24px #22D3EEAA}}
.rk-tab{position:relative;z-index:1;height:32px;width:120px;border:0;background:none;font:800 11.5px Exo2,sans-serif;letter-spacing:.6px;cursor:pointer;transition:color .3s}
.rk-pod{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;width:150px;border-radius:18px 18px 8px 8px;padding:8px 6px 10px;box-sizing:border-box;animation:rkIn .45s cubic-bezier(.2,1.3,.4,1) both}
.rk-pod img{width:58px;height:58px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--pc),0 0 18px var(--pc)}
.rk-pod b{font:800 italic 15px/1 'Barlow Condensed',sans-serif;max-width:136px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-pod span{font:800 10px Exo2,sans-serif;color:#FFFFFFCC}
.rk-pod .n{position:absolute;top:-14px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pc);color:#040A1C;font:800 16px 'Barlow Condensed',sans-serif;box-shadow:0 0 12px var(--pc)}
.rk-list{position:absolute;right:16px;top:62px;bottom:12px;width:388px;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:5px}
.rk-list::-webkit-scrollbar{display:none}
.rk-row{flex:none;display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 8px;border-radius:12px;background:linear-gradient(90deg,#0B2A78E6,#24105AE6);box-shadow:inset 0 0 0 1px #A78BFA44;animation:rkIn .35s both}
.rk-row.me{background:linear-gradient(90deg,#0E7490,#1D4ED8);animation:rkGlow 1.8s ease-in-out infinite}
.rk-row .p{flex:none;width:26px;text-align:center;font:800 15px 'Barlow Condensed',sans-serif;color:#E9D5FF}
.rk-row img{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #ffffff55}
.rk-row .nm{flex:1;min-width:0;font:800 12.5px Exo2,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-row .rk{flex:none;padding:2px 8px;border-radius:8px;font:800 9.5px Exo2,sans-serif;letter-spacing:.5px;color:#040A1C}
.rk-row .mm{flex:none;width:58px;text-align:right;font:800 13px 'Barlow Condensed',sans-serif;color:#FDE68A}
</style>
</helmet>
<div class="bc-stage" style="position: relative; width: 844px; height: 390px; overflow: hidden; isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif">
  <div class="am-bg under"></div>
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 80px; height: 390px; z-index: 3"><dc-import name="Nav" active="jugar" hint-size="80px,390px"></dc-import></div>
  <div style="position: absolute; left: 96px; right: 16px; top: 12px; height: 40px; display: flex; align-items: center; gap: 12px">
    <a href="Deportes.dc.html" aria-label="Volver" class="bc-para" style="flex: none; width: 46px; height: 38px; display: flex; align-items: center; justify-content: center; background: #0B1A44; color: #F4F4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
    <h1 class="bc-title hd" style="font-size: 28px; margin: 0">RANKING</h1>
    <span style="padding: 4px 10px; border-radius: 10px; background: #00000044; font: 800 11px Exo2, sans-serif; color: #FDE68A">TEMPORADA {{season}} · {{daysLeft}}</span>
    <span style="flex: 1"></span>
    <div role="tablist" style="position: relative; display: flex; padding: 3px; border-radius: 14px; background: #040A1CCC; border: 1px solid #2E2E58">
      <span aria-hidden="true" style="{{thumb}}"></span>
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" class="rk-tab" style="{{t.style}}">{{t.label}}</button></sc-for>
    </div>
  </div>
  <!-- the podium -->
  <div key="{{tabKey}}" style="position: absolute; left: 96px; top: 70px; width: 324px; bottom: 12px; display: flex; align-items: flex-end; justify-content: center; gap: 6px">
    <sc-for list="{{podium}}" as="q" hint-placeholder-count="3">
      <div class="rk-pod" style="{{q.style}}"><span class="n">{{q.n}}</span><img src="{{q.pic}}" alt=""><b translate="no">{{q.name}}</b><span>{{q.rank}} · {{q.mmr}}</span></div>
    </sc-for>
  </div>
  <div key="{{tabKey}}" class="rk-list">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div class="{{r.cls}}" style="{{r.delay}}"><span class="p">{{r.pos}}</span><img src="{{r.pic}}" alt=""><span class="nm" translate="no">{{r.name}}</span><span class="rk" style="{{r.rkStyle}}">{{r.rank}}</span><span class="mm">{{r.mmr}}</span></div>
    </sc-for>
    <sc-if value="{{showNote}}" hint-placeholder-val="{{ false }}"><span style="padding: 8px 4px; font-size: 11px; font-weight: 700; color: #A6DCFF; text-align: center">{{note}}</span></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
const Rk_TIERS = [['Bronce', 0, '#E3A56E'], ['Plata', 300, '#DCE3EE'], ['Oro', 750, '#F2C14E'], ['Platino', 1350, '#7FE3D7'], ['Diamante', 2100, '#8CC5FF'], ['Campeón', 3075, '#C79BFF'], ['Super campeón', 4275, '#FF86A6'], ['Élite', 5775, '#FFE38A']];
const Rk_NAMES = ['ZetaFC', 'Golazo99', 'LaPulga_7', 'TikiTaka', 'ElMuro', 'Rayo_Vk', 'CapitanX', 'Bota_Oro', 'Chilena23', 'Panenka', 'Crack_10', 'ElMago', 'Torpedo', 'Rabona_', 'Zurdito', 'Pichichi', 'LaBestia', 'Tifón', 'Regatista', 'Volea_Pro', 'Cañonero', 'Libero', 'Mister_G', 'Furia', 'Delantero', 'Orsay', 'Taconazo', 'SuperSub', 'Ninja_FC', 'Galáctico'];
const Rk_PICS = ['ty', 'vegas', 'granny', 'remy', 'leo', 'nico', 'dani'];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'global' }; }
  rankOf(m) { let t = Rk_TIERS[0]; Rk_TIERS.forEach((x) => { if (m >= x[1]) t = x; }); return t; }
  myMmr() { try { const a = JSON.parse(localStorage.getItem('arenamix.mmr.v1') || '{}') || {}; return Object.keys(a).reduce((m, k) => Math.max(m, a[k] || 0), 0); } catch (e) { return 0; } }
  season() { const EPOCH = Date.UTC(2026, 9, 1), LEN = 30 * 864e5, now = Date.now(), n = Math.max(0, Math.floor((now - EPOCH) / LEN)); return { num: n + 1, days: Math.max(1, Math.ceil((EPOCH + (n + 1) * LEN - now) / 864e5)) }; }
  renderVals() {
    const s = this.state, S = this.season(), me = window.AMOnline ? window.AMOnline.myName() : 'Tú', mm = this.myMmr();
    const A = window.AMChars, myPic = 'assets/chars/' + (A && A.pref() !== 'clasico' ? A.pref() : 'dani') + '.png';
    const rnd = (k) => { const x = Math.sin((k + 1) * 9301 + S.num * 49297) * 233280; return x - Math.floor(x); };
    let list;
    if (s.tab === 'global') {
      // this season's top players (the league everyone plays in), you among them
      list = Rk_NAMES.map((name, i) => ({ name, mmr: Math.round(6200 * Math.pow(1 - i / Rk_NAMES.length, 1.6) + rnd(i) * 120 + 60), pic: Rk_PICS[Math.floor(rnd(i + 50) * 7)] }));
      list.push({ name: me, mmr: mm, pic: null, me: true });
    } else {
      const F = window.AMSocial ? window.AMSocial.state().friends : [];
      list = [{ name: me, mmr: mm, pic: null, me: true }].concat(F.map((f) => ({ name: f.name, mmr: null, pic: Rk_PICS[[...f.name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % 7], on: f.on })));
    }
    list.sort((a, b) => (b.mmr ?? -1) - (a.mmr ?? -1));
    const pic = (x) => x.me ? myPic : 'assets/chars/' + x.pic + '.png';
    const row = (x, i) => { const R = x.mmr == null ? null : this.rankOf(x.mmr); return { pos: String(i + 1), name: x.name + (x.me ? ' (TÚ)' : ''), pic: pic(x), cls: 'rk-row' + (x.me ? ' me' : ''), rank: R ? R[0].toUpperCase() : (x.on ? 'EN LÍNEA' : 'SIN DATOS'), rkStyle: 'background: ' + (R ? R[2] : x.on ? '#4ADE80' : '#94A3B8') + ';', mmr: x.mmr == null ? '—' : x.mmr + ' MMR', delay: 'animation-delay: ' + Math.min(0.6, i * 0.03).toFixed(2) + 's' }; };
    const top = list.slice(0, 3), PC = ['#FBBF24', '#E2E8F0', '#D97706'], H = [200, 160, 130];
    const order = top.length === 3 ? [1, 0, 2] : top.map((_, i) => i);
    return {
      season: String(S.num), daysLeft: S.days + (S.days === 1 ? ' DÍA' : ' DÍAS'),
      tabKey: s.tab,
      tabs: [['global', 'GLOBAL', '#FBBF24'], ['amigos', 'AMIGOS', '#4ADE80']].map(([id, label, c]) => ({ label, sel: id === s.tab ? 'true' : 'false', pick: () => this.setState({ tab: id }), style: 'color: ' + (id === s.tab ? '#040A1C' : c) + ';' })),
      thumb: 'position: absolute; top: 3px; bottom: 3px; left: ' + (s.tab === 'global' ? 3 : 123) + 'px; width: 120px; border-radius: 11px; background: ' + (s.tab === 'global' ? '#FBBF24' : '#4ADE80') + '; transition: left .4s cubic-bezier(.3,1.4,.45,1), background .3s;',
      podium: order.map((k) => { const x = top[k], R = x.mmr == null ? null : this.rankOf(x.mmr); return { n: String(k + 1), name: x.name, pic: pic(x), rank: R ? R[0] : 'Amigo', mmr: x.mmr == null ? '—' : x.mmr, style: '--pc: ' + PC[k] + '; height: ' + H[k] + 'px; background: linear-gradient(180deg, ' + PC[k] + '66, ' + PC[k] + '18 60%, #05123A); box-shadow: inset 0 0 0 1.5px ' + PC[k] + ', 0 0 20px ' + PC[k] + '44; animation-delay: ' + (k * 0.1) + 's;' }; }),
      rows: list.map(row),
      showNote: s.tab === 'amigos', note: list.length < 2 ? 'Añade amigos en Social para competir con ellos.' : 'El rango de tus amigos aparece cuando juegan en este móvil o en línea contigo.'
    };
  }
}
</script>
</body>
</html>
