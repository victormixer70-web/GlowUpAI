<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi estadio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes meIn{from{opacity:0;transform:translateY(14px)}}
@keyframes meLed{from{transform:translateX(0)}to{transform:translateX(-160px)}}
@keyframes meFlash{0%,100%{opacity:.35}50%{opacity:.9}}
.me-card{position:relative;border-radius:20px;background:linear-gradient(165deg,#3B1A8AF0,#1A0B44F0);box-shadow:inset 0 0 0 1px #A78BFA66,inset 0 1px 0 #ffffff26,0 14px 30px #0009;animation:meIn .4s cubic-bezier(.2,1.3,.4,1) both;overflow:hidden}
.me-h{display:flex;align-items:center;gap:6px;font:800 10px Exo2,sans-serif;letter-spacing:2px;color:#FDE68A;margin-top:2px}
.me-h i{flex:1;height:2px;border-radius:1px;background:linear-gradient(90deg,#FDE68A,transparent)}
.me-in{width:100%;height:34px;box-sizing:border-box;padding:0 12px;border-radius:11px;border:1px solid #ffffff33;background:#00000044;color:#fff;font:800 italic 16px 'Barlow Condensed',sans-serif;letter-spacing:.5px;outline:0}
.me-in:focus{border-color:#FDE68A}
.me-sw{width:24px;height:24px;padding:0;border-radius:8px;cursor:pointer;transition:transform .15s}
.me-sw:active{transform:scale(.9)}
.me-chip{height:26px;padding:0 10px;border:0;border-radius:9px;font:800 10.5px Exo2,sans-serif;cursor:pointer;white-space:nowrap}
.me-led{animation:meLed 6s linear infinite}
.me-light{animation:meFlash 2.4s ease-in-out infinite}
</style>
</helmet>
<div class="bc-stage" style="position: relative; width: 844px; height: 390px; overflow: hidden; isolation: isolate; color: #F4F4FA; font-family: Exo2, sans-serif">
  <div class="am-bg under"></div>
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 80px; height: 390px; z-index: 3"><dc-import name="Nav" active="perfil" hint-size="80px,390px"></dc-import></div>
  <div style="position: absolute; left: 96px; right: 16px; top: 12px; height: 40px; display: flex; align-items: center; gap: 12px">
    <a href="{{backHref}}" aria-label="Volver" class="bc-para" style="flex: none; width: 46px; height: 38px; display: flex; align-items: center; justify-content: center; background: #251443; color: #F4F4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
    <h1 class="bc-title hd" style="font-size: 28px; margin: 0">MI ESTADIO</h1>
    <span style="font-size: 11px; font-weight: 700; color: #C4B5FD">En los 1 VS 1 se sortea si jugáis en tu estadio o en el del rival</span>
    <span style="flex: 1"></span>
    <span style="{{savedStyle}}">✓ GUARDADO</span>
  </div>

  <div style="position: absolute; left: 96px; right: 16px; top: 62px; bottom: 12px; display: flex; gap: 12px">
    <!-- live preview -->
    <div class="me-card" style="flex: none; width: 420px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
      <svg width="400" height="268" viewBox="0 0 460 300" style="border-radius: 14px; display: block">
        <defs>
          <linearGradient id="me-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{sky1}}"/><stop offset="1" stop-color="{{sky2}}"/></linearGradient>
          <linearGradient id="me-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{c1d}}"/><stop offset="1" stop-color="{{c1}}"/></linearGradient>
          <clipPath id="me-pc"><polygon points="70,128 390,128 450,262 10,262"/></clipPath>
          <clipPath id="me-led"><rect x="20" y="112" width="420" height="16"/></clipPath>
        </defs>
        <rect width="460" height="300" fill="url(#me-sky)"/>
        <sc-for list="{{lights}}" as="l" hint-placeholder-count="4"><g class="me-light" style="{{l.st}}"><rect x="{{l.x}}" y="6" width="34" height="12" rx="3" fill="#FFFBEA"/><circle cx="{{l.cx}}" cy="12" r="26" fill="#FFFBEA" opacity=".25"/></g></sc-for>
        <!-- main stand with its rows of seats -->
        <polygon points="30,40 430,40 450,112 10,112" fill="url(#me-st)"/>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><line x1="{{r.x1}}" y1="{{r.y}}" x2="{{r.x2}}" y2="{{r.y}}" stroke="{{c2}}" stroke-opacity=".28" stroke-width="1.5"/></sc-for>
        <sc-for list="{{fans}}" as="f" hint-placeholder-count="20"><circle cx="{{f.x}}" cy="{{f.y}}" r="2.4" fill="{{f.c}}"/></sc-for>
        <rect x="190" y="26" width="80" height="22" rx="3" fill="#0B0B14" stroke="{{c1}}" stroke-width="2"/>
        <text x="230" y="41" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-style="italic" font-weight="800" font-size="11" fill="{{c2}}">{{shortName}}</text>
        <!-- LED boards -->
        <rect x="20" y="112" width="420" height="16" fill="#0B0B14"/>
        <g clip-path="url(#me-led)"><g class="me-led"><sc-for list="{{ledTxt}}" as="t" hint-placeholder-count="4"><text x="{{t.x}}" y="124" font-family="Barlow Condensed, sans-serif" font-style="italic" font-weight="800" font-size="12" fill="{{c2}}">{{ledName}}</text></sc-for></g></g>
        <!-- the pitch, in perspective, with its cut -->
        <polygon points="70,128 390,128 450,262 10,262" fill="{{g1}}"/>
        <g clip-path="url(#me-pc)">
          <sc-for list="{{cuts}}" as="c" hint-placeholder-count="6"><polygon points="{{c.p}}" fill="{{g2}}"/></sc-for>
          <sc-for list="{{rings}}" as="c" hint-placeholder-count="0"><ellipse cx="230" cy="195" rx="{{c.rx}}" ry="{{c.ry}}" fill="{{c.f}}"/></sc-for>
        </g>
        <polygon points="70,128 390,128 450,262 10,262" fill="none" stroke="#ffffff" stroke-width="2"/>
        <line x1="230" y1="128" x2="230" y2="262" stroke="#ffffff" stroke-width="2"/>
        <ellipse cx="230" cy="190" rx="38" ry="18" fill="none" stroke="#ffffff" stroke-width="2"/>
        <polygon points="58,152 108,152 100,222 34,222" fill="none" stroke="#ffffff" stroke-width="2"/>
        <polygon points="352,152 402,152 426,222 360,222" fill="none" stroke="#ffffff" stroke-width="2"/>
        <!-- near stand -->
        <polygon points="0,270 460,270 460,300 0,300" fill="{{c1d}}"/>
        <rect x="0" y="262" width="460" height="9" fill="#0B0B14"/>
      </svg>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="flex: none; width: 34px; height: 38px; display: flex; align-items: center; justify-content: center; clip-path: path('M17 0L34 6V20C34 30 26 35 17 38C8 35 0 30 0 20V6Z'); background: linear-gradient(160deg, {{c1}} 55%, {{c2}} 55%)"><b style="font: 800 12px Exo2, sans-serif; color: #fff; text-shadow: 0 1px 2px #000">{{ini}}</b></span>
        <div style="display: flex; flex-direction: column; min-width: 0"><b translate="no" style="font: 800 italic 20px/1.05 'Barlow Condensed', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{name}}</b><span style="font-size: 10.5px; font-weight: 700; color: #C4B5FD">{{summary}}</span></div>
      </div>
    </div>
    <!-- controls -->
    <div class="me-card" style="flex: 1; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; scrollbar-width: none">
      <span class="me-h">NOMBRE DEL ESTADIO<i></i></span>
      <input class="me-in" maxlength="22" value="{{draft}}" onInput="{{onName}}" aria-label="Nombre del estadio">
      <span class="me-h">ASIENTOS Y GRADAS<i></i></span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{sw1}}" as="w" hint-placeholder-count="10"><button type="button" class="me-sw" aria-label="Color de las gradas" style="{{w.style}}" onClick="{{w.pick}}"></button></sc-for></div>
      <span class="me-h">VALLAS LED Y DETALLES<i></i></span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{sw2}}" as="w" hint-placeholder-count="10"><button type="button" class="me-sw" aria-label="Color de las vallas" style="{{w.style}}" onClick="{{w.pick}}"></button></sc-for></div>
      <span class="me-h">CORTE DEL CÉSPED<i></i></span>
      <div style="display: flex; flex-wrap: wrap; gap: 5px"><sc-for list="{{pats}}" as="c" hint-placeholder-count="6"><button type="button" class="me-chip" style="{{c.style}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
      <span class="me-h">TONO DEL CÉSPED<i></i></span>
      <div style="display: flex; flex-wrap: wrap; gap: 5px"><sc-for list="{{grs}}" as="c" hint-placeholder-count="4"><button type="button" class="me-chip" style="{{c.style}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
      <span class="me-h">HORARIO DE TUS PARTIDOS<i></i></span>
      <div style="display: flex; flex-wrap: wrap; gap: 5px"><sc-for list="{{tms}}" as="c" hint-placeholder-count="4"><button type="button" class="me-chip" style="{{c.style}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
const ME_GRASS = { verde: ['#1f8f3a', '#27a447'], oscuro: ['#11531f', '#18682a'], claro: ['#3fae4f', '#52c463'], azulado: ['#1b6f55', '#23866a'] };
const ME_SKY = { auto: ['#1B1050', '#7C3AED'], dia: ['#5DB4F0', '#CFE8FF'], atardecer: ['#2A1660', '#FF7A59'], noche: ['#04060F', '#1B2350'] };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cfg: window.AMStad ? window.AMStad.get() : null, saved: 0 };
  }
  save(v) {
    if (!window.AMStad) return;
    const cfg = window.AMStad.set(v);
    this.setState({ cfg, saved: Date.now() });
    clearTimeout(this.svT); this.svT = setTimeout(() => this.forceUpdate(), 1300);
  }
  componentWillUnmount() { clearTimeout(this.svT); }
  renderVals() {
    const S = window.AMStad, c = this.state.cfg || (S ? S.get() : { name: 'Mi estadio', c1: '#22D3EE', c2: '#FFC53D', pitch: 'rayas', grass: 'verde', time: 'auto' });
    const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16), f = (v) => Math.round(Math.max(0, Math.min(255, v * k))).toString(16).padStart(2, '0'); return '#' + f(n >> 16) + f((n >> 8) & 255) + f(n & 255); };
    const [g1, g2] = ME_GRASS[c.grass] || ME_GRASS.verde, [s1, s2] = ME_SKY[c.time] || ME_SKY.auto;
    // the pitch is drawn in perspective: a point (u across 0..1, v down 0..1) on the field
    const P = (u, v) => { const y = 128 + v * 134, l = 70 - 60 * v, r = 390 + 60 * v; return (l + (r - l) * u).toFixed(1) + ',' + y.toFixed(1); };
    const quad = (u0, v0, u1, v1) => [P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)].join(' ');
    const cuts = [];
    if (c.pitch === 'rayas' || c.pitch === 'anchas') { const n = c.pitch === 'rayas' ? 14 : 7; for (let i = 1; i < n; i += 2) cuts.push({ p: quad(i / n, 0, (i + 1) / n, 1) }); }
    else if (c.pitch === 'cuadros') { for (let i = 0; i < 12; i++) for (let j = 0; j < 6; j++) if ((i + j) % 2) cuts.push({ p: quad(i / 12, j / 6, (i + 1) / 12, (j + 1) / 6) }); }
    else if (c.pitch === 'diagonal') { for (let i = -6; i < 14; i += 2) cuts.push({ p: [P(i / 12, 0), P((i + 1) / 12, 0), P((i + 1 + 6) / 12, 1), P((i + 6) / 12, 1)].join(' ') }); }
    const rings = c.pitch === 'circulos' ? [6, 5, 4, 3, 2, 1].map((k) => ({ rx: 36 * k, ry: 18 * k, f: k % 2 ? g2 : g1 })) : [];
    const fans = [];
    for (let r = 0; r < 6; r++) for (let i = 0; i < 34; i++) { const y = 48 + r * 11, l = 30 - (y - 40) * 0.28, rr = 430 + (y - 40) * 0.28; if ((i * 7 + r * 3) % 5 === 0) continue; fans.push({ x: (l + (rr - l) * (i + 0.5) / 34).toFixed(1), y: y.toFixed(1), c: (i + r) % 3 ? c.c2 : '#F4F4FA' }); }
    const lab = (list, v) => (list.find((x) => x[0] === v) || [0, ''])[1];
    const chip = (on) => on ? 'background: linear-gradient(135deg, #FDE68A, #F59E0B); color: #2A1400; box-shadow: 0 2px 0 #92400E;' : 'background: #ffffff1a; color: #fff;';
    const sw = (key, cur) => (S ? S.COLORS : []).map((col) => ({ pick: () => this.save({ [key]: col }), style: 'background: ' + col + '; border: ' + (cur === col ? '3px solid #fff; box-shadow: 0 0 12px ' + col + ';' : '2px solid #ffffff33;') }));
    const opts = (list, key) => (list || []).map(([v, label]) => ({ label, pick: () => this.save({ [key]: v }), style: chip(c[key] === v) }));
    const name = c.name, up = name.toUpperCase();
    const hasHist = typeof history !== 'undefined' && history.length > 1;
    return {
      backHref: 'Perfil.dc.html',
      savedStyle: 'padding: 4px 10px; border-radius: 10px; background: #053B26; color: #4ADE80; font: 800 10.5px Exo2, sans-serif; letter-spacing: 1px; transition: opacity .3s; opacity: ' + (Date.now() - this.state.saved < 1200 ? 1 : 0),
      sky1: s1, sky2: s2, c1: c.c1, c1d: shade(c.c1, 0.55), c2: c.c2, g1, g2, cuts, rings, fans,
      rows: [0, 1, 2, 3, 4, 5].map((r) => { const y = 44 + r * 11; return { y: y + 6, x1: 30 - (y - 40) * 0.28, x2: 430 + (y - 40) * 0.28 }; }),
      lights: [40, 140, 286, 386].map((x, k) => ({ x, cx: x + 17, st: 'animation-delay: ' + (-k * 0.6) + 's; display: ' + (c.time === 'dia' ? 'none' : 'inline') })),
      ledTxt: [0, 1, 2, 3, 4, 5].map((k) => ({ x: 24 + k * 160 })), ledName: up + ' ·', shortName: up.length > 14 ? up.slice(0, 13) + '…' : up,
      name, ini: (name.replace(/^estadio\s+/i, '').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]/g, '').slice(0, 2) || 'ME').toUpperCase(),
      summary: lab(S ? S.PATTERNS : [], c.pitch) + ' · ' + lab(S ? S.GRASS : [], c.grass) + ' · ' + lab(S ? S.TIMES : [], c.time),
      draft: this.state.draft ?? name,
      onName: (e) => { const v = e.target.value; this.state.draft = v; if (v.trim()) this.save({ name: v }); else this.forceUpdate(); },
      sw1: sw('c1', c.c1), sw2: sw('c2', c.c2),
      pats: opts(S && S.PATTERNS, 'pitch'), grs: opts(S && S.GRASS, 'grass'), tms: opts(S && S.TIMES, 'time')
    };
  }
}
</script>
</body>
</html>
